<!-- PAGE RETIRÉE le 17 août 2026 (LOT 1, vague E). `teasing.html` annonçait
     des nouveautés livrées depuis. 49 Ko, aucun lien entrant dans le dépôt,
     absente du sitemap, sans canonique : une page que plus personne n'atteint
     autrement que par un vieux signet ou un résultat de recherche périmé.

     POURQUOI CE FICHIER EXISTE PLUTÔT QUE RIEN. Règle d'or n°3 : toute
     ancienne URL = redirection 301, jamais 404. La 301 est prête dans
     `redirections-cloudflare.csv`, mais c'est un item de CHEMIN : il reste
     inopérant tant que `zonetotalsport.ca` est en DNS only, sans proxy
     Cloudflare. Supprimer le fichier aujourd'hui fabriquerait exactement le
     404 que la règle interdit — c'est la raison pour laquelle Joey a refusé la
     suppression sèche.

     GitHub Pages ne sait pas répondre 301. On fait donc ce qui s'en approche
     le plus, comme pour les cinq pages sportives d'août : `canonical` vers
     l'accueil pour transmettre le signal aux moteurs, `noindex` pour sortir de
     l'index, rafraîchissement immédiat pour le visiteur.

     SUPPRESSION RÉELLE : au chantier proxy orange, quand les 7 items de chemins
     de `zts_sous_domaines_301` s'activeront. Voir REDIRECTIONS-CLOUDFLARE.md,
     et la checklist du même chantier. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://zonetotalsport.ca/">
<meta http-equiv="refresh" content="0; url=https://zonetotalsport.ca/">
<script>location.replace('https://zonetotalsport.ca/');</script>
<style>
  body { font-family: system-ui, sans-serif; background:#061726; color:#E6F4FA;

  a { color:#FFEA00; }
</style>
</head>

  </div>
</body>
