# Garde-fous du depot — secrets, habillage, glyphes.
#
# Deux modes de panne silencieux motivent ce workflow :
#
#   1. Un secret pousse est irreversible. C'est pour ca que l'etape secrets
#      passe EN PREMIER, comme dans .githooks/pre-commit — le hook local est
#      contournable par --no-verify, la CI ne l'est pas.
#
#   2. Si assets/ztsh-shell.css est charge AVANT shared/zts.css ou
#      zts-header.css, ses surcharges perdent la cascade et l'habillage est
#      partiellement inactif, sans aucune erreur ni en console ni a l'oeil.
#      Ca se diagnostique comme « le shell ne marche pas » plutot que comme
#      un ordre de balises. Voir DETTE-TECHNIQUE-HABILLAGE.md D18.
#
# PAS DE FILTRE `paths` — retire le 12 aout 2026 (D22). Il valait
# ['apps/**', 'assets/ztsh-*', 'shared/**', '_scripts/verifie-*'] et laissait
# la racine, jeux/ et articles/ sans aucun controle : firebase-auth.js,
# firestore.rules, index.html, les scripts de verrou et locked-whitelist.json
# passaient en CI sans etre regardes. Preuve : b257195 (le favicon de 1440
# pages, 1441 fichiers) n'a declenche AUCUN run.
#
# Deuxieme raison, moins visible et plus penible : GitHub evalue `paths` sur
# l'ENSEMBLE du push, pas commit par commit. Un commit racine etait donc
# controle ou non selon ce qu'on se trouvait pousser avec lui — 78b26d5 (un
# seul .md) a ete verifie parce qu'il voyageait avec 9a1d046, qui touchait
# assets/. Une couverture qui depend du groupage des commits est moins fiable
# qu'une absence de filtre. Enumerer des chemins est ce qui a cree le trou ;
# on n'en ajoute donc pas, on supprime le filtre.
#
# Cout : ~35 s (secrets, arbre complet) + ~27 s (habillage + glyphes) sur
# chaque push, au lieu d'a peu pres un push sur deux.
name: Garde-fous du depot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verifie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --arbre est OBLIGATOIRE ici : la CI n'a pas d'index, et le mode indexe
      # y trouverait zero fichier. Le script refuse ce cas (sortie 2) plutot
      # que de rendre un vert qui n'a rien lu — mais autant ne pas l'y mettre.
      - name: Detection de secrets
        run: bash _scripts/verifie-secrets.sh --arbre

      # Le seul rempart entre 112 Mo de banques et le web ouvert est une
      # convention Jekyll : GitHub Pages n'exporte pas les dossiers prefixes
      # `_`, donc `_data/` n'est pas servi. Poser un `.nojekyll` a la racine
      # desactive Jekyll et REEXPOSE tout, instantanement et en silence — le
      # site continuerait de marcher, personne ne verrait rien.
      # C'est le patron maison : une panne muette se garde en CI.
      # Si `.nojekyll` devient un jour necessaire, il faudra d'abord sortir les
      # banques du depot (R2 seul, sans copie versionnee) — pas contourner ceci.
      - name: Aucun .nojekyll (il reexposerait _data/)
        run: |
          if [ -e .nojekyll ]; then
            echo "REFUSE — un .nojekyll est apparu a la racine."
            echo
            echo "Il desactive Jekyll, donc GitHub Pages se remet a servir les"
            echo "dossiers prefixes '_'. Consequence immediate : les banques de"
            echo "_data/ redeviennent telechargeables par n'importe qui, et le"
            echo "verrou du LOT 1 vague D tombe sans que rien ne casse."
            echo
            echo "Voir LOT1-VAGUE-D.md. Si tu as vraiment besoin de .nojekyll,"
            echo "sors d'abord les banques du depot."
            exit 1
          fi
          echo "OK — pas de .nojekyll, _data/ reste hors de l'arbre publie."

      - name: Conformite de l'habillage
        run: python3 _scripts/verifie-habillage.py

      - name: Glyphes de la police de marque
        run: python3 _scripts/verifie-glyphes-ztsh.py
