<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page retirée — Zone Total Sport</title>
<!-- PAGE RETIRÉE le 17 août 2026 (LOT 1, vague E). `index-old.html` était
     l'ancienne page d'accueil : 494 Ko, aucun lien entrant dans le dépôt,
     absente du sitemap, et son canonique pointait DÉJÀ sur `/`. Elle chargeait
     par ailleurs `zts-lock-page.js` — un visiteur anonyme se prenait donc un
     mur d'inscription sur une demi-mégaoctet de page morte.

     POURQUOI CE FICHIER EXISTE PLUTÔT QUE RIEN. Règle d'or n°3 : toute
     ancienne URL = redirection 301, jamais 404. La 301 est prête dans
     `redirections-cloudflare.csv`, mais c'est un item de CHEMIN : il reste
     inopérant tant que `zonetotalsport.ca` est en DNS only, sans proxy
     Cloudflare. Supprimer le fichier aujourd'hui fabriquerait exactement le
     404 que la règle interdit.

     GitHub Pages ne sait pas répondre 301. On fait donc ce qui s'en approche
     le plus : `canonical` vers l'accueil, `noindex`, rafraîchissement immédiat.
     Le canonique ne change pas de cible — il pointait déjà `/`, il continue.

     SUPPRESSION RÉELLE : au chantier proxy orange, avec `teasing.html` et les
     cinq pages sportives. Voir REDIRECTIONS-CLOUDFLARE.md. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://zonetotalsport.ca/">
<meta http-equiv="refresh" content="0; url=https://zonetotalsport.ca/">
<script>location.replace('https://zonetotalsport.ca/');</script>
<style>
  body { font-family: system-ui, sans-serif; background:#061726; color:#E6F4FA;
         display:grid; place-items:center; min-height:100vh; margin:0; text-align:center; padding:24px; }
  a { color:#FFEA00; }
</style>
</head>
<body>
  <div>
    <p>Cette page a été remplacée par la nouvelle page d'accueil.</p>
    <p><a href="https://zonetotalsport.ca/">Aller à l'accueil de Zone Total Sport</a></p>
  </div>
</body>
</html>
