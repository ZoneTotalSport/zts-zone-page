<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur de fiches — Zone Total Sport</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&family=Comic+Neue:wght@400;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fiches/zts-fiche.css">
<style>
  #zts-gate { position: fixed; inset: 0; z-index: 90; background: rgba(16,16,16,.82);
              display: none; align-items: center; justify-content: center; padding: 24px; }
  #zts-gate .carte { width: 400px; max-width: 100%; background: #fff; border: 4px solid #1A1A2E;
                     border-radius: 16px; box-shadow: 8px 8px 0 #1A1A2E; padding: 26px 26px 22px; }
  #zts-gate h2 { font-family: 'Luckiest Guy', cursive; font-size: 24px; margin: 0 0 4px; color: #1A1A2E; }
  #zts-gate p { margin: 0 0 16px; font-size: 13.5px; color: #555; }
  #zts-gate input { width: 100%; box-sizing: border-box; border: 3px solid #1A1A2E; border-radius: 10px;
                    padding: 10px 12px; font-family: 'Quicksand', sans-serif; font-weight: 600;
                    font-size: 15px; margin-bottom: 10px; }
  #zts-gate-msg { display: none; color: #FF2D2D; font-weight: 700; font-size: 13px; margin: 8px 0 0; }
  #zts-barre-outils { position: sticky; top: 0; z-index: 40; padding: 14px 12px; background: #22ccf5; }
  #zts-liste-boite { display: none; position: fixed; right: 18px; top: 84px; z-index: 45; width: 330px;
                     max-height: 70vh; overflow: auto; background: #fff; border: 4px solid #000;
                     box-shadow: 8px 8px 0 #101010; font-family: 'Quicksand', sans-serif; }
  #zts-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
              margin-top: 10px; font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 13px; }
  #zts-statut { background: #101010; color: #FFF200; padding: 5px 12px; letter-spacing: 1px;
                font-family: 'Bangers', cursive; font-size: 15px; }
  #zts-slug { color: #0f4a5c; }
  @media print { #zts-barre-outils, #zts-liste-boite, #zts-gate { display: none !important; } }
</style>
</head>
<body class="zts-fiche-body">

<!-- Porte admin. Meme grammaire visuelle que apps/studio-jeu/admin-gate.js. -->
<div id="zts-gate">
  <form class="carte" id="zts-connexion">
    <h2>Éditeur de fiches</h2>
    <p>Accès administrateur — connecte-toi pour continuer.</p>
    <input id="zts-mail" type="email" autocomplete="username" placeholder="Courriel" required>
    <input id="zts-mdp" type="password" autocomplete="current-password" placeholder="Mot de passe" required>
    <button type="submit" class="zts-bouton zts-bouton--jaune" id="zts-connexion-btn"
            style="width:100%;">SE CONNECTER</button>
    <p id="zts-gate-msg"></p>
    <p style="margin-top:14px;text-align:center;font-size:12.5px;">
      <a href="/fiches/" style="color:#888;">← Retour aux fiches publiques</a></p>
  </form>
</div>

<div id="zts-appli" style="display:none;">

  <div id="zts-barre-outils" class="zts-ui">
    <div class="zts-barre">
      <button type="button" class="zts-bouton" id="zts-nouvelle">NOUVELLE FICHE</button>
      <button type="button" class="zts-bouton" id="zts-liste">MES FICHES</button>
      <span class="zts-sep"></span>
      <button type="button" class="zts-bouton" id="zts-portrait">+ PAGE PORTRAIT</button>
      <button type="button" class="zts-bouton" id="zts-paysage">+ PAGE PAYSAGE</button>
      <button type="button" class="zts-bouton zts-bouton--gris" id="zts-retirer">– RETIRER LA DERNIÈRE</button>
      <span class="zts-sep"></span>
      <button type="button" class="zts-bouton" id="zts-edition">MODE ÉDITION</button>
      <button type="button" class="zts-bouton zts-bouton--cyan" id="zts-sauver">SAUVEGARDER</button>
      <button type="button" class="zts-bouton zts-bouton--jaune" id="zts-publier">PUBLIER</button>
      <span class="zts-sep"></span>
      <button type="button" class="zts-bouton" id="zts-apercu">APERÇU VISITEUR</button>
      <button type="button" class="zts-bouton zts-bouton--jaune" id="zts-pdf">TÉLÉCHARGER EN PDF</button>
    </div>
    <div id="zts-meta">
      <span id="zts-statut">BROUILLON</span>
      <label>Univers
        <select id="zts-univers" class="zts-champ">
          <option value="eps">ÉPS</option>
          <option value="camps">Camps de jour</option>
          <option value="sdg">Service de garde</option>
        </select>
      </label>
      <select id="zts-categorie" class="zts-champ">
        <option value="">— Publier dans… —</option>
      </select>
      <span id="zts-slug">(slug à la sauvegarde)</span>
    </div>
  </div>

  <div id="zts-liste-boite"></div>
  <div id="zts-racine"></div>
</div>

<div id="zts-etat" class="zts-etat" style="display:none;"></div>

<script src="/fiches/zts-fiche-modele.js"></script>
<script src="/fiches/zts-image-slot.js"></script>
<script src="/fiches/zts-fiches-firebase.js"></script>
<script src="/admin/fiches/zts-editeur.js"></script>
</body>
</html>
