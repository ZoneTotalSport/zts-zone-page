<!-- HEADER PARTAGÉ — injecté par zts.js dans [data-zts-header] -->

<!-- BANDE DE NAVIGATION — collée en haut, AU-DESSUS du bandeau.
     Elle reste visible au défilement, contrairement au bandeau qui se replie. -->
<div class="zts-topbar">
  <nav class="zts-header__nav" aria-label="Navigation principale">
    <!-- Les 6 entrées (Accueil · Outils pédagogiques ▾ · SAÉ ▾ · Planifications ▾ ·
         Blog · Jeux) sont construites par shared/zts-menu.js et insérées ICI,
         avant Connexion. Pour ajouter une app : une ligne dans zts-menu.js.
         Communauté et Dons vivent maintenant dans le footer. -->
    <noscript>
      <a class="zts-btn zts-btn--primary" href="{{ROOT}}index.html"><span class="em">🏠</span>Accueil</a>
      <a class="zts-btn" href="https://zonetotalsport.ca/blog.html"><span class="em">✏️</span>Blog</a>
    </noscript>

    <a class="zts-btn zts-btn--login" href="#" id="zts-login-btn" data-auth="login"><span class="em">👤</span><span data-i18n="nav.login">Connexion</span></a>

    <div class="zts-lang" role="group" aria-label="Langue / Language">
      <button type="button" data-lang="fr" data-i18n="lang.fr">FR</button>
      <button type="button" data-lang="en" data-i18n="lang.en">EN</button>
    </div>
  </nav>
</div>

<header class="zts-header">
  <div class="zts-header__brandwrap">
    <a class="zts-header__brand" href="{{ROOT}}index.html" aria-label="Zone Total Sport"><span class="w1">ZONE</span> <span class="w2">TOTAL</span> <span class="w3">SPORT</span></a>
    <div class="zts-header__meta">
      <span class="zts-header__clock">🕐 <span data-clock>--:--:--</span></span>
      <span class="zts-header__sub" data-i18n="brand.sub">Pédagogie Primaire</span>
    </div>
  </div>
</header>
