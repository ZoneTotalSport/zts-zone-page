const NOMS = { facebook:"Facebook", linkedin:"LinkedIn", x:"X" };

function parDate(a,b){ return (a.date+ (a.heure||"")).localeCompare(b.date+(b.heure||"")); }

let FILTRE = 'tous';
function rendre(filtre, q){
  FILTRE = filtre;
  q = (q||'').toLowerCase();
  const liste = document.getElementById('liste');
  const posts = POSTS.slice().sort(parDate);

  if(!posts.length){
    liste.innerHTML = '<div class="vide"><strong>Aucun post chargé.</strong>' +
      'Ouvre ce fichier dans un éditeur et colle les 81 posts dans le tableau ' +
      '<code>const POSTS = [ ... ]</code>, en haut du bloc &lt;script&gt;. ' +
      'Le modèle exact est en commentaire juste au-dessus.</div>';
    return;
  }

  // prochain = premier post dont la date/heure n'est pas passée
  const maintenant = new Date();
  const prochain = posts.find(p => new Date(p.date + 'T' + (p.heure||'00:00')) >= maintenant);

  const visibles = posts.filter(p => (filtre === 'tous' || p.reseau === filtre) &&
    (!q || ((p.article||'') + ' ' + (p.slug||'') + ' ' + (p.texte||'')).toLowerCase().indexOf(q) > -1));
  liste.innerHTML = '';
  visibles.forEach((p, i) => {
    const rang = posts.indexOf(p) + 1;
    const est = (p === prochain);
    const el = document.createElement('article');
    if(est) el.className = 'prochain';
    const tete = document.createElement('div');
    tete.className = 'tete';
    tete.innerHTML =
      '<span class="rang">#' + rang + ' · S' + (p.semaine||'?') + '</span>' +
      '<span class="reseau ' + (p.reseau||'') + '">' + (NOMS[p.reseau]||p.reseau||'?') + '</span>' +
      '<span class="quand">' + (p.date_fr || p.date || '') + (p.heure ? ' · ' + p.heure : '') + '</span>' +
      (p.appat_seo ? '<span class="appat">★ appât SEO</span>' : '') +
      (est ? '<span class="badge-prochain">PROCHAIN</span>' : '');
    el.appendChild(tete);

    if(p.article){
      const h = document.createElement('div');
      h.className = 'titre-article';
      h.textContent = p.article + (p.univers ? '  —  ' + p.univers : '');
      el.appendChild(h);
    }

    const txt = document.createElement('div');
    txt.className = 'texte';
    txt.textContent = p.texte || '(texte manquant)';
    el.appendChild(txt);

    const pied = document.createElement('div');
    pied.className = 'pied';
    const btn = document.createElement('button');
    btn.className = 'copier';
    btn.textContent = 'Copier le post';
    btn.addEventListener('click', function(){
      const t = p.texte || '';
      // Repli obligatoire : navigator.clipboard REJETTE quand la page n'a pas
      // le focus (onglet en arriere-plan, panneau de previsualisation). Sans
      // repli, le bouton ne dit rien et on croit que le clic n'a pas pris.
      function repli(){
        try{
          const z = document.createElement('textarea');
          z.value = t; z.setAttribute('readonly','');
          z.style.cssText = 'position:fixed;top:-1000px;opacity:0';
          document.body.appendChild(z); z.select(); z.setSelectionRange(0, t.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(z);
          return ok;
        }catch(e){ return false; }
      }
      function dire(ok){
        btn.textContent = ok ? '✔ Copié' : '✖ Échec — copie à la main';
        btn.classList.toggle('ok', ok); btn.classList.toggle('ko', !ok);
        setTimeout(function(){
          btn.textContent = 'Copier le post';
          btn.classList.remove('ok','ko');
        }, ok ? 1800 : 3500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(function(){ dire(true); },
                                             function(){ dire(repli()); });
      } else {
        dire(repli());
      }
    });
    pied.appendChild(btn);
    const m = document.createElement('span');
    m.className = 'meta';
    let bits = [];
    if(p.lien)  bits.push('<a target="_blank" rel="noopener" href="' + p.lien + '">ouvrir l\'article</a>');
    if(p.image) bits.push('image : <code>' + p.image + '</code>');
    m.innerHTML = bits.join(' · ');
    pied.appendChild(m);
    el.appendChild(pied);
    liste.appendChild(el);
  });
}

(function barre(){
  const b = document.getElementById('barre');
  const rech = document.createElement('input');
  rech.type = 'search'; rech.placeholder = 'chercher un article, un mot du post…';
  rech.className = 'rech';
  rech.addEventListener('input', function(){ rendre(FILTRE, rech.value.trim().toLowerCase()); });
  setTimeout(function(){ b.appendChild(rech); }, 0);
  [['tous','Tous'],['facebook','Facebook'],['linkedin','LinkedIn'],['x','X']].forEach(function(f,i){
    const bt = document.createElement('button');
    bt.className = 'filtre'; bt.textContent = f[1];
    bt.setAttribute('aria-pressed', i===0 ? 'true' : 'false');
    bt.addEventListener('click', function(){
      b.querySelectorAll('.filtre').forEach(function(o){ o.setAttribute('aria-pressed','false'); });
      bt.setAttribute('aria-pressed','true');
      rendre(f[0]);
    });
    b.appendChild(bt);
  });
})();

rendre('tous');
</script>
