<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<title>Page retirée — Zone Total Sport</title>
<!-- PAGE RETIRÉE le 4 août 2026 (décision de Joey). Les apps sportives —
     séries LNH, NBA et FIFA — sont supprimées du site : les tournois sont
     terminés et les matchs du jour vivent désormais sur l'accueil.

     POURQUOI CE FICHIER EXISTE PLUTÔT QUE RIEN. Ces cinq URL sont indexées.
     La règle d'or du projet est « toute ancienne URL = redirection 301, jamais
     404 ». Les 301 sont prêtes dans `redirections-cloudflare.csv` mais elles
     se posent dans Cloudflare, à la main — tant qu'elles ne le sont pas, un
     dossier supprimé rend un 404 sec. GitHub Pages ne sait pas faire de 301,
     donc on fait ce qui s'en approche le plus : `canonical` vers l'accueil
     pour transmettre le signal aux moteurs, `noindex` pour sortir la page de
     l'index, et un rafraîchissement immédiat pour le visiteur.

     QUAND LES 301 CLOUDFLARE SERONT POSÉES, ce fichier devient inerte :
     Cloudflare intercepte avant GitHub Pages. On pourra le supprimer, ou le
     laisser comme filet. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://zonetotalsport.ca/">
<meta http-equiv="refresh" content="0; url=https://zonetotalsport.ca/">
<style>
  body { font-family: system-ui, sans-serif; background:#061726; color:#E6F4FA;
         display:grid; place-items:center; min-height:100vh; margin:0; text-align:center; padding:24px; }
  a { color:#FFEA00; }
</style>
</head>
<body>
  <div>
    <p>Cette page a été retirée.</p>
    <p><a href="https://zonetotalsport.ca/">Aller à l'accueil de Zone Total Sport</a></p>
  </div>
</body>
</html>
