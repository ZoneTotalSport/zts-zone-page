<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupe du monde FIFA 2026 — Zone Total Sport</title>
<link rel="icon" type="image/png" href="logo-zts.png">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#00E5FF; --jaune:#FFEA00; --vert:#39FF14; --rose:#FF2D87; --orange:#FF6B00;
    --ink:#0A1F2E; --deep:#004A61; --noir:#1A1A2E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Quicksand','Helvetica Neue',sans-serif; color:#fff;
    background:linear-gradient(160deg, #00D9FF 0%, #00A8E8 45%, #1E90FF 100%);
    background-attachment:fixed;
    min-height:100vh; padding:18px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  header.hero{
    text-align:center; padding:22px 18px 26px; margin-bottom:20px;
    background:linear-gradient(135deg,#00C4FF,#004A61);
    border:5px solid var(--noir); border-radius:30px; box-shadow:8px 8px 0 var(--noir);
    position:relative; overflow:hidden;
  }
  header.hero::before{content:"";position:absolute;inset:0;opacity:.12;
    background-image:radial-gradient(#fff 2px,transparent 2px);background-size:30px 30px;}
  .hero h1{font-family:'Luckiest Guy',cursive;font-size:clamp(2rem,6vw,3.6rem);line-height:1;
    text-shadow:3px 3px 0 var(--noir);position:relative}
  .hero h1 .ball{filter:drop-shadow(2px 2px 0 rgba(0,0,0,.4))}
  .hero .sub{margin-top:12px;font-weight:700;font-size:clamp(1rem,2.4vw,1.3rem);color:#EAFBFF;position:relative}
  .hero .meta{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;position:relative}
  .hero .pill{background:#fff;color:var(--ink);border:3px solid var(--noir);border-radius:999px;
    padding:5px 14px;font-family:'Luckiest Guy',cursive;font-size:.85rem;box-shadow:3px 3px 0 var(--noir)}
  .hero__bar{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:2;margin-bottom:8px}
  .hero__clock{font-family:'Luckiest Guy',cursive;font-size:1.5rem;letter-spacing:.06em;color:#fff;
    background:rgba(0,0,0,.22);border:3px solid var(--noir);border-radius:14px;padding:3px 14px;box-shadow:3px 3px 0 var(--noir)}
  .hero__home{font-family:'Luckiest Guy',cursive;text-transform:uppercase;font-size:1.05rem;letter-spacing:.04em;
    background:var(--jaune);color:#004A61;text-decoration:none;border:3px solid var(--noir);border-radius:14px;
    padding:7px 16px;box-shadow:4px 4px 0 var(--noir);white-space:nowrap}
  .hero__home:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--noir)}
  @media(max-width:640px){.hero__clock{font-size:1.1rem;padding:2px 10px}.hero__home{font-size:.85rem;padding:5px 11px}}
  .toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
  .tab{cursor:pointer;font-family:'Luckiest Guy',cursive;font-size:1rem;letter-spacing:.5px;
    padding:9px 18px;border:3px solid var(--noir);border-radius:999px;background:#fff;color:var(--ink);
    box-shadow:3px 3px 0 var(--noir)}
  .tab.active{background:var(--jaune)}
  .tab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--noir)}
  .status{text-align:center;font-weight:700;color:#CFefff;margin:30px 0}
  .round{margin:22px 0 10px;font-family:'Luckiest Guy',cursive;font-size:1.3rem;color:var(--jaune);
    text-shadow:2px 2px 0 var(--noir)}
  .matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .match{background:#fff;color:var(--ink);border:4px solid var(--noir);border-radius:18px;
    box-shadow:5px 5px 0 var(--noir);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
  .match .top{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:700;color:#5b6b77}
  .match .live{background:var(--rose);color:#fff;border-radius:999px;padding:2px 9px;font-family:'Luckiest Guy',cursive;
    animation:pulse 1.2s infinite}
  .match .ft{background:var(--noir);color:#fff;border-radius:999px;padding:2px 9px;font-weight:700}
  @keyframes pulse{50%{opacity:.55}}
  .team{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
  .team img{width:30px;height:30px;object-fit:contain;flex:0 0 auto}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .score{font-family:'Luckiest Guy',cursive;font-size:1.5rem;min-width:32px;text-align:center}
  .vsline{height:2px;background:#e6edf2;margin:2px 0}
  .venue{font-size:.75rem;color:#5b6b77;margin-top:2px}
  .fallback{background:#fff;color:var(--ink);border:4px solid var(--noir);border-radius:22px;
    box-shadow:6px 6px 0 var(--noir);padding:26px;text-align:center;max-width:620px;margin:10px auto}
  .fallback h2{font-family:'Luckiest Guy',cursive;color:var(--deep);margin-bottom:10px}
  .fallback a{display:inline-block;margin-top:16px;background:var(--jaune);color:var(--ink);text-decoration:none;
    font-family:'Luckiest Guy',cursive;border:3px solid var(--noir);border-radius:999px;padding:11px 22px;box-shadow:3px 3px 0 var(--noir)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero__bar">
      <span id="ztsClock" class="hero__clock">--:--</span>
      <a href="/" target="_top" class="hero__home">⌂ Accueil</a>
    </div>
    <h1><span class="ball">⚽</span> Coupe du monde <span style="color:var(--jaune)">FIFA 2026</span></h1>
    <div class="sub">🇨🇦 Canada · 🇺🇸 États-Unis · 🇲🇽 Mexique — 48 équipes</div>
    <div class="meta">
      <span class="pill">11 juin → 19 juillet 2026</span>
      <span class="pill">104 matchs</span>
    </div>
  </header>

  <div class="toolbar">
    <button class="tab active" data-filter="all">Tous</button>
    <button class="tab" data-filter="live">🔴 En direct</button>
    <button class="tab" data-filter="upcoming">À venir</button>
    <button class="tab" data-filter="done">Résultats</button>
  </div>

  <div id="status" class="status">⚽ Chargement du calendrier…</div>
  <div id="content"></div>
</div>

<script>
const LEAGUE_ID = 4429;     // FIFA World Cup (TheSportsDB)
const SEASON = '2026';
const API = `https://www.thesportsdb.com/api/v1/json/3/eventsseason.php?id=${LEAGUE_ID}&s=${SEASON}`;
const PROXIES = [
  u => u,
  u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
];
let ALL = [], FILTER = 'all';

async function apiFetch(url){
  const ck = 'ztsc:' + url;
  try{ const c = JSON.parse(localStorage.getItem(ck)||'null'); if(c && Date.now()-c.t < 90000) return c.d; }catch(e){}
  for(const p of PROXIES){
    try{
      const r = await fetch(p(url), { signal: AbortSignal.timeout(6000) });
      if(r.ok){ const j = await r.json(); if(j){ try{localStorage.setItem(ck,JSON.stringify({t:Date.now(),d:j}))}catch(e){} return j; } }
    }catch(e){ /* proxy suivant */ }
  }
  return null;
}

function statusOf(ev){
  const s = (ev.strStatus||'').toLowerCase();
  const prog = (ev.strProgress||'').trim();
  if(s.includes('ft')||s.includes('match finished')||s==='finished') return 'done';
  if(ev.intHomeScore!=null && ev.intAwayScore!=null && (s==='' )){
    // a un score mais statut vide → probablement terminé
    return 'done';
  }
  if(s.includes('1h')||s.includes('2h')||s.includes('ht')||s.includes('live')||s.includes('et')||s.includes('pen')||/\d/.test(prog)) return 'live';
  return 'upcoming';
}
function dt(ev){ return new Date((ev.dateEvent||'2026-06-11')+'T'+((ev.strTime||'18:00:00'))+'Z'); }

function render(){
  const c = document.getElementById('content');
  let list = ALL.slice().sort((a,b)=>dt(a)-dt(b));
  if(FILTER!=='all') list = list.filter(e=>statusOf(e)===FILTER);
  if(!list.length){ c.innerHTML = '<div class="status">Aucun match dans cette catégorie pour l’instant.</div>'; return; }

  // groupé par round/round-name
  const groups = {};
  list.forEach(e=>{ const k = e.strRound && e.strRound!=='0' ? ('Journée / Tour '+e.strRound) : (e.strLeague||'Matchs'); (groups[k]=groups[k]||[]).push(e); });
  c.innerHTML = Object.entries(groups).map(([round,evs])=>`
    <div class="round">${round}</div>
    <div class="matches">${evs.map(card).join('')}</div>
  `).join('');
}

function card(e){
  const st = statusOf(e);
  const badge = st==='live' ? '<span class="live">🔴 EN DIRECT</span>'
    : st==='done' ? '<span class="ft">TERMINÉ</span>'
    : `<span>${(e.strTime||'').slice(0,5)||'à confirmer'}</span>`;
  const sa = e.intHomeScore!=null ? e.intHomeScore : '–';
  const sb = e.intAwayScore!=null ? e.intAwayScore : '–';
  const img = u => u ? `<img src="${u}" alt="" loading="lazy">` : '<span style="width:30px"></span>';
  const d = e.dateEvent ? new Date(e.dateEvent+'T00:00:00').toLocaleDateString('fr-CA',{day:'numeric',month:'short'}) : '';
  return `<div class="match">
    <div class="top"><span>${d}</span>${badge}</div>
    <div class="row"><div class="team">${img(e.strHomeTeamBadge)}<span>${e.strHomeTeam||'À déterminer'}</span></div><div class="score">${sa}</div></div>
    <div class="vsline"></div>
    <div class="row"><div class="team">${img(e.strAwayTeamBadge)}<span>${e.strAwayTeam||'À déterminer'}</span></div><div class="score">${sb}</div></div>
    ${e.strVenue?`<div class="venue">📍 ${e.strVenue}${e.strCity?', '+e.strCity:''}</div>`:''}
  </div>`;
}

function fallback(){
  document.getElementById('status').style.display='none';
  document.getElementById('content').innerHTML = `
    <div class="fallback">
      <h2>⚽ Le calendrier arrive bientôt</h2>
      <p style="font-weight:600;line-height:1.5">La Coupe du monde 2026 se tient au Canada 🇨🇦, aux États-Unis 🇺🇸 et au Mexique 🇲🇽,
      du <b>11 juin au 19 juillet 2026</b> — 48 équipes, 104 matchs. Les scores en direct s’afficheront ici dès le coup d’envoi.</p>
      <a href="https://www.fifa.com/fr/tournaments/mens/worldcup/canadamexicousa2026" target="_blank" rel="noopener">Voir sur FIFA.com →</a>
    </div>`;
}

async function load(){
  const data = await apiFetch(API);
  const events = data && data.events;
  if(!events || !events.length){ fallback(); return; }
  ALL = events;
  document.getElementById('status').style.display='none';
  render();
  // rafraîchit les scores si des matchs sont en direct
  if(ALL.some(e=>statusOf(e)==='live')) setTimeout(refresh, 60000);
}
async function refresh(){
  const data = await apiFetch(API);
  if(data && data.events && data.events.length){ ALL = data.events; render(); }
  if(ALL.some(e=>statusOf(e)==='live')) setTimeout(refresh, 60000);
}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); FILTER=b.dataset.filter; render();
}));

load();

// Horloge
(function(){ var e=document.getElementById('ztsClock'); if(!e)return;
  function t(){ var d=new Date(); e.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  t(); setInterval(t,15000);
})();
</script>
</body>
</html>
