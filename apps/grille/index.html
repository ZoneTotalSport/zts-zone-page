  <style>
    /* ======================================================================
       GRILLE HORAIRE — habillage marine, langage visuel de l'accueil.

       Cette app monte le shell (`ZTSShell.monter({densite:'travail'})`), qui
       apporte deja le fond marine, les rayons, les polices et les tokens
       `--ztsh-*`. Elle charge EN PLUS `shared/zts-modele.css` — la meme
       feuille que l'accueil — pour en reprendre les COMPOSANTS : boutons a
       double ombre dure, panneaux a bordure noire, titres Luckiest Guy.

       ⚠ ON NE POSE PAS `ztsp-decor` SUR <html>. La feuille du patron le dit
       elle-meme (l. 146) : sur une app qui monte le shell, les deux decors
       s'empileraient. On prend les composants, pas le decor.

       REGLE DU CHANTIER : les tokens d'IDENTITE sont rebases sur la charte,
       les tokens de DIMENSION ne bougent pas. Les anciens noms (--cyan, --card,
       --border...) survivent en alias pour que les ~200 usages du fichier
       continuent de resoudre sans etre reecrits un par un.
       ====================================================================== */
    :root{
      /* ---- IDENTITE REBASEE sur la charte de l'accueil ---- */
      --cyan:   var(--ztsp-cyan,      #00C2E8);
      --cyan2:  var(--ztsp-cyan-vif,  #3ADCFA);
      --green:  var(--ztsp-lime,      #A3FF00);
      --red:    var(--ztsp-rose,      #FF0061);
      --orange: var(--ztsp-orange,    #FFA200);
      --purple: #B388FF;
      --pink:   var(--ztsp-rose,      #FF0061);
      --yellow: var(--ztsp-jaune,     #FFFC00);
      --card:   var(--ztsp-surface,   #FFFFFF);
      --border: var(--ztsp-noir,      #08131E);
      --text:   var(--ztsp-ink,       #0C1720);
      --muted:  var(--ztsp-ink-soft,  #5B6773);
      --encre:  var(--ztsp-noir,      #08131E);
      --marine: var(--ztsp-marine,    #061726);
      --sur-marine:      var(--ztsp-sur-fond,      #E6F4FA);
      --sur-marine-doux: var(--ztsp-sur-fond-doux, #C4E1EE);

      /* ---- DIMENSIONS : inchangees ---- */
      --radius: 12px;
      --r-btn:  var(--ztsp-r-btn,  11px);
      --r-card: var(--ztsp-r-card, 16px);

      /* Ombres dures decalees — les valeurs exactes de l'accueil. */
      --ombre-carte:   6px 6px 0 rgba(0,0,0,.45);
      --ombre-panneau: 8px 8px 0 rgba(0,0,0,.45);
      --ombre-petite:  3px 3px 0 rgba(0,0,0,.45);

      /* Distance entre le bas du header fixe et le contenu.
         Posee en JS par calerSousHeader() — 12 px, comme sur l'accueil.
         La valeur ici n'est qu'un repli avant le premier calcul. */
      --zg-sous-header: 344px;

      --f-titre: var(--ztsp-f-titre, 'LuckiestGuy','Luckiest Guy',system-ui,sans-serif);
      --f-corps: var(--ztsp-f-corps, 'Quicksand','Helvetica Neue',system-ui,sans-serif);
      /* La fonte de marque, reservee au titre du hero — le moment ZTS de la page. */
      --f-display: 'ZoneTotalSportZTSG','LuckiestGuy','Luckiest Guy',system-ui,sans-serif;
      /* L'ecriture manuscrite, reservee aux annotations. */
      --f-note: 'AnnieZTSG','Bradley Hand','Segoe Print',cursive;
    }

    /* ---- LES DEUX FONTES LOCALES ----------------------------------------
       `ZoneTotalSport.ttf` est la fonte de marque, celle de l'accueil.
       `size-adjust: 50%` n'est PAS optionnel : sans lui elle rend au double
       de la taille demandee et le titre deborde de son bloc. Valeur reprise
       telle quelle du shell et du patron.

       `AnnieUseYourTelescope` est une ecriture manuscrite : elle ne sert
       qu'aux ANNOTATIONS — les petites notes en marge d'un horaire. Jamais
       pour un titre, jamais pour une commande. Elle rend petit, d'ou les
       tailles relevees partout ou elle est posee.
       -------------------------------------------------------------------- */
    @font-face{
      font-family:'ZoneTotalSportZTSG';
      src:url('/fonts/ZoneTotalSport.ttf') format('truetype');
      font-display:swap;
      size-adjust:50%;
    }
    @font-face{
      font-family:'AnnieZTSG';
      src:url('/fonts/AnnieUseYourTelescope-Regular.ttf') format('truetype');
      font-display:swap;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:var(--f-corps);
      color:var(--sur-marine);
      min-height:100vh;
      overflow-x:hidden;
      font-size:17px;          /* etait 22px : trop gros, la grille debordait */
      line-height:1.45;
    }
    /* Le fond marine vient du shell. L'app ne pose plus le sien : l'ancien
       `background:url(img/bg-planification.png)` chargeait 8,9 Mo pour finir
       recouvert.

       ---- REALIGNEMENT DE LA TRAME SUR L'ACCUEIL -------------------------
       Comparaison cote a cote du 31 aout 2026, meme fenetre, les deux rendus
       cote a cote : meme marine (#061726), meme degrade 163deg, memes rayons.
       UNE couche divergeait — la trame de points.

         accueil (zts-modele.css) : les points sont sur `body::before`, un
                                    calque entier a `opacity:.5`, donc
                                    rgba(255,255,255,.16) x .5 = .08 effectif.
         shell   (ztsh-shell.css) : les points sont une couche du
                                    `background-image` de html.ztsh-on, sans
                                    opacite de calque — .16 plein.

       La texture etait donc deux fois plus marquee ici que sur l'accueil.
       On realigne POUR CETTE PAGE. Les trois couches sont recopiees parce que
       CSS ne permet pas de ne redefinir qu'une couche de `background-image`.

       ⚠ Le correctif DURABLE est dans les deux feuilles partagees, qui doivent
       porter la meme valeur (ztsh-shell.css l. 279 et zts-modele.css l. 171) —
       chantier separe : il touche les 40 apps qui montent le shell. */
    html.ztsh-on{
      background-image:
        radial-gradient(rgba(255,255,255,.08) 1.3px, transparent 1.4px),
        radial-gradient(760px 420px at 88% 4%, rgba(255,212,0,.10), transparent 70%),
        linear-gradient(163deg,#12879E 0%,#0C5C7D 28%,#0A3A5E 58%,#08243D 82%,var(--ztsh-marine,#061726) 100%);
      background-size:12px 12px,auto,auto;
      background-repeat:repeat,no-repeat,no-repeat;
      background-attachment:fixed,fixed,fixed;
    }

    /* ======================================================================
       BARRE D'ACTIONS — gros boutons picto + un mot, avance sous « Plus ».
       ====================================================================== */
    .zg-bar{
      display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center;
      max-width:1180px; margin:0 auto; padding:14px 16px 6px;
    }
    .zg-btn{
      display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
      font-family:var(--f-titre); letter-spacing:.5px; font-size:13px; line-height:1;
      min-width:84px; min-height:64px; padding:9px 14px 8px;
      border:3px solid var(--encre); border-radius:var(--r-btn);
      background:linear-gradient(180deg,var(--cyan2),var(--cyan)); color:#03323C;
      box-shadow:0 5px 0 var(--ztsp-cyan-dark,#075A6B), 5px 9px 0 rgba(0,0,0,.35);
      cursor:pointer; transition:.09s; text-decoration:none;
    }
    .zg-btn .zg-ic{font-size:22px; line-height:1}
    .zg-btn:hover { transform:translateY(-2px); box-shadow:0 7px 0 var(--ztsp-cyan-dark,#075A6B), 6px 12px 0 rgba(0,0,0,.35) }
    .zg-btn:active{ transform:translateY(4px);  box-shadow:0 1px 0 var(--ztsp-cyan-dark,#075A6B), 2px 4px 0 rgba(0,0,0,.35) }
    .zg-btn:focus-visible{ outline:3px solid var(--yellow); outline-offset:4px }
    .zg-btn--jaune {background:linear-gradient(180deg,#FFFF7A,var(--yellow)); color:#2B2A00; box-shadow:0 5px 0 var(--ztsp-jaune-deep,#C4C200), 5px 9px 0 rgba(0,0,0,.35)}
    .zg-btn--jaune:hover {box-shadow:0 7px 0 var(--ztsp-jaune-deep,#C4C200), 6px 12px 0 rgba(0,0,0,.35)}
    .zg-btn--jaune:active{box-shadow:0 1px 0 var(--ztsp-jaune-deep,#C4C200), 2px 4px 0 rgba(0,0,0,.35)}
    .zg-btn--lime  {background:linear-gradient(180deg,#C9FF6B,var(--green)); color:#1E3300; box-shadow:0 5px 0 #6F9E00, 5px 9px 0 rgba(0,0,0,.35)}
    .zg-btn--lime:hover  {box-shadow:0 7px 0 #6F9E00, 6px 12px 0 rgba(0,0,0,.35)}
    .zg-btn--lime:active {box-shadow:0 1px 0 #6F9E00, 2px 4px 0 rgba(0,0,0,.35)}
    .zg-btn--rose  {background:linear-gradient(180deg,#FF6FA5,var(--red)); color:#fff; box-shadow:0 5px 0 #A3003F, 5px 9px 0 rgba(0,0,0,.35)}
    .zg-btn--rose:hover  {box-shadow:0 7px 0 #A3003F, 6px 12px 0 rgba(0,0,0,.35)}
    .zg-btn--rose:active {box-shadow:0 1px 0 #A3003F, 2px 4px 0 rgba(0,0,0,.35)}

    /* « Plus » — divulgation progressive. Ferme par defaut. */
    .zg-plus{display:none; width:100%; justify-content:center; flex-wrap:wrap; gap:10px; padding-top:4px}
    .zg-bar.zg-ouvert .zg-plus{display:flex}
    .zg-bar.zg-ouvert .zg-btn--plus .zg-ic{transform:rotate(180deg)}
    .zg-btn--plus .zg-ic{transition:transform .15s}

    /* Selecteur de langue — restaure. Il vit dans la barre, au style de l'app. */
    .zg-lang{
      font-family:var(--f-titre); font-size:13px; letter-spacing:.5px;
      min-height:44px; padding:8px 12px; cursor:pointer;
      border:3px solid var(--encre); border-radius:var(--r-btn);
      background:var(--card); color:var(--text);
      box-shadow:var(--ombre-petite);
    }
    .zg-lang:focus-visible{outline:3px solid var(--yellow); outline-offset:3px}

    /* ======================================================================
       HERO — le langage de l'accueil : eyebrow jaune, titre Luckiest Guy a
       contour noir, personnage EPS. Se replie des qu'une ecole existe.
       ====================================================================== */
    .hero{display:flex; justify-content:center; padding:10px 16px 4px}
    .hero.hidden{display:none}
    .hero-box{
      display:grid; grid-template-columns:1.06fr .94fr; gap:20px; align-items:center;
      max-width:1000px; width:100%;
    }
    .hb-left{position:relative; display:grid; place-items:center; min-height:180px}
    .hb-left::before{
      content:''; position:absolute; width:210px; aspect-ratio:1; border-radius:50%; z-index:0;
      background:radial-gradient(circle, rgba(0,194,232,.30), transparent 68%);
    }
    .hb-left img{
      position:relative; width:min(200px,80%); height:auto; display:block;
      filter:drop-shadow(-8px 10px 0 rgba(0,0,0,.42));
      animation:zg-flotte 6.5s ease-in-out infinite;
    }
    @keyframes zg-flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    .hb-eyebrow{
      display:inline-block; font-family:var(--f-titre); letter-spacing:1.2px; font-size:14px;
      background:var(--yellow); color:#2B2A00; padding:5px 13px 3px; border-radius:7px;
      border:3px solid var(--encre); transform:rotate(-1.6deg); box-shadow:var(--ombre-petite);
    }
    .hb-right h2{
      font-family:var(--f-display); font-size:clamp(34px,5.2vw,58px); line-height:.98;
      letter-spacing:1px; color:#fff; margin:12px 0 0;
      /* Contour noir — la technique de `.ztsp-compteur__gros` sur l'accueil. */
      text-shadow:4px 4px 0 var(--encre), -2px -2px 0 var(--encre),
                  2px -2px 0 var(--encre), -2px 2px 0 var(--encre);
    }
    .hb-right h2 span{display:block; color:var(--yellow)}
    .hb-desc{font-size:15.5px; font-weight:600; color:var(--sur-marine-doux); margin:12px 0 14px; max-width:48ch}
    .hb-badges{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
    .hb-badge{
      font-size:11.5px; font-weight:900; letter-spacing:.4px;
      background:rgba(255,255,255,.09); border:2.5px solid var(--encre); border-radius:var(--r-btn);
      padding:6px 11px; box-shadow:var(--ombre-petite); color:var(--sur-marine);
    }
    .hb-actions{display:flex; gap:12px; flex-wrap:wrap}
    .hb-btn{
      display:inline-flex; align-items:center; gap:9px;
      font-family:var(--f-titre); letter-spacing:.6px; font-size:16px;
      padding:14px 26px 12px; border-radius:var(--r-btn);
      border:3px solid var(--encre); cursor:pointer; transition:.09s;
      background:linear-gradient(180deg,#FFFF7A,var(--yellow)); color:#2B2A00;
      box-shadow:0 5px 0 var(--ztsp-jaune-deep,#C4C200), 5px 9px 0 rgba(0,0,0,.35);
    }
    .hb-btn:hover {transform:translateY(-2px); box-shadow:0 7px 0 var(--ztsp-jaune-deep,#C4C200), 6px 12px 0 rgba(0,0,0,.35)}
    .hb-btn:active{transform:translateY(4px);  box-shadow:0 1px 0 var(--ztsp-jaune-deep,#C4C200), 2px 4px 0 rgba(0,0,0,.35)}
    .hb-btn.sec{
      background:linear-gradient(180deg,var(--cyan2),var(--cyan)); color:#03323C;
      box-shadow:0 5px 0 var(--ztsp-cyan-dark,#075A6B), 5px 9px 0 rgba(0,0,0,.35);
    }
    .hb-btn.sec:hover {box-shadow:0 7px 0 var(--ztsp-cyan-dark,#075A6B), 6px 12px 0 rgba(0,0,0,.35)}
    .hb-btn.sec:active{box-shadow:0 1px 0 var(--ztsp-cyan-dark,#075A6B), 2px 4px 0 rgba(0,0,0,.35)}
    @media(max-width:860px){
      .hero-box{grid-template-columns:1fr}
      .hb-left{display:none}
    }
    /* Le hero sert aussi de gabarit a la modale d'aide, sur fond BLANC :
       les couleurs prevues pour le marine y seraient illisibles. */
    .mbox .hb-right h2{color:var(--text); text-shadow:none; font-size:26px}
    .mbox .hb-right h2 span{color:var(--ztsp-cyan-dark,#075A6B); display:inline}
    .mbox .hb-desc{color:var(--text); max-width:none}
    .mbox .hb-badge{background:#EAF3F7; color:var(--text)}
    .mbox .hb-left::before{display:none}

    /* ======================================================================
       PROGRESSION — une tuile de l'accueil, pas une barre d'outil grise.
       ====================================================================== */
    .progress{
      display:flex; align-items:center; gap:14px; flex-wrap:wrap;
      max-width:1180px; margin:10px auto 0; padding:10px 16px;
      background:rgba(255,255,255,.09); border:3px solid var(--encre);
      border-radius:var(--r-btn); box-shadow:var(--ombre-petite);
      font-size:14px; color:var(--sur-marine);
    }
    .progress .pbar{flex:1; min-width:140px; height:16px; background:rgba(0,0,0,.35);
      border:2px solid var(--encre); border-radius:9px; overflow:hidden}
    .progress .pbar div{height:100%; background:linear-gradient(90deg,var(--cyan2),var(--green)); transition:width .3s}
    .progress .ptxt{font-family:var(--f-titre); font-size:17px; color:var(--yellow); min-width:64px; text-align:right}
    .progress #progLabel{font-weight:800}
    .progress .pill{font-family:var(--f-titre); font-size:14px; padding:4px 10px 2px; border-radius:7px;
      border:2.5px solid var(--encre); box-shadow:2px 2px 0 rgba(0,0,0,.4)}
    #pillH{background:var(--red); color:#fff}
    #pillS{background:var(--orange); color:#3D2400}

    /* ======================================================================
       MISE EN PAGE
       --------------------------------------------------------------------
       L'ancienne regle etait `.layout{height:calc(100vh - 110px); overflow:hidden}`.
       Les 110 px dataient du header custom de 65 px, supprime le 3 juin. Avec
       le header partage — fixe, et qui fait reserver ~332 px de padding-top au
       body — la grille se retrouvait dans une boite de 586 px commencant a
       825 px du haut : invisible sans defiler.

       On abandonne la boite a hauteur fixe. La page defile normalement, comme
       les sections de l'accueil, et les deux panneaux collent sous le header.
       ====================================================================== */
    .layout{
      display:flex; align-items:flex-start; gap:14px;
      max-width:1180px; margin:12px auto 40px; padding:0 16px;
    }
    .panel, .rpanel{
      position:sticky; top:var(--zg-sous-header);
      max-height:calc(100vh - var(--zg-sous-header) - 16px); overflow-y:auto;
      flex-shrink:0; padding:14px;
      background:var(--card); color:var(--text);
      border:4px solid var(--encre); border-radius:var(--r-card);
      box-shadow:var(--ombre-panneau);
    }
    .panel{width:236px}
    .rpanel{width:212px}
    .panel h3, .rpanel h3{
      font-family:var(--f-titre); font-size:17px; letter-spacing:.4px;
      color:var(--text); margin-bottom:10px;
    }
    .grid-area{
      flex:1; min-width:0; overflow-x:auto; padding:14px;
      background:var(--card);
      border:4px solid var(--encre); border-radius:var(--r-card);
      box-shadow:var(--ombre-panneau);
    }
    .grid{display:grid; gap:3px; min-width:min-content}

    /* Cartes de specialistes — le vocabulaire de `.ztsp-card`. */
    .spec-card{
      border:3px solid var(--encre); border-radius:var(--r-btn);
      padding:11px 13px; margin-bottom:9px; cursor:pointer; min-height:52px;
      background:#fff; box-shadow:3px 3px 0 rgba(0,0,0,.28); transition:.12s;
    }
    .spec-card:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 rgba(0,0,0,.28)}
    .spec-card.active{box-shadow:5px 5px 0 var(--cyan), 0 0 0 3px var(--encre)}
    .spec-card .sc-top{display:flex; align-items:center; gap:8px; margin-bottom:5px}
    .spec-card .sc-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--encre); flex-shrink:0}
    .spec-card .sc-name{font-weight:800; font-size:14px; flex:1; color:var(--text)}
    .spec-card .sc-remain{font-family:var(--f-titre); font-size:16px; color:var(--ztsp-cyan-dark,#075A6B)}
    .spec-card .sc-info{font-family:var(--f-note); font-size:15px; line-height:1.15; color:var(--muted)}
    .spec-card .sc-bar{height:7px; background:#e8eef1; border:1.5px solid var(--encre); border-radius:4px; margin-top:6px; overflow:hidden}
    .spec-card .sc-bar div{height:100%; transition:width .2s}

    .panel .p-section{margin-top:14px; padding-top:12px; border-top:3px solid var(--encre)}
    .panel .p-btn{
      display:flex; align-items:center; gap:9px; width:100%;
      font-family:var(--f-titre); font-size:13px; letter-spacing:.4px;
      padding:11px 13px; margin-bottom:8px; min-height:48px; cursor:pointer;
      border:3px solid var(--encre); border-radius:var(--r-btn);
      background:linear-gradient(180deg,#fff,#E6F4FA); color:var(--text);
      box-shadow:0 5px 0 #A9BCC5, 5px 9px 0 rgba(0,0,0,.35); transition:.09s; text-align:left;
    }
    .panel .p-btn:hover{transform:translateY(-2px); box-shadow:0 7px 0 #A9BCC5, 6px 12px 0 rgba(0,0,0,.35)}
    .panel .p-btn:active{transform:translateY(4px); box-shadow:0 1px 0 #A9BCC5, 2px 4px 0 rgba(0,0,0,.35)}

    /* ======================================================================
       TOAST
       ====================================================================== */
    /* En bas, et EMPILES.
       Pose sous le header, le toast recouvrait la barre d'actions. Pose en bas
       sans pile, deux messages rapproches se superposaient — les deux defauts
       vus aux captures du 31 aout. La pile regle les deux. */
    .zg-toasts{
      position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
      display:flex; flex-direction:column-reverse; align-items:center; gap:8px;
      z-index:9999; pointer-events:none; max-width:92vw;
    }
    .toast{
      background:var(--encre); color:#fff; padding:12px 22px; border-radius:var(--r-btn);
      border:3px solid #fff; font-weight:800; font-size:14.5px;
      box-shadow:5px 5px 0 rgba(0,0,0,.5); animation:toastIn .3s ease-out;
      text-align:center; pointer-events:auto;
    }
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

    /* ======================================================================
       LA GRILLE ELLE-MEME
       Bordures noires, coins arrondis, ombres dures : le meme traitement que
       les tuiles de l'accueil, a l'echelle d'une cellule.
       ====================================================================== */
    .g-hdr{
      background:linear-gradient(180deg,var(--cyan2),var(--cyan)); color:#03323C;
      border:3px solid var(--encre); border-radius:var(--r-btn);
      padding:10px; text-align:center; min-height:50px;
      display:flex; align-items:center; justify-content:center;
      font-family:var(--f-titre); font-size:17px; letter-spacing:.6px;
      box-shadow:2px 2px 0 rgba(0,0,0,.35);
    }
    .g-time{
      background:#fff; border:3px solid var(--encre); border-radius:var(--r-btn);
      min-height:78px; display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-family:var(--f-titre); font-size:16px; color:var(--ztsp-cyan-dark,#075A6B);
      box-shadow:2px 2px 0 rgba(0,0,0,.25);
    }
    .g-time small{font-family:var(--f-note); font-size:14px; line-height:1.1; color:var(--muted); font-weight:400}
    .g-brk{
      border:3px solid var(--encre); border-radius:var(--r-btn); min-height:36px;
      display:flex; align-items:center; justify-content:center;
      font-family:var(--f-titre); font-size:13px; letter-spacing:.6px;
      box-shadow:2px 2px 0 rgba(0,0,0,.25);
    }
    .g-brk.rec{background:var(--yellow); color:#2B2A00}
    .g-brk.lun{background:#BFE9F6; color:#03323C}

    .g-cell{
      border:3px solid var(--encre); border-radius:var(--r-btn); min-height:78px;
      background:#fff; display:flex; flex-wrap:wrap; align-content:center; align-items:stretch;
      justify-content:center; cursor:pointer; padding:4px; gap:3px; transition:.1s;
      box-shadow:2px 2px 0 rgba(0,0,0,.18);
    }
    .g-cell:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 rgba(0,0,0,.25); background:#EAF8FD}
    .g-cell.can-drop{border-style:dashed; background:rgba(58,220,250,.16)}
    .g-cell.cant-drop{opacity:.32}
    .g-cell.hard{box-shadow:0 0 0 3px var(--red), 2px 2px 0 rgba(0,0,0,.18) !important; background:rgba(255,0,97,.07) !important}
    .g-cell.soft{box-shadow:0 0 0 3px var(--orange), 2px 2px 0 rgba(0,0,0,.18) !important; background:rgba(255,162,0,.09) !important}

    .g-chip{
      display:inline-flex; align-items:center; justify-content:space-between; gap:4px;
      padding:6px 9px; border-radius:8px; font-size:13px; font-weight:800; color:#0C1720;
      white-space:nowrap; flex:1 1 auto; min-width:0;
      border:2px solid var(--encre); box-shadow:1.5px 1.5px 0 rgba(0,0,0,.35);
    }
    .g-cell.multi .g-chip{font-size:11.5px; padding:4px 6px}
    .g-chip:hover{filter:brightness(.94)}
    .g-chip .x{font-size:11px; opacity:.45; padding:2px 4px; cursor:pointer; min-width:24px; min-height:24px;
      display:flex; align-items:center; justify-content:center; border-radius:5px}
    .g-chip .x:hover{opacity:1; color:#fff; background:var(--red)}
    .g-chip .sp-tag{font-size:10px; opacity:.7; font-weight:700; background:rgba(0,0,0,.12); padding:1px 4px; border-radius:3px}
    .g-cell .plus{color:rgba(8,19,30,.14); font-size:26px; font-weight:300}

    .next-item{
      font-size:13px; padding:9px 11px; border-radius:var(--r-btn); margin-bottom:7px;
      border:2.5px solid var(--encre); border-left-width:6px; background:#fff; color:var(--text);
      box-shadow:2px 2px 0 rgba(0,0,0,.25);
    }
    .next-item .ni-cls{font-weight:800; font-size:14px}
    .next-item .ni-sub{font-family:var(--f-note); color:var(--muted); font-size:15px; line-height:1.2}
    .next-item .ni-need{font-family:var(--f-titre); color:var(--ztsp-cyan-dark,#075A6B); float:right; font-size:16px}

    /* ======================================================================
       MODALES ET FORMULAIRES
       ====================================================================== */
    .modal{position:fixed; inset:0; background:rgba(6,23,38,.62); backdrop-filter:blur(3px);
      z-index:5000; display:flex; align-items:center; justify-content:center; padding:16px}
    .mbox{
      background:#fff; color:var(--text);
      border:4px solid var(--encre); border-radius:var(--r-card);
      box-shadow:var(--ombre-panneau);
      padding:22px; width:100%; max-width:660px; max-height:88vh; overflow-y:auto;
    }
    .mbox h3{font-family:var(--f-titre); font-size:24px; letter-spacing:.5px; color:var(--text);
      text-align:center; margin-bottom:14px}
    .macts{display:flex; gap:9px; justify-content:flex-end; margin-top:16px; padding-top:13px;
      border-top:3px solid var(--encre); flex-wrap:wrap}
    .fr{display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap}
    .fr label{font-weight:800; min-width:95px; font-size:13.5px}
    .fr input,.fr select{
      font-family:var(--f-corps); font-size:14px; font-weight:600; min-height:44px;
      border:2.5px solid var(--encre); border-radius:9px; padding:8px 12px; background:#fff; color:var(--text);
    }
    .fr input:focus,.fr select:focus{outline:3px solid var(--yellow); outline-offset:2px; background:#EAF8FD}
    .fr input[type=number]{width:78px}
    .fr input[type=checkbox]{width:24px; height:24px; min-height:0; accent-color:var(--cyan)}
    .chips{display:flex; flex-wrap:wrap; gap:5px}
    .ck{font-size:13px; font-weight:800; padding:7px 14px; border-radius:18px; cursor:pointer;
      border:2.5px solid var(--encre); background:#EDF2F5; color:var(--muted); user-select:none;
      min-height:40px; display:flex; align-items:center}
    .ck.on{background:linear-gradient(180deg,var(--cyan2),var(--cyan)); color:#03323C; box-shadow:2px 2px 0 rgba(0,0,0,.3)}
    .dt{width:100%; border-collapse:collapse; font-size:13.5px}
    .dt th{background:var(--encre); color:#fff; font-family:var(--f-titre); letter-spacing:.6px;
      padding:9px 8px; text-align:left; font-size:13px}
    .dt td{padding:8px; border-bottom:2px solid #E4EBEF; vertical-align:middle}
    .dt tr:hover{background:#F2F9FC}
    .cdot{display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid var(--encre);
      vertical-align:middle; margin-right:5px}

    .btn{
      font-family:var(--f-titre); font-weight:400; font-size:13.5px; letter-spacing:.4px;
      padding:10px 18px 8px; min-height:44px; cursor:pointer;
      border:3px solid var(--encre); border-radius:var(--r-btn);
      display:inline-flex; align-items:center; gap:6px; transition:.09s;
      background:linear-gradient(180deg,var(--cyan2),var(--cyan)); color:#03323C;
      box-shadow:0 4px 0 var(--ztsp-cyan-dark,#075A6B), 3px 6px 0 rgba(0,0,0,.3);
    }
    .btn:hover{transform:translateY(-2px)}
    .btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ztsp-cyan-dark,#075A6B), 1px 2px 0 rgba(0,0,0,.3)}
    .btn.g{background:linear-gradient(180deg,#C9FF6B,var(--green)); color:#1E3300; box-shadow:0 4px 0 #6F9E00, 3px 6px 0 rgba(0,0,0,.3)}
    .btn.c{background:linear-gradient(180deg,var(--cyan2),var(--cyan)); color:#03323C}
    .btn.r{background:linear-gradient(180deg,#FF6FA5,var(--red)); color:#fff; box-shadow:0 4px 0 #A3003F, 3px 6px 0 rgba(0,0,0,.3)}
    .btn.o{background:linear-gradient(180deg,#fff,#DCE7EC); color:var(--text); box-shadow:0 4px 0 #A9BCC5, 3px 6px 0 rgba(0,0,0,.3)}
    .btn.sm{font-size:12px; padding:6px 11px 5px; min-height:36px; border-width:2.5px;
      box-shadow:0 3px 0 rgba(0,0,0,.28), 2px 4px 0 rgba(0,0,0,.22)}

    .class-picker{display:flex; flex-direction:column; gap:8px}
    .class-picker .cp-btn{
      font-family:var(--f-titre); font-size:17px; letter-spacing:.4px;
      padding:14px 18px; min-height:56px; cursor:pointer; transition:.1s;
      border:3px solid var(--encre); border-radius:var(--r-btn); background:#fff; color:var(--text);
      display:flex; align-items:center; justify-content:space-between;
      box-shadow:0 5px 0 #A9BCC5, 5px 9px 0 rgba(0,0,0,.35);
    }
    .class-picker .cp-btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 7px 0 #A9BCC5, 6px 12px 0 rgba(0,0,0,.35); background:#EAF8FD}
    .class-picker .cp-btn:active:not(:disabled){transform:translateY(4px); box-shadow:0 1px 0 #A9BCC5, 2px 4px 0 rgba(0,0,0,.35)}
    .class-picker .cp-btn:disabled{opacity:.3; cursor:default; box-shadow:none}
    .class-picker .cp-btn .cp-need{font-family:var(--f-titre); color:var(--ztsp-cyan-dark,#075A6B)}

    /* ======================================================================
       MOBILE — rien d'ampute.
       --------------------------------------------------------------------
       L'ancienne regle passait `.panel` ET `.rpanel` en `display:none` sous
       600 px. On y perdait la selection du specialiste, la progression
       individuelle, « A placer », et surtout les trois boutons Specialistes /
       Classes / Locaux — donc TOUTE la configuration depuis un telephone.

       Les deux panneaux restent maintenant dans le flux, empiles au-dessus de
       la grille, et ne collent plus (un panneau collant sur un ecran de 600 px
       de haut mange l'ecran).
       ====================================================================== */
    @media(max-width:1080px){ .rpanel{width:200px} }
    @media(max-width:900px){
      .layout{flex-direction:column; gap:12px}
      .panel, .rpanel{
        position:static; width:100%; max-height:none;
        display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:9px;
      }
      .panel h3, .rpanel h3{grid-column:1/-1; margin-bottom:2px}
      .panel .p-section{grid-column:1/-1; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px}
      .panel .p-section .p-btn{margin-bottom:0}
      .spec-card{margin-bottom:0}
      .grid-area{width:100%}
      .zg-btn{min-width:76px; min-height:60px; font-size:12px}
      .zg-btn .zg-ic{font-size:20px}
    }
    @media(max-width:560px){
      body{font-size:16px}
      .panel, .rpanel{grid-template-columns:1fr 1fr}
      .hb-right h2{font-size:clamp(26px,7vw,36px)}
    }

    /* ======================================================================
       IMPRESSION
       --------------------------------------------------------------------
       L'ancienne regle masquait `.hdr` — un element supprime le 3 juin — et
       laissait passer le header partage fixe, la barre d'actions, le bandeau
       de cookies, le rail du shell et le mur. Elle ne posait ni
       `print-color-adjust` (les couleurs de groupes disparaissaient) ni
       `break-inside` (une journee pouvait se couper en deux pages).

       Ce qu'on imprime : la grille, et un bandeau d'identification. Rien d'autre.
       ====================================================================== */
    @media print{
      @page{ size:landscape; margin:8mm }

      /* Tout le chrome du site s'efface. */
      [data-zts-header], .zts-header, .zts-menu, .zts-footer,
      .zg-bar, .hero, .progress, .panel, .rpanel,
      .ztsh-rail, .ztsh-pause, .ztsh-metiers, [class*="ztsh-rail"],
      .zts-cookie, #cookie-consent, .ztg-out, .zts-lock-overlay,
      .toast, .modal{ display:none !important }

      /* Le decor marine du shell ne s'imprime pas. */
      html, body{
        background:#fff !important; color:#000 !important;
        padding-top:0 !important; margin:0 !important; font-size:11pt !important;
      }
      .ztsh-page, .ztsh-page.ztsh-fond{ padding:0 !important; background:none !important }
      .ztsh-page::before, .ztsh-page::after,
      body::before, body::after{ display:none !important }

      .layout{ display:block !important; max-width:none !important; margin:0 !important; padding:0 !important }
      .grid-area{
        overflow:visible !important; padding:0 !important;
        border:none !important; box-shadow:none !important; background:#fff !important;
      }
      .grid{ gap:1px !important }

      /* Les couleurs de groupes SONT l'information : sans elles la grille
         imprimee est illisible. Les navigateurs les jettent par defaut. */
      *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important }

      /* Une colonne de jour ne se coupe pas entre deux pages. */
      .cell, .hd, .chip{ break-inside:avoid !important; page-break-inside:avoid !important }

      /* Bandeau d'identification, injecte par preparerImpression(). */
      #zg-print-head{ display:block !important; margin-bottom:6mm; font-family:'Quicksand',sans-serif }
      #zg-print-head b{ font-size:15pt }
      #zg-print-head span{ font-family:var(--f-note); color:#333; font-size:12pt }
    }
    #zg-print-head{ display:none }

let nid=1;function uid(){return'id_'+(nid++)}
let S={school:{name:'',cycleDays:9,periodsPerDay:5,periodDuration:50,quotaMode:'periods',tache100:30,periods:JSON.parse(JSON.stringify(DEF_PER))},subjects:JSON.parse(JSON.stringify(DEF_SUB)),specialists:[],classes:[],rooms:[],assignments:{}};
let lang='fr',activeSpec=null;

function save(){localStorage.setItem('gh2',JSON.stringify(S))}
function load(){try{const r=localStorage.getItem('gh2');if(r){S=JSON.parse(r);if(!S.assignments)S.assignments={};if(!S.school.quotaMode)S.school.quotaMode='minutes';if(!S.school.periodsPerDay)S.school.periodsPerDay=tPer().length||5;if(!S.school.tache100)S.school.tache100=S.school.cycleDays*(S.school.periodsPerDay||5)}}catch(e){}
  lang=localStorage.getItem('gh_lang')||'fr';const _langSel=document.getElementById('langSel');if(_langSel)_langSel.value=lang;
  [...(S.specialists||[]),...(S.classes||[]),...(S.rooms||[])].forEach(x=>{if(x?.id){const n=parseInt(x.id.replace('id_',''));if(!isNaN(n)&&n>=nid)nid=n+1}})}
function changeLang(l){lang=l;localStorage.setItem('gh_lang',l);applyI18n();renderAll()}

// TOAST
function toast(msg,dur){
  let pile=document.getElementById('zgToasts');
  if(!pile){pile=document.createElement('div');pile.className='zg-toasts';pile.id='zgToasts';
    pile.setAttribute('role','status');pile.setAttribute('aria-live','polite');document.body.appendChild(pile)}
  const d=document.createElement('div');d.className='toast';d.textContent=msg;
  pile.appendChild(d);
  setTimeout(()=>{d.remove();if(!pile.children.length)pile.remove()},dur||2500)}

// COULEURS DES GROUPES-CLASSES
// Les cinq neons de la charte en tete, puis 25 teintes distinctes. Toutes
// verifiees a 4,5:1 au moins contre l'encre `#0C1720` du nom ecrit dessus
// (minimum mesure : 6,80:1). L'ancienne palette laissait deux couleurs
// sous le seuil AA — #D500F9 a 4,48:1 et #F50057 a 4,33:1 — et ouvrait sur
// un cyan `#00E5FF` hors charte.
const GROUP_COLORS=['#3ADCFA','#FFFC00','#A3FF00','#FFA200','#FF6FA5','#00E676','#FF8A80','#B388FF','#64FFDA','#FFD740','#69F0AE','#FF9E80','#82B1FF','#C6FF00','#EA80FC','#84FFFF','#CCFF90','#FFAB91','#B2FF59','#80D8FF','#F8BBD0','#A7FFEB','#FFE57F','#D1C4E9','#C5E1A5','#FFCCBC','#B3E5FC','#F0F4C3','#E1BEE7','#DCEDC8'];
const _gcCache={};
function groupColor(classId){
  if(_gcCache[classId])return _gcCache[classId];
  const idx=S.classes.findIndex(c=>c.id===classId);
  _gcCache[classId]=GROUP_COLORS[idx%GROUP_COLORS.length]||'#ccc';
  return _gcCache[classId]}
function resetGroupColors(){Object.keys(_gcCache).forEach(k=>delete _gcCache[k])}

// HELPERS
function tPer(){return S.school.periods.filter(p=>p.type==='period')}
function lunchIdx(){return S.school.periods.findIndex(p=>p.type==='lunch')}
function isAM(n){const li=lunchIdx();let c=0;for(let i=0;i<S.school.periods.length;i++){if(S.school.periods[i].type==='period'){c++;if(c===n)return i<(li===-1?999:li)}}return true}
function getA(d,p){return S.assignments[d]?.[p]||[]}
function setA(d,p,sid,cid,rid){if(!S.assignments[d])S.assignments[d]={};if(!S.assignments[d][p])S.assignments[d][p]=[];S.assignments[d][p]=S.assignments[d][p].filter(a=>a.specId!==sid);if(cid)S.assignments[d][p].push({specId:sid,classId:cid,roomId:rid||''});save()}
function removeA(d,p,sid){if(S.assignments[d]?.[p]){S.assignments[d][p]=S.assignments[d][p].filter(a=>a.specId!==sid);save()}}
function totalA(){let c=0;for(const d in S.assignments)for(const p in S.assignments[d])c+=S.assignments[d][p].length;return c}
function minUsed(cid,sid){let t=0;for(let d=1;d<=S.school.cycleDays;d++)tPer().forEach(p=>{getA(d,p.num).forEach(a=>{if(a.classId===cid){const sp=S.specialists.find(s=>s.id===a.specId);if(sp?.subjectId===sid)t+=S.school.periodDuration}})});return t}
function specShare(sp){const peers=S.specialists.filter(s=>s.subjectId===sp.subjectId);if(peers.length<=1)return 1;
  const totalPct=peers.reduce((s,p)=>s+(p.taskPercent||100),0);return(sp.taskPercent||100)/totalPct}
// Part ENTIERE de ce specialiste dans le besoin d'une classe, par arrondi
// cumulatif. La somme des parts des collegues d'une meme matiere vaut
// EXACTEMENT le besoin de la classe — c'est ce qui manquait et qui faisait
// plafonner la barre de progression a 96 %.
function partSpec(sp,cl){
  const su=S.subjects.find(s=>s.id===sp.subjectId);if(!su)return 0;
  const total=reqToPeriods(su.min[cl.level]||0);if(total<=0)return 0;
  const peers=S.specialists.filter(s=>s.subjectId===sp.subjectId);
  if(peers.length<=1)return total;
  const poids=peers.map(p=>p.taskPercent||100);
  const somme=poids.reduce((a,b)=>a+b,0)||1;
  let cum=0,prec=0;
  for(let i=0;i<peers.length;i++){
    cum+=poids[i];
    const borne=Math.round(total*cum/somme);
    if(peers[i].id===sp.id)return borne-prec;
    prec=borne;
  }
  return 0}
function reqToPeriods(req){return S.school.quotaMode==='periods'?req:Math.ceil(req/S.school.periodDuration)}
function totalNeeded(){let t=0;S.specialists.forEach(sp=>{S.classes.forEach(cl=>{t+=partSpec(sp,cl)})});return t}
function specDemand(sp){const su=S.subjects.find(s=>s.id===sp.subjectId);if(!su)return[];const d=[];
  S.classes.forEach(cl=>{const myNeed=partSpec(sp,cl);if(myNeed<=0)return;const usedByMe=countPlaced(sp.id,cl.id);const need=Math.max(0,myNeed-usedByMe);if(need>0)d.push({cls:cl,need,req:myNeed,used:usedByMe})});
  return d.sort((a,b)=>b.need-a.need)}
function countPlaced(specId,classId){let c=0;for(let d=1;d<=S.school.cycleDays;d++)tPer().forEach(p=>{getA(d,p.num).forEach(a=>{if(a.specId===specId&&a.classId===classId)c++})});return c}
function specTotalPlaced(specId){let c=0;for(let d=1;d<=S.school.cycleDays;d++)tPer().forEach(p=>{getA(d,p.num).forEach(a=>{if(a.specId===specId)c++})});return c}
function specMaxPeriods(sp){return Math.round((sp.taskPercent||100)/100*S.school.tache100)}
function specTaskPct(sp){const placed=specTotalPlaced(sp.id);return S.school.tache100?Math.round(placed/S.school.tache100*10000)/100:0}
function canPlace(day,per,sp){
  if(getA(day,per).some(a=>a.specId===sp.id))return false;
  if(specTotalPlaced(sp.id)>=specMaxPeriods(sp))return false;
  if(sp.isItinerant&&sp.travelDays?.includes(+day))return false;
  if(sp.availDays?.length&&!sp.availDays.includes(+day))return false;
  if(sp.amPm==='am'&&!isAM(per))return false;
  if(sp.amPm==='pm'&&isAM(per))return false;
  return true}
function checkH(day,per,sid,cid,rid){const v=[];const sp=S.specialists.find(s=>s.id===sid);if(!sp)return v;
  if(rid){const rm=S.rooms.find(r=>r.id===rid);if(rm&&getA(day,per).filter(a=>a.roomId===rid&&a.specId!==sid).length>=rm.maxSimultaneous)v.push({type:'room'})}
  if(getA(day,per).some(a=>a.specId===sid))v.push({type:'specBusy'});
  if(getA(day,per).some(a=>a.classId===cid&&a.specId!==sid))v.push({type:'classBusy'});
  if(sp.isItinerant&&sp.travelDays?.includes(+day))v.push({type:'itin'});
  if(sp.availDays?.length&&!sp.availDays.includes(+day))v.push({type:'avail'});
  if(sp.amPm==='am'&&!isAM(per))v.push({type:'ampm'});if(sp.amPm==='pm'&&isAM(per))v.push({type:'ampm'});return v}
function checkS(day,per,sid,cid){const w=[];const sp=S.specialists.find(s=>s.id===sid);if(!sp)return w;
  const cl=S.classes.find(c=>c.id===cid),su=S.subjects.find(s=>s.id===sp.subjectId);
  if(su&&cl){[+day-1,+day+1].filter(d=>d>=1&&d<=S.school.cycleDays).forEach(adj=>{tPer().forEach(p=>{getA(adj,p.num).forEach(a=>{if(a.classId===cid){const asp=S.specialists.find(s=>s.id===a.specId);if(asp?.subjectId===sp.subjectId)w.push({type:'spacing'})}})})})}
  if(sp.maxConsecutive){const pn=tPer().map(p=>p.num).sort((a,b)=>a-b);const pi=pn.indexOf(+per);let st=1;for(let i=pi-1;i>=0;i--){if(getA(day,pn[i]).some(a=>a.specId===sid))st++;else break}for(let i=pi+1;i<pn.length;i++){if(getA(day,pn[i]).some(a=>a.specId===sid))st++;else break}if(st>sp.maxConsecutive)w.push({type:'consec'})}
  if(sp.maxPerDay){let c=0;tPer().forEach(p=>{if(getA(day,p.num).some(a=>a.specId===sid))c++});if(c>sp.maxPerDay)w.push({type:'maxDay'})}return w}

// GRID
function renderGrid(){
  const g=document.getElementById('grid');g.innerHTML='';
  const periods=S.school.periods,cd=S.school.cycleDays;
  const sp=activeSpec?S.specialists.find(s=>s.id===activeSpec):null;
  const cols=cd+1;
  g.style.gridTemplateColumns=`88px repeat(${cd},minmax(112px,1fr))`;
  // Row 0: headers
  let hdr=document.createElement('div');hdr.className='g-hdr';hdr.textContent='⏰';hdr.style.gridColumn='1';hdr.style.gridRow='1';g.appendChild(hdr);
  for(let d=1;d<=cd;d++){hdr=document.createElement('div');hdr.className='g-hdr';hdr.textContent=t('day')+' '+d;hdr.style.gridColumn=''+(d+1);hdr.style.gridRow='1';g.appendChild(hdr)}
  // Rows for periods
  let row=2;
  periods.forEach(p=>{
    if(p.type!=='period'){
      // break row spans all columns
      for(let c=0;c<=cd;c++){const brk=document.createElement('div');brk.className='g-brk '+(p.type==='recess'?'rec':'lun');brk.textContent=c===0?(p.type==='recess'?t('recess'):t('lunch')):'';brk.style.gridColumn=''+(c+1);brk.style.gridRow=''+row;g.appendChild(brk)}
      row++;return}
    // Time cell
    const tc=document.createElement('div');tc.className='g-time';tc.innerHTML=`<span>P${p.num}</span><small>${p.start||''}-${p.end||''}</small>`;tc.style.gridColumn='1';tc.style.gridRow=''+row;g.appendChild(tc);
    // Day cells
    for(let d=1;d<=cd;d++){
      const assigns=getA(d,p.num);const cell=document.createElement('div');cell.className='g-cell';
      if(assigns.length>1)cell.classList.add('multi');
      if(sp){if(canPlace(d,p.num,sp)&&!assigns.some(a=>a.specId===sp.id))cell.classList.add('can-drop');else if(!assigns.some(a=>a.specId===sp.id))cell.classList.add('cant-drop')}
      let hrd=false,sft=false;assigns.forEach(a=>{if(checkH(d,p.num,a.specId,a.classId,a.roomId).filter(v=>v.type!=='specBusy').length)hrd=true;if(checkS(d,p.num,a.specId,a.classId).length)sft=true});
      const rc={};assigns.forEach(a=>{if(a.roomId)rc[a.roomId]=(rc[a.roomId]||0)+1});Object.entries(rc).forEach(([rid,cnt])=>{const rm=S.rooms.find(r=>r.id===rid);if(rm&&cnt>rm.maxSimultaneous)hrd=true});
      if(hrd)cell.classList.add('hard');else if(sft)cell.classList.add('soft');
      assigns.forEach(a=>{const asp=S.specialists.find(s=>s.id===a.specId),cl=S.classes.find(c=>c.id===a.classId);if(!asp)return;
        const ch=document.createElement('div');ch.className='g-chip';ch.style.background=cl?groupColor(cl.id):'#eee';
        ch.innerHTML=`<span style="overflow:hidden;text-overflow:ellipsis"><b>${cl?.group||'?'}</b> <span class="sp-tag">${asp.shortName}</span></span><span class="x" data-d="${d}" data-p="${p.num}" data-s="${a.specId}">✕</span>`;
        ch.querySelector('.x').onclick=e=>{e.stopPropagation();removeA(d,p.num,a.specId);renderAll()};cell.appendChild(ch)});
      if(!cell.children.length)cell.innerHTML='<span class="plus">+</span>';
      cell.style.gridColumn=''+(d+1);cell.style.gridRow=''+row;
      cell.onclick=()=>cellClick(d,p.num);g.appendChild(cell)}
    row++});
}

function cellClick(day,per){
  // BUG FIX: check if classes exist first
  if(!S.classes.length){toast(t('addClassesFirst'));openClassesModal();return}
  if(!activeSpec){openQuickAssign(day,per);return}
  const sp=S.specialists.find(s=>s.id===activeSpec);if(!sp)return;
  if(specTotalPlaced(sp.id)>=specMaxPeriods(sp)){toast('🚫 '+sp.shortName+' — '+t('taskFull')+' ('+specMaxPeriods(sp)+' pér.)');return}
  if(!canPlace(day,per,sp)){toast('❌ '+t('unavailable'));return}
  if(getA(day,per).some(a=>a.specId===sp.id)){removeA(day,per,sp.id);renderAll();return}
  const demand=specDemand(sp);
  if(!demand.length){toast('✅ '+sp.shortName+' — complet!');return}
  if(demand.length===1){const cl=demand[0].cls;if(getA(day,per).some(a=>a.classId===cl.id)){toast('❌ '+cl.group+' '+t('busy'));return}
    setA(day,per,sp.id,cl.id,sp.roomId||'');renderAll();return}
  showClassPicker(day,per,sp,demand);
}

function solveSchedule(){if(!S.classes.length||!S.specialists.length){toast(t('autoAddFirst'));return}
  if(!confirm(t('autoConfirm')))return;const pnums=tPer().map(p=>p.num);let filled=0,rem=0;const demand=[];
  S.classes.forEach(cl=>{S.subjects.forEach(su=>{const req=su.min[cl.level]||0;if(req<=0)return;const placed=Math.round(minUsed(cl.id,su.id)/S.school.periodDuration);const need=Math.max(0,reqToPeriods(req)-placed);if(need<=0)return;const specs=S.specialists.filter(sp=>sp.subjectId===su.id);if(specs.length)demand.push({cid:cl.id,sid:su.id,need,specs})})});
  demand.sort((a,b)=>a.specs.length-b.specs.length);
  demand.forEach(d=>{for(let att=0;att<d.need;att++){let best=null,bs=-Infinity;const days=Array.from({length:S.school.cycleDays},(_,i)=>i+1);shuf(days);
  for(const day of days)for(const per of pnums)for(const sp of d.specs){if(checkH(day,per,sp.id,d.cid,sp.roomId||'').length)continue;if(getA(day,per).some(a=>a.specId===sp.id||a.classId===d.cid))continue;
  let dc=0;pnums.forEach(pp=>{if(getA(day,pp).some(a=>a.specId===sp.id))dc++});if(dc>=(sp.maxPerDay||6))continue;
  const sv=checkS(day,per,sp.id,d.cid);const sc=100-sv.length*20-dc*5+Math.random()*10;if(sc>bs){bs=sc;best={day,per,specId:sp.id,roomId:sp.roomId||''}}}
  if(best){setA(best.day,best.per,best.specId,d.cid,best.roomId);filled++}else rem++}});
  renderAll();if(!rem&&filled)toast(`✅ ${filled} ${t('autoSuccess')}`);else if(filled)toast(`⚠️ ${filled} ${t('autoPartial')} ${rem} ${t('autoImpossible')}`);else toast(`❌ ${t('autoFailed')}`)}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function clearSchedule(){if(!confirm(`🗑️ ${t('clearConfirm')}`))return;S.assignments={};save();renderAll()}

/* =======================================================================
   MISE EN PAGE — caler le contenu sous le header fixe
   Le header partage est en `position:fixed` et zts-menu.js pose lui-meme le
   padding-top de <body> pour lui reserver la place. Les panneaux collants ont
   besoin de connaitre le bas du header : on le mesure au lieu de le deviner.
   L'accueil laisse 12 px entre le header et sa premiere section — on reprend
   la meme valeur, pour que la grille se pose comme une section de l'accueil.
   ======================================================================= */
function calerSousHeader(){
  const h=document.querySelector('.zts-header');
  const bas=h?Math.round(h.getBoundingClientRect().bottom):0;
  const px=(bas>0?bas:parseInt(getComputedStyle(document.body).paddingTop)||330)+12;
  document.documentElement.style.setProperty('--zg-sous-header',px+'px');
}

/* =======================================================================
   EXPORT / IMPORT JSON
   Meme en-tete de contrat que apps/evaluation/carnet-export.js : un lecteur
   doit pouvoir identifier le fichier sans deviner, des mois plus tard.
   Ne pas changer la forme sans monter VERSION_EXPORT.
   ======================================================================= */
const VERSION_EXPORT=1;
const FORMAT_EXPORT='zts-grille-horaire-export';

function exporterJSON(){
  const paquet={
    format:     FORMAT_EXPORT,
    version:    VERSION_EXPORT,
    source:     'grille',
    appVersion: 'grille-2026-08',
    exportedAt: new Date().toISOString(),
    origin:     location.origin+location.pathname,
    counts:{
      classes:      (S.classes||[]).length,
      specialists:  (S.specialists||[]).length,
      rooms:        (S.rooms||[]).length,
      subjects:     (S.subjects||[]).length,
      assignments:  totalA()
    },
    lang: lang,
    data: S
  };
  const txt=JSON.stringify(paquet,null,2);
  const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  const a=document.createElement('a');
  a.href=url;
  a.download='grille-horaire-'+paquet.exportedAt.slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast('💾 '+t('exportOk'));
}

function declencherImport(){const f=document.getElementById('zgFichier');if(f){f.value='';f.click()}}

function importerJSON(input){
  const f=input.files&&input.files[0];if(!f)return;
  const lect=new FileReader();
  lect.onload=()=>{
    let p;
    try{p=JSON.parse(lect.result)}catch(e){toast('❌ '+t('importErr'));return}
    try{
      if(p&&p.format!==FORMAT_EXPORT)throw new Error(t('importAutre'));
      if(p.version>VERSION_EXPORT)throw new Error(t('importVersion'));
      if(!p.data||!p.data.school)throw new Error(t('importErr'));
      if(totalA()&&!confirm(t('importConfirm')))return;
      S=p.data;
      if(!S.assignments)S.assignments={};
      if(!S.school.quotaMode)S.school.quotaMode='periods';
      if(!S.school.periodsPerDay)S.school.periodsPerDay=tPer().length||5;
      if(!S.school.tache100)S.school.tache100=S.school.cycleDays*(S.school.periodsPerDay||5);
      if(p.lang&&I[p.lang]){lang=p.lang;localStorage.setItem('gh_lang',lang);
        const sel=document.getElementById('langSel');if(sel)sel.value=lang}
      save();showWelcome();renderAll();
      toast('📂 '+t('importOk')+' — '+S.classes.length+' / '+S.specialists.length);
    }catch(e){toast('❌ '+(e.message||t('importErr')),4000)}
  };
  lect.onerror=()=>toast('❌ '+t('importErr'));
  lect.readAsText(f);
}

});
