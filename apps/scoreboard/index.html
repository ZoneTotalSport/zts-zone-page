    <meta charset="UTF-8" />

    <title>Basketball Scoreboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Fredoka:wght@400..700&family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    <style>
      /* Fond gymnase continu derrière le header flottant (mêmes réglages que la div React → calage pixel-perfect, plus de noir) */
      html { background:#E0F7FF; }
      /* !important : le CSS du build React (chargé après) repeignait le body en
         foncé → on force le fond gymnase pour qu'il apparaisse derrière le
         header transparent, à l'identique de la div React. */
      body {
        font-family:'DynaPuff',cursive;
        background-color:#E0F7FF !important;
        background-image:linear-gradient(180deg, rgba(255,255,255,0.78) 0%, rgba(224,247,255,0.72) 50%, rgba(125,211,252,0.78) 100%), url('gym-bg.png') !important;
        background-size:cover !important;
        background-position:center !important;
        background-attachment:fixed !important;
        background-repeat:no-repeat !important;
      }
    </style>
    <link rel="stylesheet" href="../../zts-ultra.css">
    <!-- Header partagé ZTS (identique à la home) -->
    <link rel="stylesheet" href="../../shared/zts-header.css">
    <style>
      /* Header = PROLONGEMENT du gymnase : on retire le dégradé bleu-nuit de la
         carte et on la rend translucide (voile clair) → le fond gymnase du body
         (fixed) apparaît à travers, en continuité parfaite. Aucun foncé. */
      .zts-header {
        background: transparent !important;
      }
      /* On retire aussi la trame de points (sur la carte bleue elle servait de
         texture ; sur le gymnase elle salirait l'image). */
      .zts-header::before { display: none !important; }
    </style>
