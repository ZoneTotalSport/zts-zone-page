<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basketball Scoreboard</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script type="module" crossorigin src="./assets/index-D0WfrZyf.js"></script>

    <style>
.zts-app-header{position:sticky;top:0;z-index:9999;background:linear-gradient(180deg,#00E5FF 0%,#00C4FF 35%,#0086AD 75%,#004A61 100%);border-bottom:6px solid #000;box-shadow:0 8px 0 rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0)}
.zts-app-header-inner{max-width:1800px;margin:0 auto;padding:28px 36px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
.zts-app-brand{display:flex;flex-direction:column;align-items:center;text-decoration:none;line-height:1;justify-self:center;gap:14px}
.zts-app-brand-main{font-family:'Luckiest Guy',cursive;letter-spacing:.05em;font-size:92px;color:#fff;text-shadow:4px 4px 0 rgba(0,0,0,.35);line-height:1}
.zts-app-brand-accent{color:#FFFA00}
.zts-app-sub-row{display:flex;align-items:center;justify-content:center;gap:18px}
.zts-app-brand-sub{font-family:'Luckiest Guy',cursive;font-size:42px;letter-spacing:.18em;text-transform:uppercase;color:#FFFC00;line-height:1;text-shadow:3px 3px 0 rgba(0,0,0,.35)}
.zts-app-mascot{width:78px;height:78px;border:4px solid #000;border-radius:18px;background:#fff;object-fit:contain;box-shadow:4px 4px 0 #000;transform:rotate(-4deg)}
.zts-app-clock{font-family:'Luckiest Guy',cursive;letter-spacing:.1em;font-size:46px;color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.35);background:rgba(0,0,0,.3);padding:8px 28px;border-radius:16px;border:4px solid #000;box-shadow:5px 5px 0 #000;display:inline-block;margin-top:4px}
.zts-app-home-btn{font-family:'Luckiest Guy',cursive;letter-spacing:.05em;text-transform:uppercase;font-size:28px;background:#FFFA00;color:#004A61;padding:16px 26px;border-radius:18px;display:inline-flex;align-items:center;gap:12px;text-decoration:none;border:4px solid #000;box-shadow:6px 6px 0 #000;transition:transform .12s,box-shadow .12s;justify-self:start;cursor:pointer}
.zts-app-back-btn{font-family:'Luckiest Guy',cursive;letter-spacing:.05em;text-transform:uppercase;font-size:28px;background:#FF6B9D;color:#fff;padding:16px 26px;border-radius:18px;display:inline-flex;align-items:center;gap:12px;text-decoration:none;border:4px solid #000;box-shadow:6px 6px 0 #000;transition:transform .12s,box-shadow .12s;justify-self:end;cursor:pointer}
.zts-app-home-btn:active,.zts-app-back-btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
.zts-app-home-btn svg,.zts-app-back-btn svg{width:28px;height:28px}
@media (max-width:900px){.zts-app-brand-main{font-size:56px}.zts-app-brand-sub{font-size:26px}.zts-app-mascot{width:54px;height:54px}.zts-app-clock{font-size:30px;padding:6px 18px}.zts-app-home-btn,.zts-app-back-btn{font-size:20px;padding:12px 18px}}
@media (max-width:640px){.zts-app-header-inner{padding:18px 16px;gap:12px}.zts-app-brand-main{font-size:38px}.zts-app-brand-sub{font-size:18px;letter-spacing:.12em}.zts-app-mascot{width:42px;height:42px;border-width:3px}.zts-app-clock{font-size:22px;padding:4px 14px}.zts-app-home-btn,.zts-app-back-btn{font-size:14px;padding:8px 12px}.zts-app-home-btn svg,.zts-app-back-btn svg{width:18px;height:18px}}
    </style>
  <script src="/zts-lock-page.js" defer></script>
  <script src="/firebase-auth.js" defer></script>
  <script src="/zts-locked-fullscreen.js" defer></script>
  <script src="/zts-funnel.js" defer></script>
  </head>
  <body>
    <header class="zts-app-header">
      <div class="zts-app-header-inner">
        <a href="../../" class="zts-app-home-btn">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
          Accueil
        </a>
        <a href="../../" class="zts-app-brand">
          <span class="zts-app-brand-main">ZONE <span class="zts-app-brand-accent">TOTAL</span> SPORT</span>
          <span class="zts-app-sub-row">
            <span class="zts-app-brand-sub">Tableau de pointage</span>
            <img class="zts-app-mascot" src="mr-root-scoreboard.png" alt="Éducateur physique">
          </span>
          <span id="ztsClock" class="zts-app-clock">09:41</span>
        </a>
        <button type="button" class="zts-app-back-btn" onclick="history.back()">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          Retour
        </button>
      </div>
    </header>
    <script>(function(){function t(){var e=document.getElementById('ztsClock');if(!e)return;var d=new Date();e.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}t();setInterval(t,15000);})();</script>
    <div id="root"></div>
    
      <script src="../../analytics.js"></script>
  <script src="../../cookie-consent.js" defer></script>
</body>
</html>
