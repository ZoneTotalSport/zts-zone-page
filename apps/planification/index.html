<!-- APP RETIRÉE le 2 septembre 2026 (chantier SITE IMPECCABLE, vague 1).
     `apps/planification/` est tuée : voir CATALOGUE-CIBLE.md §2.6. Elle se
     déclarait elle-même « squelette de validation (modèle de données + import
     maternelle + exemples Camp/SDG) » en tête de son propre fichier. Le vrai
     planificateur, c'est `apps/planificateur/` — rang 2 du catalogue cible.
     Deux adresses presque homonymes pour la même intention, c'est exactement
     la confusion que la règle d'or n°2 interdit.

     POURQUOI CE FICHIER EXISTE PLUTÔT QUE RIEN. L'app avait un lien entrant
     (shared/footer.html, sur toutes les pages du site) et une entrée au
     sitemap. Règle d'or n°3 : toute ancienne URL = redirection 301, jamais
     404. La 301 est impossible tant que l'apex est en DNS only, et GitHub
     Pages ne sait pas répondre 301 : on fait `canonical` + `noindex` +
     rafraîchissement immédiat, comme les autres pages retirées.

     CE QUI A ÉTÉ SAUVÉ : `MODELE-DONNEES.md`, la spécification du modèle de
     données que ce squelette servait à valider, a été déplacée dans
     `apps/planificateur/MODELE-DONNEES-planification.md`. Le planificateur
     absorbe `agenda` et `journee-pedago` au rang 2 ; il aura besoin de ce
     document. Le supprimer avec le squelette aurait jeté le résultat en
     gardant seulement le brouillon.

     SUPPRESSION RÉELLE : au chantier proxy orange. Voir
     REDIRECTIONS-CLOUDFLARE.md. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://zonetotalsport.ca/apps/planificateur/">
<meta http-equiv="refresh" content="0; url=https://zonetotalsport.ca/apps/planificateur/">
<script>location.replace('https://zonetotalsport.ca/apps/planificateur/');</script>

</style>
