<!DOCTYPE html>
<!-- App PLANIFICATION ZTS — squelette de validation (modèle de données + import maternelle + exemples Camp/SDG).
     Design partagé + gate d'inscription. Contenu ÉP maternelle réel ; Camp/SDG = 1 exemple chacun. -->
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planification — Zone Total Sport</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/zts.css">
  <style>
    /* Sélecteur de métier */
    .pl-pick { display:grid; gap:var(--space-4); grid-template-columns:1fr; margin:var(--space-5) 0; }
    @media(min-width:760px){ .pl-pick{ grid-template-columns:repeat(3,1fr); } }
    .pl-metier { cursor:pointer; border:var(--bord); border-radius:var(--r-3); box-shadow:var(--ombre); background:#fff;
      padding:var(--space-4); text-align:center; transition:transform .12s ease; }
    .pl-metier:hover { transform:translateY(-4px); }
    .pl-metier img { width:100%; max-width:160px; height:auto; }
    .pl-metier h2 { font-family:var(--font-impact); font-size:var(--fs-4); margin:8px 0 4px; }
    .pl-metier p { font-family:var(--font-body); font-weight:700; opacity:.8; margin:0; }
    .pl-metier.ep { border-bottom:10px solid #19B5C9; }
    .pl-metier.sdg { border-bottom:10px solid #2BB673; }
    .pl-metier.camp { border-bottom:10px solid #FF8A3D; }
    /* Contrôles */
    .pl-bar { display:flex; flex-wrap:wrap; gap:var(--space-3); align-items:center; margin-bottom:var(--space-3); }
    .pl-search { flex:1 1 200px; min-width:160px; font-family:var(--font-body); font-weight:700; font-size:var(--fs-2);
      padding:11px 16px; border:var(--bord); border-radius:var(--r-2); box-shadow:var(--ombre); background:#fff; }
    .pl-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:var(--space-3); }
    .pl-chip { font-family:var(--font-fun); font-weight:700; font-size:var(--fs-1); cursor:pointer;
      padding:7px 14px; border:var(--bord); border-radius:var(--r-pill); background:#fff; box-shadow:var(--ombre); }
    .pl-chip.active { background:var(--metier); color:var(--ink); }
    .pl-chip[disabled] { opacity:.45; cursor:not-allowed; }
    .pl-count { font-family:var(--font-fun); font-weight:700; opacity:.75; margin:0 0 var(--space-3); }
    .pl-card { cursor:pointer; position:relative; }
    .pl-fav { position:absolute; top:8px; right:10px; font-size:22px; cursor:pointer; background:none; border:0; line-height:1; }
    .pl-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .pl-meta span { font-family:var(--font-fun); font-weight:700; font-size:var(--fs-1);
      background:var(--metier-tint,rgba(0,0,0,.05)); border:2px solid var(--zts-noir); border-radius:var(--r-pill); padding:1px 10px; }
    .pl-empty { font-family:var(--font-fun); font-weight:700; opacity:.7; padding:var(--space-4); }
    .pl-back { font-family:var(--font-fun); font-weight:700; cursor:pointer; background:none; border:0; text-decoration:underline; margin-bottom:var(--space-3); }
    .pl-info { border:var(--bord); border-radius:var(--r-2); box-shadow:var(--ombre); background:#fff;
      border-left:10px solid var(--metier,#19B5C9); padding:var(--space-3) var(--space-4); margin-bottom:var(--space-4); }
    .pl-info h2 { font-family:var(--font-impact); font-size:var(--fs-3); margin:0 0 4px; }
    .pl-info p { font-family:var(--font-body); font-weight:600; margin:0 0 6px; }
    .pl-info ul { margin:6px 0 0; padding-left:20px; }
    .pl-info li { font-family:var(--font-body); font-weight:700; margin:3px 0; }
    .pl-metier .long { font-family:var(--font-body); font-weight:600; opacity:.75; font-size:var(--fs-1); margin-top:6px; display:block; }
    /* Vues planning (Camp/SDG) */
    .pl-sched { display:grid; gap:var(--space-3); }
    .pl-block { border:var(--bord); border-radius:var(--r-2); box-shadow:var(--ombre); background:#fff; padding:var(--space-3) var(--space-4);
      display:grid; grid-template-columns:96px 1fr; gap:var(--space-3); align-items:start; }
    .pl-block .h { font-family:var(--font-impact); font-size:var(--fs-2); }
    .pl-block .n { font-family:var(--font-body); font-weight:700; font-size:var(--fs-2); }
    .pl-block .d { font-family:var(--font-body); opacity:.85; font-size:var(--fs-1); margin-top:2px; }
    .pl-block.pl-click { cursor:pointer; transition:transform .14s cubic-bezier(.34,1.56,.64,1), box-shadow .14s ease; }
    .pl-block.pl-click:hover { transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--zts-noir); }
    .pl-more { font-family:var(--font-fun); font-weight:700; font-size:var(--fs-1); opacity:.55; white-space:nowrap; }
    .pl-ol { margin:6px 0 0; padding-left:20px; }
    .pl-ol li { font-family:var(--font-body); font-weight:600; margin:4px 0; }
    /* Édition */
    .pl-chip.editing { background:var(--zts-rouge,#e63329); color:#fff; }
    .pl-block.pl-edit { cursor:default; }
    .pl-ecell { display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
    .pl-ecolwrap { display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-1); cursor:pointer; }
    .pl-ecolwrap input[type=color] { width:34px; height:26px; border:2px solid var(--zts-noir); border-radius:6px; padding:0; cursor:pointer; background:none; }
    .pl-ein { width:100%; box-sizing:border-box; font-family:var(--font-body); font-weight:700; font-size:var(--fs-1);
      border:2px solid var(--zts-noir); border-radius:8px; padding:6px 8px; }
    .pl-etime { font-family:var(--font-impact); max-width:130px; }
    .pl-enom { font-size:var(--fs-2); margin-bottom:6px; }
    .pl-edesc { font-weight:600; resize:vertical; }
    .pl-platge { display:flex; align-items:center; gap:8px; }
    .pl-platge input { font-family:var(--font-impact); font-size:var(--fs-1); border:2px solid var(--zts-noir); border-radius:8px; padding:4px 8px; max-width:180px; }
    /* Bloc coloré : toute la case prend la couleur, les sous-cases (texte) restent blanches */
    .pl-block.pl-tinted { gap:var(--space-3); }
    .pl-block.pl-tinted > div { background:#fff; border-radius:10px; padding:8px 12px; }
    .pl-del { position:absolute; top:8px; right:10px; border:2px solid var(--zts-noir); background:#fff; border-radius:50%;
      width:30px; height:30px; cursor:pointer; font-size:15px; line-height:1; box-shadow:2px 2px 0 var(--zts-noir); z-index:3; }
    .pl-block.pl-edit { position:relative; }
    .pl-add { display:inline-flex; align-items:center; gap:6px; margin-top:var(--space-2); cursor:pointer;
      font-family:var(--font-impact); font-size:var(--fs-2); padding:10px 18px; border:var(--bord); border-radius:var(--r-pill);
      background:#fff; box-shadow:var(--ombre); }
    .pl-add:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--zts-noir); }
    @media print {
      [data-zts-header],[data-zts-footer],.zts-subnav,.pl-bar,#plLevels,#plFilters,#plActions,#plInfo,.pl-more,.pl-del,.pl-add,#ztg-out,.zts-metier-banner { display:none !important; }
      #plOut .pl-block { break-inside:avoid; box-shadow:none; }
      .pl-count { font-size:18px; }
    }
    /* Détail cours ÉP — fiche complète style mockup */
    .pl-phase { border:var(--bord); border-radius:var(--r-2); box-shadow:var(--ombre); background:#fff;
      margin-top:var(--space-3); padding:var(--space-3) var(--space-4); border-left:10px solid var(--metier,#19B5C9); }
    .pl-phase h3 { font-family:var(--font-impact); font-size:var(--fs-2); margin:0 0 2px; }
    .pl-phase .but { font-family:var(--font-body); font-weight:700; opacity:.85; margin:2px 0 8px; }
    .pl-phase ul, .pl-phase ol { margin:4px 0 0 0; padding-left:20px; }
    .pl-phase li { font-family:var(--font-body); font-weight:600; margin:4px 0; }
    .pl-lab { font-family:var(--font-fun); font-weight:700; font-size:var(--fs-1); display:block;
      margin-top:10px; text-transform:uppercase; letter-spacing:.03em; opacity:.8; }
    .pl-say { font-family:var(--font-hand,var(--font-body)); font-style:italic; }
    .pl-warn li { color:#9a2820; }
    .pl-pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .pl-pills span { font-family:var(--font-fun); font-weight:700; font-size:var(--fs-1);
      border:2px solid var(--zts-noir); border-radius:var(--r-pill); padding:1px 10px; background:rgba(0,0,0,.04); }
    .pl-pdur { font-family:var(--font-fun); font-weight:700; font-size:var(--fs-1); float:right; opacity:.7; }
    .pl-extra { border:2px dashed var(--zts-noir); border-radius:var(--r-2); padding:var(--space-3); margin-top:var(--space-3); }
    .pl-sub { font-family:var(--font-fun); font-weight:700; opacity:.7; margin-top:12px; }
    .pl-print { font-family:var(--font-impact); font-size:var(--fs-1); cursor:pointer; padding:8px 16px;
      border:var(--bord); border-radius:var(--r-pill); background:var(--metier); color:var(--ink); box-shadow:var(--ombre); }
    @media print { [data-zts-header],[data-zts-footer],.zts-subnav,.pl-bar,.pl-chips,.zts-modal__close,.pl-print,#ztg-out{ display:none !important; } }
  </style>
</head>
<body>

  <div data-zts-header></div>

  <nav class="zts-subnav">
    <a href="../../index.html" data-i18n="subnav.back_home">← Accueil</a>
  </nav>

  <main class="zts-container" style="padding-top:var(--space-4); padding-bottom:var(--space-7);">
    <section class="zts-metier-banner" style="margin-bottom:var(--space-4);">
      <div>
        <span class="zts-metier-banner__pill" id="plPill">Planification</span>
        <h1 style="margin-top:10px;" id="plTitle">🗂️ Planification ZTS</h1>
        <p style="margin-top:8px; font-family:var(--font-body); font-size:var(--fs-2); max-width:62ch;" id="plIntro"></p>
      </div>
    </section>

    <!-- Sélecteur de métier -->
    <section id="plSelect">
      <div class="pl-pick">
        <div class="pl-metier ep" role="button" tabindex="0" onclick="plPick('ep')" onkeydown="if(event.key==='Enter')plPick('ep')">
          <img src="../../perso-ep.png" alt="Éducation physique"><h2 id="m-ep">Éducation physique</h2><p id="m-ep-d"></p><span class="long" id="m-ep-l"></span>
        </div>
        <div class="pl-metier sdg" role="button" tabindex="0" onclick="plPick('sdg')" onkeydown="if(event.key==='Enter')plPick('sdg')">
          <img src="../../perso-sdg.png" alt="Service de garde"><h2 id="m-sdg">Service de garde</h2><p id="m-sdg-d"></p><span class="long" id="m-sdg-l"></span>
        </div>
        <div class="pl-metier camp" role="button" tabindex="0" onclick="plPick('camp')" onkeydown="if(event.key==='Enter')plPick('camp')">
          <img src="../../perso-camp.png" alt="Camp de jour"><h2 id="m-camp">Camp de jour</h2><p id="m-camp-d"></p><span class="long" id="m-camp-l"></span>
        </div>
      </div>
    </section>

    <!-- Vue métier -->
    <section id="plView" hidden>
      <button class="pl-back" id="plBack" onclick="plReset()">↩︎ Changer de métier</button>
      <div id="plInfo" class="pl-info"></div>
      <div class="pl-chips" id="plLevels"></div>
      <div class="pl-bar">
        <input type="search" class="pl-search" id="plSearch" oninput="plRender()">
        <button class="pl-chip" id="plFavToggle" onclick="favOnly=!favOnly;plRender()"></button>
        <button class="pl-chip" id="plEditToggle" hidden onclick="toggleEdit()"></button>
        <span id="plEditNote" hidden style="font-family:var(--font-body);font-weight:700;font-size:var(--fs-1);opacity:.7;"></span>
      </div>
      <div class="pl-chips" id="plFilters"></div>
      <div class="pl-chips" id="plActions" hidden style="margin-bottom:var(--space-3);"></div>
      <p class="pl-count" id="plCount"></p>
      <div id="plOut"></div>
    </section>
  </main>

  <div class="zts-modal" id="plModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="zts-modal__inner">
      <button class="zts-modal__close" data-close aria-label="Fermer">✕</button>
      <div id="plModalBody"></div>
    </div>
  </div>

  <div data-zts-footer></div>

  <script src="../../shared/zts.js"></script>
  <script src="../../shared/zts-gate.js"></script>
  <script>
    var LBL = {
      fr:{ pill:'Planification', title:'🗂️ Planification', intro:'Une banque de planifications complètes et prêtes à utiliser, pensée pour 3 réalités de terrain. Choisis ton métier ci-dessous pour découvrir ce qu\'on a préparé pour toi.',
        ep:'Éducation physique', epD:'360 cours · 4 niveaux', epL:'Des plans de cours de 60 min, du préscolaire au 3e cycle.',
        sdg:'Service de garde', sdgD:'200 jours · matin + soir', sdgL:'L\'année complète, bloc matin et bloc soir.',
        camp:'Camp de jour', campD:'7 semaines · 3 groupes', campL:'Des semaines thématiques, journée par journée.',
        back:'↩︎ Changer de métier', search:'Rechercher…', soon:'Bientôt', count1:n=>`${n} cours`, countD:'Horaire de la journée',
        fav:'Favori', favOn:'★ Mes favoris', favOff:'☆ Mes favoris', favEmpty:'Aucun favori pour l\'instant — touche l\'étoile sur un cours pour le sauvegarder.', saved:'sauvegardé',
        print:'🖨️ Imprimer / PDF', materiel:'Matériel', intention:'Intention pédagogique', prep:'Préparation',
        wk:'Semaine', day:'Jour', planB:'☔ Plan B météo', saison:'Saison', allSaisons:'Toute l\'année', loginNote:'(sauvegardé sur ton compte)', wdays:['Lun','Mar','Mer','Jeu','Ven'],
        details:'Détails', objectif:'Objectif', deroulement:'Déroulement', variantes:'Variantes', astuce:'Astuce',
        edit:'✏️ Personnaliser', editDone:'✓ Terminer', editNote:'Modifs sauvegardées sur ton compte', addCase:'Ajouter une case', delCase:'Supprimer cette case', newCase:'Nouvelle activité',
        print:'Imprimer / PDF', resetView:'Réinitialiser', resetConfirm:'Annuler toutes tes personnalisations de cette vue?', duplicate:'Dupliquer', dupTitle:'Dupliquer vers…', dupWeek:'Semaine', dupDay:'Jour', dupGroup:'Groupe', dupGo:'Copier ici', dupDone:'Copié!' },
      en:{ pill:'Planning', title:'🗂️ Planning', intro:'A bank of complete, ready-to-use plans built for 3 real-world roles. Pick your role below to see what we prepared for you.',
        ep:'Physical education', epD:'360 lessons · 4 levels', epL:'60-min lesson plans, from preschool to 3rd cycle.',
        sdg:'Daycare', sdgD:'200 days · morning + evening', sdgL:'The full year, morning and evening blocks.',
        camp:'Day camp', campD:'7 weeks · 3 groups', campL:'Themed weeks, day by day.',
        back:'↩︎ Change role', search:'Search…', soon:'Soon', count1:n=>`${n} lessons`, countD:'Day schedule',
        fav:'Favorite', favOn:'★ My favorites', favOff:'☆ My favorites', favEmpty:'No favorites yet — tap the star on a lesson to save it.', saved:'saved',
        print:'🖨️ Print / PDF', materiel:'Equipment', intention:'Teaching intent', prep:'Setup',
        wk:'Week', day:'Day', planB:'☔ Weather plan B', saison:'Season', allSaisons:'All year', loginNote:'(saved to your account)', wdays:['Mon','Tue','Wed','Thu','Fri'],
        details:'Details', objectif:'Goal', deroulement:'Steps', variantes:'Variations', astuce:'Tip',
        edit:'✏️ Customize', editDone:'✓ Done', editNote:'Changes saved to your account', addCase:'Add a block', delCase:'Remove this block', newCase:'New activity',
        print:'Print / PDF', resetView:'Reset', resetConfirm:'Undo all your customizations on this view?', duplicate:'Duplicate', dupTitle:'Duplicate to…', dupWeek:'Week', dupDay:'Day', dupGroup:'Group', dupGo:'Copy here', dupDone:'Copied!' }
    };
    // Explication détaillée par métier (bandeau à l'entrée)
    var METIER_INFO = {
      ep:{ fr:{ h:'🏃 Planification en éducation physique',
             p:'Une banque de cours de 60 minutes clés en main pour le gymnase, du préscolaire au 3e cycle. Chaque cours suit la même structure éprouvée et est lié au Programme de formation (PFEQ).',
             li:['📋 Structure complète : mise en train · 2 activités · retour au calme','🎯 Intention pédagogique + compétences PFEQ pour chaque cours','💬 Démonstration, consignes « à dire aux élèves », sécurité, adaptations','🔎 Filtre par niveau, saison et compétence + impression/PDF'] },
           en:{ h:'🏃 Physical education planning',
             p:'A bank of turnkey 60-minute gym lessons, from preschool to 3rd cycle. Every lesson follows the same proven structure and maps to the Quebec program (PFEQ).',
             li:['📋 Full structure: warm-up · 2 activities · wind-down','🎯 Teaching intent + PFEQ competencies per lesson','💬 Demo, "what to say to students", safety, adaptations','🔎 Filter by level, season and competency + print/PDF'] } },
      sdg:{ fr:{ h:'🧸 Planification en service de garde',
             p:'La programmation de l\'année scolaire (jusqu\'à 200 jours), pensée pour les deux moments clés : le bloc du matin (7 h – 9 h) et le bloc du soir (15 h – 18 h).',
             li:['🌅 Chaque jour : accueil · jeu calme · jeu actif · retour au calme','☔ Plan pluie intégré pour chaque bloc','👶 Adapté aux groupes multiâges de la cour d\'école','🔎 Navigation par jour (et bientôt par semaine)'] },
           en:{ h:'🧸 Daycare planning',
             p:'The school-year program (up to 200 days), built around the two key moments: the morning block (7–9 a.m.) and the evening block (3–6 p.m.).',
             li:['🌅 Each day: welcome · calm game · active game · wind-down','☔ Built-in rainy-day plan for each block','👶 Suited to mixed-age schoolyard groups','🔎 Browse by day (and soon by week)'] } },
      camp:{ fr:{ h:'🏕️ Planification de camp de jour',
             p:'Des semaines thématiques complètes (7 semaines), planifiées journée par journée et déclinées pour 3 groupes d\'âge : 5-7, 8-10 et 11-12 ans.',
             li:['📅 Horaire complet 9 h – 16 h : 7 blocs par jour','🎨 Un thème par semaine (pirates, etc.) avec grands jeux et plein air','☀️ Plan B météo pour chaque semaine','🔎 Choisis la semaine et le groupe d\'âge'] },
           en:{ h:'🏕️ Day-camp planning',
             p:'Complete themed weeks (7 weeks), planned day by day and split into 3 age groups: 5-7, 8-10 and 11-12.',
             li:['📅 Full 9 a.m.–4 p.m. schedule: 7 blocks per day','🎨 One theme per week (pirates, etc.) with big games and outdoors','☀️ Weather plan B for every week','🔎 Pick the week and age group'] } }
    };
    function L(){ return LBL[ZTS.getLang()]; }
    var favOnly = false, UID = null, PL_BLOCKS = [];

    var EP_LEVELS = [
      { key:'maternelle', fr:'Maternelle', en:'Kindergarten', file:'data/ep-maternelle.json', ready:true },
      { key:'1er', fr:'1er cycle', en:'1st cycle', file:'data/ep-1er.json', ready:true },
      { key:'2e', fr:'2e cycle', en:'2nd cycle', file:'data/ep-2e.json', ready:true },
      { key:'3e', fr:'3e cycle', en:'3rd cycle', file:'data/ep-3e.json', ready:true }
    ];
    var CAMP_AGES = ['5-7','8-10','11-12'];
    var CAMP_WEEKS = [{n:1,ready:true},{n:2,ready:true},{n:3,ready:true},{n:4,ready:true},{n:5,ready:true},{n:6,ready:true},{n:7,ready:true}];
    var state = { metier:null, epLevel:'maternelle', epSaison:'*', campWeek:1, campAge:'5-7', sdgWeek:1, sdgJourSem:1, cache:{} };
    // Favoris persistés — par compte (UID) si connecté, sinon clé locale partagée
    function favKey(){ return 'zts_planif_fav' + (UID ? '_'+UID : ''); }
    var FAV = loadFav();
    function loadFav(){ try{ return new Set(JSON.parse(localStorage.getItem(favKey())||'[]')); }catch(e){ return new Set(); } }
    function saveFav(){ try{ localStorage.setItem(favKey(), JSON.stringify([...FAV])); }catch(e){} }
    // Quand l'utilisateur se connecte, recharge SES favoris (et migre ceux faits avant connexion)
    document.addEventListener('zts:auth', function(e){
      var u = e && e.detail && e.detail.user; if(!u) return;
      var anon = [...FAV]; var anonEdits = EDITS; UID = u.uid;
      FAV = loadFav();
      if(anon.length){ anon.forEach(x=>FAV.add(x)); saveFav(); }
      // édits : recharge ceux du compte + migre ceux faits avant connexion
      EDITS = loadEdits();
      if(anonEdits && Object.keys(anonEdits).length){ Object.keys(anonEdits).forEach(k=>{ if(!EDITS[k]) EDITS[k]=anonEdits[k]; }); saveEdits(); }
      if(state.metier) plRender();
    });

    function getJSON(file){
      if(state.cache[file]) return Promise.resolve(state.cache[file]);
      return fetch(file).then(r=>r.json()).then(d=>{ state.cache[file]=d; return d; });
    }

    // ---------- statique ----------
    function plStatic(){
      var l=L();
      document.getElementById('plPill').textContent=l.pill;
      document.getElementById('plTitle').textContent=l.title;
      document.getElementById('plIntro').textContent=l.intro;
      document.getElementById('plSearch').placeholder=l.search;
      document.getElementById('plBack').textContent=l.back;
      document.getElementById('m-ep').textContent=l.ep; document.getElementById('m-ep-d').textContent=l.epD; document.getElementById('m-ep-l').textContent=l.epL;
      document.getElementById('m-sdg').textContent=l.sdg; document.getElementById('m-sdg-d').textContent=l.sdgD; document.getElementById('m-sdg-l').textContent=l.sdgL;
      document.getElementById('m-camp').textContent=l.camp; document.getElementById('m-camp-d').textContent=l.campD; document.getElementById('m-camp-l').textContent=l.campL;
    }

    function renderInfo(){
      var info=METIER_INFO[state.metier]; if(!info) return;
      var d=info[ZTS.getLang()];
      document.getElementById('plInfo').innerHTML =
        `<h2>${d.h}</h2><p>${d.p}</p><ul>${d.li.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    }

    // ---------- navigation ----------
    function plPick(m){
      state.metier=m; favOnly=false; editMode=false;
      document.body.setAttribute('data-metier', m);
      document.getElementById('plSelect').hidden=true;
      document.getElementById('plView').hidden=false;
      renderInfo(); buildLevels(); plRender();
    }
    function plReset(){
      state.metier=null; favOnly=false;
      document.body.removeAttribute('data-metier');
      document.getElementById('plView').hidden=true;
      document.getElementById('plSelect').hidden=false;
      document.getElementById('plSearch').value='';
      document.getElementById('plActions').hidden=true;
    }
    window.plPick=plPick; window.plReset=plReset;

    // ---------- chips de niveau / semaine / jour ----------
    function buildLevels(){
      var l=L(), lang=ZTS.getLang(), box=document.getElementById('plLevels');
      if(state.metier==='ep'){
        box.innerHTML = EP_LEVELS.map(lv=>{
          var lab = lv[lang] + (lv.ready?'':' · '+l.soon);
          return `<button class="pl-chip${state.epLevel===lv.key?' active':''}" ${lv.ready?'':'disabled'} onclick="state.epLevel='${lv.key}';state.epSaison='*';buildLevels();plRender()">${lab}</button>`;
        }).join('');
      } else if(state.metier==='camp'){
        box.innerHTML = CAMP_WEEKS.map(w=>{
          var lab = l.wk+' '+w.n + (w.ready?'':' · '+l.soon);
          return `<button class="pl-chip${state.campWeek===w.n?' active':''}" ${w.ready?'':'disabled'} onclick="state.campWeek=${w.n};buildLevels();plRender()">${lab}</button>`;
        }).join('');
      } else if(state.metier==='sdg'){
        var weeks=Array.from({length:40},(_,i)=>i+1);
        box.innerHTML =
          `<label class="pl-chip" style="cursor:default;">${l.wk}&nbsp;<select id="sdgWeekSel" onchange="state.sdgWeek=+this.value;buildLevels();plRender()" style="border:0;font-family:inherit;font-weight:700;font-size:inherit;background:transparent;cursor:pointer;">`+
          weeks.map(w=>`<option value="${w}"${state.sdgWeek===w?' selected':''}>${w} / 40</option>`).join('')+`</select></label>`+
          l.wdays.map((d,i)=>`<button class="pl-chip${state.sdgJourSem===i+1?' active':''}" onclick="state.sdgJourSem=${i+1};plRender()">${d}</button>`).join('');
      } else { box.innerHTML=''; }
    }
    window.state=state; window.buildLevels=buildLevels;

    // ---------- rendu principal ----------
    function plRender(){
      plStatic();
      var l=L();
      var ft=document.getElementById('plFavToggle'), et=document.getElementById('plEditToggle'),
          note=document.getElementById('plEditNote'), search=document.getElementById('plSearch');
      var isEP=state.metier==='ep';
      // Bouton « Personnaliser » sur les 3 métiers ; favoris + recherche en ÉP (hors édition)
      ft.hidden = !isEP || editMode;
      search.style.display = (isEP && !editMode) ? '' : 'none';
      et.hidden = false;
      et.textContent = editMode?l.editDone:l.edit; et.classList.toggle('editing',editMode);
      note.hidden = !editMode; note.textContent = l.editNote;
      if(isEP && !editMode){ ft.classList.toggle('active',favOnly); ft.textContent=(favOnly?l.favOn:l.favOff)+(FAV.size?' ('+FAV.size+')':''); }
      // barre d'actions : imprimer (toujours) + réinitialiser/dupliquer (édition)
      var act=document.getElementById('plActions');
      var btns=`<button class="pl-chip" onclick="doPrint()">🖨️ ${l.print}</button>`;
      if(editMode){
        btns+=`<button class="pl-chip" onclick="resetView()">↺ ${l.resetView}</button>`;
        if(!isEP) btns+=`<button class="pl-chip" onclick="openDuplicate()">⧉ ${l.duplicate}</button>`;
      }
      act.innerHTML=btns; act.hidden=false;
      if(isEP) return renderEP();
      if(state.metier==='camp') return renderCamp();
      if(state.metier==='sdg') return renderSDG();
    }
    window.plRender=plRender;

    // ---------- ÉP ----------
    function renderEP(){
      var l=L(), lv=EP_LEVELS.find(x=>x.key===state.epLevel);
      var out=document.getElementById('plOut'), fbox=document.getElementById('plFilters');
      if(!lv.ready){ fbox.innerHTML=''; document.getElementById('plCount').textContent=''; out.innerHTML=`<p class="pl-empty">⛏️ ${l.soon} — niveau en préparation.</p>`; return; }
      getJSON(lv.file).then(cours=>{
        // filtres : saisons (periode) + PFEQ
        var saisons=[...new Set(cours.map(c=>c.periode).filter(Boolean))];
        var pfeqs=[...new Set(cours.flatMap(c=>c.pfeq||[]))].sort();
        fbox.dataset.pfeq = fbox.dataset.pfeq||'*';
        fbox.innerHTML =
          `<button class="pl-chip${state.epSaison==='*'?' active':''}" onclick="state.epSaison='*';plRender()">📅 ${l.allSaisons}</button>`+
          saisons.map(s=>`<button class="pl-chip${state.epSaison===s?' active':''}" onclick="state.epSaison=this.dataset.s;plRender()" data-s="${s}">${s}</button>`).join('')+
          `<span style="width:10px"></span>`+
          `<button class="pl-chip${fbox.dataset.pfeq==='*'?' active':''}" onclick="document.getElementById('plFilters').dataset.pfeq='*';plRender()">PFEQ ✓</button>`+
          pfeqs.map(p=>`<button class="pl-chip${fbox.dataset.pfeq===p?' active':''}" onclick="document.getElementById('plFilters').dataset.pfeq='${p}';plRender()">${p}</button>`).join('');
        var q=(document.getElementById('plSearch').value||'').toLowerCase();
        var pf=fbox.dataset.pfeq;
        var list=cours.filter(c=>
          (state.epSaison==='*'||c.periode===state.epSaison) &&
          (pf==='*'||(c.pfeq||[]).includes(pf)) &&
          (!favOnly || FAV.has('ep-'+c.id)) &&
          (!q || (c.titre+' '+(c.intention||'')).toLowerCase().includes(q)));
        document.getElementById('plCount').textContent=l.count1(list.length);
        var ekey=c=>'e|'+state.epLevel+'|'+c.id;
        var ectx='e|'+state.epLevel, es=EDITS['ST|'+ectx]||{removed:[],added:[]};
        // MODE ÉDITION : heure + titre + couleur + supprimer/ajouter
        if(editMode){
          out.className='';
          var rows=list.filter(c=>(es.removed||[]).indexOf(c.id)<0).map(c=>{
            var e=EDITS[ekey(c)]||{}, key=ekey(c);
            var heure=e.heure!=null?e.heure:'', titre=e.nom!=null?e.nom:c.titre, col=e.color;
            return `<div class="pl-block pl-edit${col?' pl-tinted':''}" data-hk="${key}"${col?` style="background:${col};"`:''}>
              <button class="pl-del" title="${l.delCase}" onclick="removeBlock('${key}')">🗑️</button>
              <div class="pl-ecell" style="flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap;">
                <input class="pl-ein pl-etime" placeholder="🕐 heure" value="${escAttr(heure)}" oninput="editSet('${key}','heure',this.value)">
                <label class="pl-ecolwrap">🎨<input type="color" value="${col||'#cfd8e3'}" oninput="editColor('${key}',this.value)"></label>
                <span style="font-family:var(--font-fun);font-weight:700;opacity:.6;">#${c.id}</span>
                <input class="pl-ein pl-enom" style="flex:1;min-width:180px;" value="${escAttr(titre)}" oninput="editSet('${key}','nom',this.value)">
              </div>
            </div>`;
          });
          var added=(es.added||[]).map((a,j)=>{
            var key='ST|'+ectx+'|add|'+j, col=a.color;
            return `<div class="pl-block pl-edit${col?' pl-tinted':''}" data-hk="${key}"${col?` style="background:${col};"`:''}>
              <button class="pl-del" title="${l.delCase}" onclick="removeBlock('${key}')">🗑️</button>
              <div class="pl-ecell" style="flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap;">
                <input class="pl-ein pl-etime" placeholder="🕐 heure" value="${escAttr(a.heure||'')}" oninput="editSet('${key}','heure',this.value)">
                <label class="pl-ecolwrap">🎨<input type="color" value="${col||'#cfd8e3'}" oninput="editColor('${key}',this.value)"></label>
                <input class="pl-ein pl-enom" style="flex:1;min-width:180px;" value="${escAttr(a.nom||'')}" oninput="editSet('${key}','nom',this.value)">
              </div>
            </div>`;
          });
          out.innerHTML='<div class="pl-sched">'+rows.concat(added).join('')+'</div>'+`<button class="pl-add" onclick="addBlock('${ectx}')">➕ ${l.addCase}</button>`;
          return;
        }
        out.className='zts-grid';
        var vis=list.filter(c=>(es.removed||[]).indexOf(c.id)<0);
        if(!vis.length && !(es.added||[]).length){ out.className=''; out.innerHTML=`<p class="pl-empty">${favOnly?l.favEmpty:'Aucun cours.'}</p>`; return; }
        out.innerHTML=vis.map(c=>{
          var e=EDITS[ekey(c)]||{}, titre=e.nom!=null?e.nom:c.titre;
          var bord=e.color?` style="border-left:12px solid ${e.color};"`:'';
          return `
          <div class="zts-app-card pl-card" role="button" tabindex="0"${bord} onclick="epOpen(${c.id})" onkeydown="if(event.key==='Enter')epOpen(${c.id})">
            <button class="pl-fav" title="${l.fav}" onclick="event.stopPropagation();toggleFav(${c.id},this)">${FAV.has('ep-'+c.id)?'★':'☆'}</button>
            <span class="zts-app-card__icon">📋</span>
            <span class="zts-app-card__name">#${c.id} · ${esc(titre)}</span>
            <span class="zts-app-card__desc">${(c.intention||'').slice(0,90)}…</span>
            <div class="pl-meta">${e.heure?`<span>🕐 ${esc(e.heure)}</span>`:''}<span>⏱️ ${c.duree||'60 min'}</span>${c.periode?`<span>📅 ${c.periode.split(' — ')[0]}</span>`:''}${(c.pfeq||[]).slice(0,2).map(p=>`<span>${p}</span>`).join('')}</div>
          </div>`;}).join('')
        + (es.added||[]).map((a,j)=>{
            var bord=a.color?` style="border-left:12px solid ${a.color};"`:'';
            return `<div class="zts-app-card pl-card" role="button" tabindex="0"${bord} onclick="epOpenAdded(${j})" onkeydown="if(event.key==='Enter')epOpenAdded(${j})">
              <span class="zts-tag zts-tag--new">${ZTS.t('tag.new')||'NOUVEAU'}</span>
              <span class="zts-app-card__icon">✏️</span>
              <span class="zts-app-card__name">${esc(a.nom||l.newCase)}</span>
              <span class="zts-app-card__desc">${esc((a.desc||'').slice(0,90))}</span>
              <div class="pl-meta">${a.heure?`<span>🕐 ${esc(a.heure)}</span>`:''}</div>
            </div>`;
          }).join('');
      });
    }
    function epOpenAdded(j){
      var s=EDITS['ST|e|'+state.epLevel]; if(!s||!s.added||!s.added[j]) return; var a=s.added[j];
      document.getElementById('plModalBody').innerHTML=
        `<h2 class="zts-modal__title">✏️ ${esc(a.nom||L().newCase)}</h2>`+
        `<div class="pl-meta" style="margin:8px 0;">${a.heure?`<span>🕐 ${esc(a.heure)}</span>`:''}<span>${esc(state.epLevel)}</span></div>`+
        (a.desc?`<p style="font-family:var(--font-body);font-weight:600;">${esc(a.desc)}</p>`:'');
      ZTS.openModal('plModal');
    }
    window.epOpenAdded=epOpenAdded;
    function toggleFav(id,btn){ var k='ep-'+id; if(FAV.has(k))FAV.delete(k); else FAV.add(k); saveFav();
      if(btn)btn.textContent=FAV.has(k)?'★':'☆';
      var ft=document.getElementById('plFavToggle'); if(ft&&!ft.hidden) ft.textContent=(favOnly?L().favOn:L().favOff)+(FAV.size?' ('+FAV.size+')':'');
      if(favOnly) plRender(); }
    window.toggleFav=toggleFav;
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function listBlock(label, arr, cls){
      if(!arr || !arr.length) return '';
      return `<span class="pl-lab">${label}</span><ul class="${cls||''}">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    }
    function pillsBlock(label, arr){
      if(!arr || !arr.length) return '';
      return `<span class="pl-lab">${label}</span><div class="pl-pills">${arr.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
    }
    function phaseHtml(p,label){
      if(!p) return '';
      return `<div class="pl-phase">
        ${p.duree?`<span class="pl-pdur">⏱️ ${esc(p.duree)}</span>`:''}
        <h3>${label}${p.nom?' — '+esc(p.nom):''}</h3>
        ${p.but?`<p class="but">${esc(p.but)}</p>`:''}
        ${p.demo?`<span class="pl-lab">👩‍🏫 Démonstration</span><p style="font-weight:600;">${esc(p.demo)}</p>`:''}
        ${p.deroulement&&p.deroulement.length?`<span class="pl-lab">▶️ Déroulement</span><ol>${p.deroulement.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
        ${listBlock('💬 À dire aux élèves', p.consignes && p.consignes.map(s=>`« ${s} »`), 'pl-say')}
        ${pillsBlock('🔀 Variantes', p.variantes)}
        ${listBlock('⚠️ Sécurité', p.securite, 'pl-warn')}
        ${listBlock('🚫 Erreurs fréquentes', p.erreurs)}
        ${listBlock('♿ Adaptations', p.adaptations)}
        ${listBlock('🙋 Questions des élèves', p.questions_eleves)}
      </div>`;
    }
    function epOpen(id){
      var lv=EP_LEVELS.find(x=>x.key===state.epLevel), l=L();
      getJSON(lv.file).then(cours=>{
        var c=cours.find(x=>x.id===id); if(!c) return;
        var e=EDITS['e|'+state.epLevel+'|'+c.id]||{};
        var titre=e.nom!=null?e.nom:c.titre;
        var extra='';
        if(c.astuce) extra+=`<span class="pl-lab">💡 Astuce</span><p style="font-weight:600;">${esc(c.astuce)}</p>`;
        if(c.evaluation) extra+=`<span class="pl-lab">✅ Évaluation</span><p style="font-weight:600;">${esc(c.evaluation)}</p>`;
        if(c.prolongement) extra+=`<span class="pl-lab">➕ Prolongement</span><p style="font-weight:600;">${esc(c.prolongement)}</p>`;
        document.getElementById('plModalBody').innerHTML=
          `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
             <h2 class="zts-modal__title" style="margin:0;">📋 #${c.id} · ${esc(titre)}</h2>
             <button class="pl-print" onclick="window.print()">${l.print}</button>
           </div>
           <div class="pl-meta" style="margin:8px 0;">${e.heure?`<span>🕐 ${esc(e.heure)}</span>`:''}<span>${esc(c.niveau||'')}</span><span>⏱️ ${esc(c.duree||'')}</span><span>👥 ${esc(c.eleves||'')}</span>${(c.pfeq||[]).map(p=>`<span>${p}</span>`).join('')}</div>
           <p class="pl-sub">${l.intention}</p><p style="font-family:var(--font-body);font-weight:600;">${esc(c.intention||'')}</p>
           ${listBlock('🎒 '+l.materiel, c.materiel)}
           ${listBlock('🛠️ '+l.prep, c.preparation)}
           ${phaseHtml(c.mise_en_train,'① Mise en train')}
           ${phaseHtml(c.activite_1,'② Activité 1')}
           ${phaseHtml(c.activite_2,'③ Activité 2')}
           ${phaseHtml(c.retour,'④ Retour au calme')}
           ${extra?`<div class="pl-extra">${extra}</div>`:''}`;
        ZTS.openModal('plModal');
      });
    }
    window.epOpen=epOpen;

    // ---------- Fiche détaillée d'un bloc (Camp / SDG) ----------
    function openBlock(i){
      var b=PL_BLOCKS[i]; if(!b) return; var l=L();
      var meta=[];
      var head=b._hdr || b.heure || (b.type?b.type.replace('_',' '):'');
      if(head) meta.push((/\d/.test(head)?'🕐 ':'🏷️ ')+head);
      if(b.lieu) meta.push('📍 '+b.lieu);
      if(b.energie) meta.push('⚡ '+b.energie);
      document.getElementById('plModalBody').innerHTML=
        `<h2 class="zts-modal__title">${esc(b.nom)}</h2>`+
        `<div class="pl-meta" style="margin:8px 0;">${meta.map(m=>`<span>${m}</span>`).join('')}</div>`+
        `<p style="font-family:var(--font-body);font-weight:600;">${esc(b.desc)}</p>`+
        (b.but?`<span class="pl-lab">🎯 ${l.objectif}</span><p style="font-family:var(--font-body);font-weight:600;">${esc(b.but)}</p>`:'')+
        (b.deroulement&&b.deroulement.length?`<span class="pl-lab">▶️ ${l.deroulement}</span><ol class="pl-ol">${b.deroulement.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'')+
        (b.materiel&&b.materiel.length?`<span class="pl-lab">🎒 ${l.materiel}</span><div class="pl-pills">${b.materiel.map(m=>`<span>${esc(m)}</span>`).join('')}</div>`:'')+
        (b.variantes&&b.variantes.length?`<span class="pl-lab">🔀 ${l.variantes}</span><ul class="pl-ol">${b.variantes.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'')+
        (b.astuce?`<div class="pl-extra"><span class="pl-lab">💡 ${l.astuce}</span><p style="font-family:var(--font-body);font-weight:600;margin:4px 0 0;">${esc(b.astuce)}</p></div>`:'');
      ZTS.openModal('plModal');
    }
    window.openBlock=openBlock;

    // ---------- Personnalisation (édition + sauvegarde par compte) ----------
    var editMode=false, EDITS=loadEdits();
    function editsKey(){ return 'zts_planif_edits'+(UID?'_'+UID:''); }
    function loadEdits(){ try{ return JSON.parse(localStorage.getItem(editsKey())||'{}'); }catch(e){ return {}; } }
    function saveEdits(){ try{ localStorage.setItem(editsKey(), JSON.stringify(EDITS)); }catch(e){} }
    function editSet(key,field,val){
      var m=key.match(/^ST\|(.+)\|add\|(\d+)$/);
      if(m){ editAddSet(m[1], +m[2], field, val); return; }   // case ajoutée
      if(!EDITS[key]) EDITS[key]={};
      if(val==null||val==='') delete EDITS[key][field]; else EDITS[key][field]=val;
      if(!Object.keys(EDITS[key]).length) delete EDITS[key];
      saveEdits();
    }
    // ---- Structure : ajouter / enlever des cases (par groupe) ----
    function st(ctx){ var k='ST|'+ctx; if(!EDITS[k]) EDITS[k]={removed:[],added:[]}; return EDITS[k]; }
    function cleanSt(ctx){ var k='ST|'+ctx,s=EDITS[k]; if(s && !(s.removed&&s.removed.length) && !(s.added&&s.added.length)) delete EDITS[k]; }
    function editAddSet(ctx,j,field,val){ var s=st(ctx); if(s.added[j]){ if(val==null||val==='') delete s.added[j][field]; else s.added[j][field]=val; saveEdits(); } }
    function addBlock(ctx){ var s=st(ctx); s.added.push({heure:'',nom:L().newCase,desc:'',color:null,lieu:'local'}); saveEdits(); plRender(); }
    function removeBlock(key){
      var m=key.match(/^ST\|(.+)\|add\|(\d+)$/);
      if(m){ var s=st(m[1]); s.added.splice(+m[2],1); cleanSt(m[1]); saveEdits(); plRender(); return; }
      var p=key.lastIndexOf('|'), ctx=key.slice(0,p), i=+key.slice(p+1);
      var s2=st(ctx); if(s2.removed.indexOf(i)<0) s2.removed.push(i); saveEdits(); plRender();
    }
    function groupBlocks(ctx, base){
      var s=EDITS['ST|'+ctx]||{removed:[],added:[]}, list=[];
      base.forEach(function(b,i){
        if(s.removed && s.removed.indexOf(i)>=0) return;
        var e=EDITS[ctx+'|'+i]||{};
        list.push({ key:ctx+'|'+i, block:Object.assign({},b,{ _hdr:(e.heure!=null?e.heure:b._hdr), nom:(e.nom!=null?e.nom:b.nom), desc:(e.desc!=null?e.desc:b.desc), _color:e.color }) });
      });
      (s.added||[]).forEach(function(a,j){
        list.push({ key:'ST|'+ctx+'|add|'+j, block:{ _hdr:a.heure||'', nom:a.nom||'', desc:a.desc||'', _color:a.color, lieu:a.lieu||'local', materiel:a.materiel||[], _added:true } });
      });
      return list;
    }
    function groupHTML(ctx, base, flatStart){
      var gl=groupBlocks(ctx, base);
      var html='<div class="pl-sched">'+ gl.map(function(it,k){ return cardHTML(it.block, it.key, flatStart+k); }).join('') +'</div>';
      if(editMode) html += `<button class="pl-add" onclick="addBlock('${ctx}')">➕ ${L().addCase}</button>`;
      return { html:html, blocks:gl.map(function(x){return x.block;}), count:gl.length };
    }
    window.addBlock=addBlock; window.removeBlock=removeBlock;

    // ---- Imprimer / Réinitialiser / Dupliquer ----
    function doPrint(){ window.print(); }
    function curJour(){ return (state.sdgWeek-1)*5 + state.sdgJourSem; }
    function curCtx(){
      if(state.metier==='ep') return 'e|'+state.epLevel;
      if(state.metier==='camp') return 'c|'+state.campWeek+'|'+state.campAge;
      return 's|'+curJour();
    }
    function resetView(){
      if(!confirm(L().resetConfirm)) return;
      var ctx=curCtx();
      Object.keys(EDITS).forEach(function(k){
        if(k===ctx || k===('ST|'+ctx) || k.indexOf(ctx+'|')===0 || k.indexOf('ST|'+ctx+'|')===0 || k.indexOf('ST|'+ctx)===0) delete EDITS[k];
      });
      saveEdits(); plRender();
    }
    function duplicateTo(srcCtx, destCtx){
      if(srcCtx===destCtx) return;
      var copies={};
      Object.keys(EDITS).forEach(function(k){
        if(k.indexOf(srcCtx+'|')===0) copies[destCtx+k.slice(srcCtx.length)]=JSON.parse(JSON.stringify(EDITS[k]));
        else if(k==='ST|'+srcCtx) copies['ST|'+destCtx]=JSON.parse(JSON.stringify(EDITS[k]));
        else if(k.indexOf('ST|'+srcCtx+'|')===0) copies['ST|'+destCtx+k.slice(('ST|'+srcCtx).length)]=JSON.parse(JSON.stringify(EDITS[k]));
      });
      Object.assign(EDITS, copies); saveEdits();
    }
    function openDuplicate(){
      var l=L(), lang=ZTS.getLang(), body='';
      if(state.metier==='camp'){
        var weeks=Array.from({length:7},(_,i)=>i+1);
        body=`<label class="pl-lab">${l.dupWeek}</label><select id="dpW" class="pl-ein" style="max-width:140px;">`+weeks.map(w=>`<option value="${w}"${w===state.campWeek?' selected':''}>${l.dupWeek} ${w}</option>`).join('')+`</select>`+
          `<label class="pl-lab">${l.dupGroup}</label><select id="dpG" class="pl-ein" style="max-width:140px;">`+CAMP_AGES.map(a=>`<option value="${a}"${a===state.campAge?' selected':''}>${a} ${lang==='fr'?'ans':'yrs'}</option>`).join('')+`</select>`+
          `<div style="margin-top:14px;"><button class="pl-add" onclick="applyDuplicate()">📋 ${l.dupGo}</button></div>`;
      } else {
        var ws=Array.from({length:40},(_,i)=>i+1);
        body=`<label class="pl-lab">${l.dupWeek}</label><select id="dpW" class="pl-ein" style="max-width:160px;">`+ws.map(w=>`<option value="${w}"${w===state.sdgWeek?' selected':''}>${l.dupWeek} ${w}</option>`).join('')+`</select>`+
          `<label class="pl-lab">${l.dupDay}</label><select id="dpD" class="pl-ein" style="max-width:160px;">`+l.wdays.map((d,i)=>`<option value="${i+1}"${(i+1)===state.sdgJourSem?' selected':''}>${d}</option>`).join('')+`</select>`+
          `<div style="margin-top:14px;"><button class="pl-add" onclick="applyDuplicate()">📋 ${l.dupGo}</button></div>`;
      }
      document.getElementById('plModalBody').innerHTML=`<h2 class="zts-modal__title">⧉ ${l.dupTitle}</h2><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start;">${body}</div>`;
      ZTS.openModal('plModal');
    }
    function applyDuplicate(){
      var src=curCtx(), dest;
      if(state.metier==='camp'){ dest='c|'+(+document.getElementById('dpW').value)+'|'+document.getElementById('dpG').value; }
      else { var dj=(+document.getElementById('dpW').value-1)*5 + (+document.getElementById('dpD').value); dest='s|'+dj; }
      duplicateTo(src, dest);
      var c=document.querySelector('.zts-modal__close'); if(c)c.click();
      alert(L().dupDone);
    }
    window.doPrint=doPrint; window.resetView=resetView; window.openDuplicate=openDuplicate; window.applyDuplicate=applyDuplicate;
    function editColor(key,val){
      editSet(key,'color',val);
      var el=document.querySelector('.pl-block[data-hk="'+key+'"]');
      if(el){ el.style.background=val; el.classList.add('pl-tinted'); }
    }
    function pickText(hex){ if(!hex) return ''; var c=hex.replace('#',''); if(c.length===3)c=c.split('').map(x=>x+x).join('');
      var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
      return (0.299*r+0.587*g+0.114*b)>150?'#1a1a1a':'#fff'; }
    function mergedBlock(b,key){ var e=EDITS[key]||{}; return Object.assign({},b,{
      _hdr:(e.heure!=null?e.heure:b._hdr), nom:(e.nom!=null?e.nom:b.nom), desc:(e.desc!=null?e.desc:b.desc), _color:e.color }); }
    function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
    function toggleEdit(){ editMode=!editMode; plRender(); }
    window.editSet=editSet; window.editColor=editColor; window.toggleEdit=toggleEdit;

    // Carte d'un bloc (vue ou édition) — m = bloc déjà fusionné avec les édits
    function cardHTML(m, key, flatIndex){
      var l=L();
      var tint = m._color? ' pl-tinted':'';
      var bstyle = m._color? ` style="background:${m._color};"`:'';
      if(editMode){
        return `<div class="pl-block pl-edit${tint}" data-hk="${key}"${bstyle}>
          <button class="pl-del" title="${L().delCase}" onclick="removeBlock('${key}')">🗑️</button>
          <div class="pl-ecell">
            <input class="pl-ein pl-etime" value="${escAttr(m._hdr)}" oninput="editSet('${key}','heure',this.value)">
            <label class="pl-ecolwrap">🎨<input type="color" value="${m._color||'#cfd8e3'}" oninput="editColor('${key}',this.value)"></label>
          </div>
          <div>
            <input class="pl-ein pl-enom" value="${escAttr(m.nom)}" oninput="editSet('${key}','nom',this.value)">
            <textarea class="pl-ein pl-edesc" rows="2" oninput="editSet('${key}','desc',this.value)">${esc(m.desc)}</textarea>
          </div>
        </div>`;
      }
      var meta = (m._tag?`<span>📋 ${esc(m._tag)}</span>`:'')+(m.lieu?`<span>📍 ${esc(m.lieu)}</span>`:'')+(m.energie?`<span>⚡ ${esc(m.energie)}</span>`:'')+((m.materiel||[]).length?`<span>🎒 ${esc((m.materiel||[]).join(', '))}</span>`:'');
      return `<div class="pl-block pl-click${tint}" data-hk="${key}"${bstyle} role="button" tabindex="0" onclick="openBlock(${flatIndex})" onkeydown="if(event.key==='Enter')openBlock(${flatIndex})">
        <div class="h">${esc(m._hdr)}</div>
        <div><div class="n">${esc(m.nom)} <span class="pl-more">${l.details} ›</span></div><div class="d">${esc(m.desc)}</div>
        <div class="pl-meta">${meta}</div></div>
      </div>`;
    }

    // ---------- Camp ----------
    function renderCamp(){
      var l=L(), lang=ZTS.getLang(), out=document.getElementById('plOut');
      // chips de groupe d'âge dans la barre de filtres
      document.getElementById('plFilters').innerHTML = CAMP_AGES.map(a=>`<button class="pl-chip${state.campAge===a?' active':''}" onclick="state.campAge='${a}';plRender()">👥 ${a} ${lang==='fr'?'ans':'yrs'}</button>`).join('');
      getJSON('data/camp.json').then(weeks=>{
        var w=weeks.find(x=>x.semaine===state.campWeek)||weeks[0]; var g=w.groupes[state.campAge];
        document.getElementById('plCount').textContent=`${l.wk} ${w.semaine} · ${w.theme} · ${state.campAge} ${lang==='fr'?'ans':'yrs'}`;
        out.className='';
        var ctx='c|'+w.semaine+'|'+state.campAge;
        var base=g.blocs.map(b=>Object.assign({},b,{_hdr:b.heure}));
        var grp=groupHTML(ctx, base, 0);
        PL_BLOCKS=grp.blocks;
        out.innerHTML= grp.html +
          `<div class="pl-block" style="margin-top:var(--space-3);grid-template-columns:1fr;"><div><div class="n">${l.planB}</div><div class="d">${w.plan_b_meteo}</div></div></div>`;
      });
    }

    // ---------- SDG ----------
    function renderSDG(){
      var l=L(), out=document.getElementById('plOut'); document.getElementById('plFilters').innerHTML='';
      getJSON('data/sdg.json').then(days=>{
        var d=days.find(x=>x.semaine===state.sdgWeek && x.jourSem===state.sdgJourSem)||days[0];
        document.getElementById('plCount').textContent=`${d.label}${d.theme?' · '+d.theme:''}`;
        out.className='';
        var ctx='s|'+d.jour, lang=ZTS.getLang();
        var HM=['7 h 00','7 h 25','7 h 50','8 h 20','8 h 45'], HA=['15 h 00','15 h 30','16 h 15','17 h 00','17 h 30'];
        var mbase=d.blocs.matin.items.map((b,i)=>Object.assign({},b,{_hdr:HM[i]||'', _tag:b.type.replace('_',' ')}));
        var abase=d.blocs.aprem.items.map((b,i)=>Object.assign({},b,{_hdr:HA[i]||'', _tag:b.type.replace('_',' ')}));
        var mctx=ctx+'|m', actx=ctx+'|a';
        function plageHead(sec, basep){
          var pk=ctx+'|plage|'+sec, pv=(EDITS[pk]&&EDITS[pk].heure!=null)?EDITS[pk].heure:basep, ic=sec==='m'?'🌅':'🌆', lab=sec==='m'?(lang==='fr'?'Matin':'Morning'):(lang==='fr'?'Après-midi':'Afternoon');
          if(editMode) return `<div class="pl-platge" style="margin:var(--space-4) 0 var(--space-2);"><b style="font-family:var(--font-impact);font-size:var(--fs-3);">${ic} ${lab}</b><input value="${escAttr(pv)}" oninput="editSet('${pk}','heure',this.value)"></div>`;
          return `<h3 style="font-family:var(--font-impact);font-size:var(--fs-3);margin:var(--space-4) 0 var(--space-2);">${ic} ${lab} · ${esc(pv)}</h3>`;
        }
        var gm=groupHTML(mctx, mbase, 0);
        var ga=groupHTML(actx, abase, gm.count);
        PL_BLOCKS = gm.blocks.concat(ga.blocks);
        out.innerHTML =
          plageHead('m', d.blocs.matin.plage) + gm.html +
          plageHead('a', d.blocs.aprem.plage) + ga.html;
      });
    }

    document.addEventListener('zts:ready', function(){
      plStatic();
      try{ var m=new URLSearchParams(location.search).get('metier'); if(['ep','sdg','camp'].indexOf(m)>=0) plPick(m); }catch(e){}
    });
    document.addEventListener('zts:langchange', function(){ plStatic(); if(state.metier){ renderInfo(); buildLevels(); plRender(); } });
  </script>
</body>
</html>
