  <style>
    .ol-bar { display:flex; flex-wrap:wrap; gap:var(--space-3); align-items:center; margin-bottom:var(--space-4); }
    .ol-field { font-family:var(--font-body); font-weight:700; font-size:var(--fs-2);
      padding:10px 14px; border:var(--bord); border-radius:var(--r-2); box-shadow:var(--ombre); background:#fff; min-width:160px; }
    .ol-btn { font-family:var(--font-impact); font-size:var(--fs-2); cursor:pointer;
      padding:10px 20px; border:var(--bord); border-radius:var(--r-pill); background:var(--metier); color:var(--ink); box-shadow:var(--ombre); }
    .ol-btn--ghost { background:#fff; }
    .ol-btn:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--zts-noir); }
    .ol-list { display:grid; gap:var(--space-3); }
    .ol-team { display:grid; grid-template-columns:auto 1fr auto auto; gap:var(--space-3); align-items:center;
      border:var(--bord); border-radius:var(--r-2); box-shadow:var(--ombre); background:#fff; padding:var(--space-3) var(--space-4);
      border-left:14px solid var(--c,#19B5C9); }
    .ol-rank { font-family:var(--font-impact); font-size:var(--fs-4); min-width:1.6em; text-align:center; }
    .ol-name { font-family:var(--font-body); font-weight:700; font-size:var(--fs-2); border:2px solid transparent;
      border-radius:8px; padding:4px 8px; background:transparent; width:100%; max-width:260px; }
    .ol-name:focus { border-color:var(--zts-noir); background:#fff; outline:none; }
    .ol-score { font-family:var(--font-impact); font-size:clamp(28px,8vw,44px); min-width:1.8em; text-align:center; }
    .ol-pts { display:flex; gap:6px; flex-wrap:wrap; }
    .ol-pt { font-family:var(--font-fun); font-weight:700; font-size:var(--fs-1); cursor:pointer;
      padding:6px 10px; border:2px solid var(--zts-noir); border-radius:var(--r-pill); background:#fff; box-shadow:2px 2px 0 var(--zts-noir); }
    .ol-del { cursor:pointer; border:0; background:transparent; font-size:var(--fs-2); }
    .ol-podium { font-family:var(--font-impact); font-size:var(--fs-3); text-align:center; margin:var(--space-4) 0 0; min-height:1.4em; }
    @media print { [data-zts-header],[data-zts-footer],.zts-subnav,.ol-bar,.ol-pts,.ol-del{ display:none !important; } }
  </style>

  <!-- ZTS-JSONLD -->

{
  "@context": "https://schema.org",
  "@type": "WebApplication",

<body data-metier="camp">

  <div data-zts-header></div>
  <div class="ztsh-page">

  <nav class="zts-subnav">
    <a href="../../camps-de-jour.html" data-i18n="subnav.back_metier">← Camps de jour</a>
    <a href="../../index.html" data-i18n="subnav.back_home">← Accueil</a>
  </nav>

  <main class="zts-container" style="padding-top:var(--space-4); padding-bottom:var(--space-7); max-width:820px;">
    <section class="zts-metier-banner" style="margin-bottom:var(--space-5);">
      <div>
        <span class="zts-metier-banner__pill" id="olPill">Olympiades</span>
        <h1 style="margin-top:10px;" id="olTitle">🏅 Olympiades & tournois</h1>
        <p style="margin-top:8px; font-family:var(--font-body); font-size:var(--fs-2); max-width:60ch;" id="olIntro"></p>
      </div>
    </section>

    <div class="ol-bar">
      <input class="ol-field" id="olNew" maxlength="24">
      <button class="ol-btn" id="olAdd" onclick="olAdd()"></button>
      <button class="ol-btn ol-btn--ghost" id="olReset" onclick="olReset()"></button>
      <button class="ol-btn ol-btn--ghost" id="olPrint" onclick="window.print()"></button>
    </div>

    <div class="ol-list" id="olList"></div>
    <p class="ol-podium" id="olPodium"></p>
  </main>

  <div data-zts-footer></div>

  <script src="../../shared/zts.js"></script>
  <script src="../../shared/zts-gate.js"></script>
  <script>
    const COLORS=['#19B5C9','#FFD23F','#FF8A3D','#8BD450','#B57BFF','#FF6FA3','#4FC3F7','#E63329'];
    const LBL = {
      fr:{ pill:'Olympiades', title:'🏅 Olympiades & tournois', intro:'Ajoute tes équipes, attribue des points à chaque épreuve et suis le classement en direct.',
        defTeams:['Rouges','Bleus','Verts','Jaunes'], placeholder:'Nom de l\'équipe…',
        add:'➕ Ajouter', reset:'↺ Tout remettre à zéro', print:'🖨️ Imprimer',
        confirm:'Remettre tous les pointages à zéro?', winner:t=>`🏆 ${t} en tête!`, tie:'🤝 Égalité en tête!', empty:'Ajoute des équipes pour commencer.' },
      en:{ pill:'Olympics', title:'🏅 Olympics & tournaments', intro:'Add your teams, award points for each event and track the standings live.',
        defTeams:['Reds','Blues','Greens','Yellows'], placeholder:'Team name…',
        add:'➕ Add', reset:'↺ Reset all', print:'🖨️ Print',
        confirm:'Reset all scores to zero?', winner:t=>`🏆 ${t} in the lead!`, tie:'🤝 Tied for the lead!', empty:'Add teams to get started.' }
    };
    let teams=[]; let seeded=false;

    function L(){ return LBL[ZTS.getLang()]; }
    function olStatic(){
      const l=L();
      document.getElementById('olPill').textContent=l.pill;
      document.getElementById('olTitle').textContent=l.title;
      document.getElementById('olIntro').textContent=l.intro;
      document.getElementById('olNew').placeholder=l.placeholder;
      document.getElementById('olAdd').textContent=l.add;
      document.getElementById('olReset').textContent=l.reset;
      document.getElementById('olPrint').textContent=l.print;
    }
    function olAdd(){
      const inp=document.getElementById('olNew');
      const name=(inp.value||'').trim();
      if(!name) return;
      teams.push({id:'t'+(Date.now()+Math.floor(Math.random()*1000)), name, score:0});
      inp.value=''; olRender();
    }
    function olReset(){ if(confirm(L().confirm)){ teams.forEach(t=>t.score=0); olRender(); } }
    function olPts(id,d){ const t=teams.find(x=>x.id===id); if(t){ t.score=Math.max(0,t.score+d); olRender(); } }
    function olName(id,v){ const t=teams.find(x=>x.id===id); if(t) t.name=v; olPodiumOnly(); }
    function olDel(id){ teams=teams.filter(x=>x.id!==id); olRender(); }
    function olPodiumOnly(){
      const l=L(); const el=document.getElementById('olPodium');
      if(!teams.length){ el.textContent=l.empty; return; }
      const max=Math.max(...teams.map(t=>t.score));
      if(max===0){ el.textContent=''; return; }
      const leaders=teams.filter(t=>t.score===max);
      el.textContent = leaders.length>1 ? l.tie : l.winner(leaders[0].name);
    }
    function olRender(){
      const sorted=teams.map((t,i)=>({t,i})).sort((a,b)=> b.t.score-a.t.score || a.i-b.i );
      const medals=['🥇','🥈','🥉'];
      document.getElementById('olList').innerHTML=sorted.map((o,pos)=>{
        const t=o.t, c=COLORS[teams.indexOf(t)%COLORS.length];
        const rank=(t.score>0)?(medals[pos]||(pos+1)):'–';
        return `<div class="ol-team" style="--c:${c}">
          <span class="ol-rank">${rank}</span>
          <input class="ol-name" value="${t.name.replace(/"/g,'&quot;')}" oninput="olName('${t.id}',this.value)">
          <span class="ol-score">${t.score}</span>
          <div>
            <div class="ol-pts">
              <button class="ol-pt" onclick="olPts('${t.id}',1)">+1</button>
              <button class="ol-pt" onclick="olPts('${t.id}',3)">+3</button>
              <button class="ol-pt" onclick="olPts('${t.id}',5)">+5</button>
              <button class="ol-pt" onclick="olPts('${t.id}',-1)">−1</button>
              <button class="ol-del" title="✕" onclick="olDel('${t.id}')">🗑️</button>
            </div>
          </div>
        </div>`;
      }).join('');
      olPodiumOnly();
    }
    window.olAdd=olAdd; window.olReset=olReset; window.olPts=olPts; window.olName=olName; window.olDel=olDel;
    function olInit(){
      olStatic();
      if(!seeded){ teams=L().defTeams.map((n,i)=>({id:'t'+i, name:n, score:0})); seeded=true; }
      olRender();
      document.getElementById('olNew').addEventListener('keydown',e=>{ if(e.key==='Enter') olAdd(); });
    }
    document.addEventListener('zts:ready', olInit);
    document.addEventListener('zts:langchange', ()=>{ olStatic(); olPodiumOnly(); }); // garde les équipes/pointages
  </script>
  </div><!-- /.ztsh-page -->

  <script src="../../assets/ztsh-shell.js"></script>
  <script>ZTSShell.monter({ densite: 'travail' });</script>
</body>
</html>
