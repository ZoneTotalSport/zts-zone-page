<!-- APP RETIRÉE le 2 septembre 2026 (chantier SITE IMPECCABLE, vague 1).
     `apps/bricolages/` est tuée : voir CATALOGUE-CIBLE.md §2.6. Elle ne fait
     pas partie des 18 piliers et n'est absorbée par aucun d'eux — ses huit

     POURQUOI CE FICHIER EXISTE PLUTÔT QUE RIEN. L'app avait un lien entrant
     (service-de-garde.html) et une entrée au sitemap : l'URL est connue des
     moteurs. Règle d'or n°3 du projet : toute ancienne URL = redirection 301,
     jamais 404. La 301 ne peut pas être posée tant que `zonetotalsport.ca`
     est en DNS only, sans proxy Cloudflare — et GitHub Pages ne sait pas
     répondre 301. On fait donc ce qui s'en approche le plus, comme pour les
     cinq pages sportives d'août : `canonical` vers la destination pour
     transmettre le signal aux moteurs, `noindex` pour sortir de l'index,
     rafraîchissement immédiat pour le visiteur.

     DESTINATION : le hub Service de garde, qui porte l'offre dont les
     bricolages faisaient partie.

     SUPPRESSION RÉELLE : au chantier proxy orange, avec les autres pages
     retirées. Voir REDIRECTIONS-CLOUDFLARE.md. -->
