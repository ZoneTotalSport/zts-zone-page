<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planification de la semaine — Zone Total Sport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--jaune:#F2FF00;--jaune-d:#D9E600;--cyan:#19C3FF;--vert:#4ED11A;--orange:#FF7A00;--rose:#FF2D7E;
  --gris:#E2E6EC;--gris-d:#AEB7C2;--gris-dd:#8A95A3;--ink:#0a0a0a;--bord:5px solid var(--ink)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;color:var(--ink);min-height:100vh;padding:24px;
  --bg-base:var(--cyan);--bg-stripe:var(--jaune);
  background:var(--bg-base);
  background-image:repeating-conic-gradient(from 0deg at 88% 96%,var(--bg-stripe) 0deg 7deg,transparent 7deg 14deg);background-attachment:fixed}
/* Par métier : on reteinte --cyan (ex-bleu, = base/fond) et --jaune (ex-jaune, = rayures/accents) → tout l'UI suit */
body[data-metier="camp"]{--cyan:#ff6a00;--jaune:#c026ff;--jaune-d:#a300e6}  /* Camps : orange fluo + mauve fluo */
body[data-metier="sdg"]{--cyan:#39ff14;--jaune:#ff2dac;--jaune-d:#e0008f}   /* SDG : vert fluo + rose fluo */
.sheet{max-width:1500px;margin:0 auto;background:#fff;border:var(--bord);border-radius:38px;box-shadow:14px 14px 0 rgba(0,0,0,.85);padding:clamp(16px,2.5vw,34px);position:relative}
.sheet-mascotte{position:absolute;top:8px;left:16px;width:clamp(80px,9vw,140px);aspect-ratio:3/4;background-size:contain;background-repeat:no-repeat;background-position:top center;pointer-events:none;z-index:5}
body[data-metier="ep"] .sheet-mascotte{background-image:url('img/mascotte-ep.png')}
body[data-metier="camp"] .sheet-mascotte{background-image:url('img/mascotte-camp.png')}
body[data-metier="sdg"] .sheet-mascotte{background-image:url('img/mascotte-sdg.png')}
@media(max-width:900px){.sheet-mascotte{display:none}}
.sheet__title{font-family:'Luckiest Guy',cursive;text-align:center;font-size:clamp(2.4rem,5.5vw,4rem);color:var(--jaune);-webkit-text-stroke:2px var(--ink);letter-spacing:1px;margin:0 0 4px}
.sheet__week{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sheet__week label{font-family:'Bangers',cursive;color:var(--cyan);-webkit-text-stroke:1px var(--ink);font-size:clamp(1.1rem,2.5vw,1.7rem)}
.sheet__week input{font-family:'Fredoka';font-weight:700;font-size:1.1rem;padding:8px 14px;border:var(--bord);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.metier-sw{display:flex;border:var(--bord);border-radius:16px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.metier-sw button{font-family:'Bangers',cursive;cursor:pointer;font-size:1.25rem;letter-spacing:.5px;color:var(--ink);border:none;border-right:3px solid var(--ink);background:#fff;padding:13px 20px}
.metier-sw button:last-child{border-right:none}
.metier-sw button.on{background:var(--jaune)}
.btn{font-family:'Bangers',cursive;font-size:1.3rem;letter-spacing:.5px;cursor:pointer;color:var(--ink);padding:13px 24px;border:var(--bord);border-radius:16px;box-shadow:5px 5px 0 var(--ink);background:var(--gris);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink);background:#eef1f5}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn--print{background:var(--gris-dd);color:#fff}
.btn--big{background:var(--vert);color:#fff;font-size:1.2rem;padding:14px 28px}
.stepper{display:flex;align-items:center;gap:8px;font-family:'Bangers',cursive;font-size:1.25rem;letter-spacing:.5px;background:var(--gris);border:var(--bord);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:8px 14px}
.stepper b{min-width:28px;text-align:center;font-size:1.6rem;color:var(--cyan);-webkit-text-stroke:.5px var(--ink)}
.stepper button{font-family:'Bangers',cursive;cursor:pointer;width:42px;height:42px;border:3px solid var(--ink);border-radius:10px;background:#fff;box-shadow:2px 2px 0 var(--ink);font-size:1.5rem}
.stepper button:hover{background:var(--jaune)}

.grid{display:grid;gap:10px;align-items:stretch}
.rail{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;border:var(--bord);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:8px 6px;background:#fff}
.rail__lbl{font-family:'Bangers',cursive;font-size:clamp(1.1rem,1.7vw,1.5rem);color:var(--cyan);-webkit-text-stroke:.4px var(--ink);text-shadow:2px 2px 0 var(--ink);border:none;text-align:center;width:100%;background:transparent}
.rail.alt .rail__lbl{color:var(--jaune-d)}
.rail__hrs{display:flex;align-items:center;gap:3px;font-family:'Fredoka';font-weight:700;font-size:1rem;color:#555}
.rail__hrs input{width:56px;text-align:center;border:2px dashed #bbb;border-radius:8px;font-family:'Fredoka';font-weight:700;font-size:1rem;padding:4px}
.rail__ctrl{display:flex;gap:3px;margin-top:3px}
.rail__ctrl button{cursor:pointer;width:26px;height:26px;border:2px solid var(--ink);border-radius:8px;background:#fff;box-shadow:1px 1px 0 var(--ink);font-size:.8rem;display:flex;align-items:center;justify-content:center;padding:0}
.rail__ctrl button:hover{background:var(--jaune)}.rail__ctrl .del:hover{background:var(--rose);color:#fff}
.rail--break{grid-column:1 / -1;background:var(--jaune);border-radius:14px;flex-direction:row;gap:10px;flex-wrap:wrap}
.rail--break .rail__lbl{color:var(--ink);-webkit-text-stroke:0;text-shadow:none;font-size:clamp(1.4rem,2.4vw,2rem);width:auto}
.addbar{grid-column:1 / -1;display:flex;gap:12px;justify-content:center;padding:4px}
.addbar button{font-family:'Bangers',cursive;cursor:pointer;font-size:.95rem;border:var(--bord);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:8px 16px;background:#fff}
.addbar button:hover{background:var(--jaune);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}

.day-hd{border:var(--bord);border-radius:20px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;background:#fff}
.day-hd__name{font-family:'Luckiest Guy',cursive;text-align:center;font-size:clamp(1.5rem,2.8vw,2.2rem);letter-spacing:.5px;padding:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.day-hd__name input[type=checkbox]{width:22px;height:22px}
.day-hd__date{width:100%;text-align:center;font-family:'Bangers',cursive;font-size:clamp(1.4rem,2.8vw,2.2rem);letter-spacing:.5px;border:none;border-top:4px solid var(--ink);padding:10px 6px;background:#fff;color:var(--orange)}
.day-hd.j0 .day-hd__name,.day-hd.j2 .day-hd__name,.day-hd.j4 .day-hd__name{background:var(--jaune)}
.day-hd.j1 .day-hd__name,.day-hd.j3 .day-hd__name{background:var(--cyan);color:#fff}
.day-hd.j1 .day-hd__date,.day-hd.j3 .day-hd__date{color:var(--vert)}

.slot{border:var(--bord);border-radius:18px;box-shadow:5px 5px 0 var(--ink);background:#fff;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:120px;transition:transform .12s,box-shadow .12s,border-color .12s}
.slot:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink);border-color:var(--cyan)}
.slot--off{background:#f1f5f9;border-style:dashed}
.slot--off:hover{border-color:var(--gris-dd)}
.slot__row{display:flex;flex-direction:column;gap:2px}
.slot__lbl{font-family:'Bangers',cursive;color:var(--cyan);-webkit-text-stroke:.4px var(--ink);text-shadow:2px 2px 0 var(--ink);font-size:1.35rem;letter-spacing:.5px;white-space:nowrap}
.slot input.g{font-family:'Fredoka';font-weight:600;border:none;border-bottom:2px dashed #bbb;padding:3px 4px;font-size:1.3rem;width:100%}
.slot input:focus,.rail__lbl:focus,.rail__hrs input:focus{outline:2px solid var(--cyan);border-radius:6px;background:#fbfeff}
.acts__hd{display:flex;align-items:center;justify-content:space-between;gap:6px}
.act-pm{display:flex;gap:4px}
.act-pm button{font-family:'Bangers',cursive;cursor:pointer;width:34px;height:34px;border:3px solid var(--ink);border-radius:9px;background:var(--vert);color:#fff;box-shadow:2px 2px 0 var(--ink);font-size:1.3rem}
.act-pm button.minus{background:#fff;color:var(--ink)}
.act-pm button:hover{transform:translate(-1px,-1px)}
.acts__list{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.act-chip{display:flex;align-items:center;gap:6px;width:100%;text-align:left;cursor:pointer;font-family:'Fredoka';font-weight:700;font-size:1.18rem;
  background:#FFFCE0;border:3px solid var(--ink);border-radius:11px;box-shadow:3px 3px 0 var(--ink);padding:6px 9px;transition:transform .1s}
.act-chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:#fff7c2}
.act-chip .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-chip .dur{font-family:'Bangers',cursive;font-size:.95rem;color:var(--orange);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:1px 6px}
.act-chip.is-done{filter:grayscale(1);opacity:.7;background:#e9e9e9}
.act-chip .chk{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Bangers',cursive;font-size:1.25rem;color:#fff;border:2.5px solid var(--ink);border-radius:8px;background:#fff;box-shadow:1px 1px 0 var(--ink);transition:background .12s,transform .12s}
.act-chip .chk:hover{background:var(--vert);transform:scale(1.18)}
.act-chip.is-done .chk{background:var(--vert)}
.act-chip .fait{font-family:'Bangers',cursive;font-size:.95rem;color:#fff;background:var(--vert);border:2px solid var(--ink);border-radius:8px;padding:1px 7px}
.act-empty{font-family:'Fredoka';font-weight:600;font-size:1.05rem;opacity:.5}

/* Modal */
.modal{position:fixed;inset:0;z-index:1000;background:rgba(10,10,30,.82);display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal__box{background:#fff;border:var(--bord);border-radius:26px;box-shadow:12px 12px 0 rgba(0,0,0,.6);max-width:920px;width:100%;max-height:92vh;overflow:auto;padding:20px;position:relative}
.modal__x{position:absolute;top:12px;right:12px;font-family:'Bangers',cursive;font-size:1.1rem;cursor:pointer;background:var(--rose);color:#fff;border:3px solid var(--ink);border-radius:50%;width:46px;height:46px;box-shadow:3px 3px 0 var(--ink)}
.f-lbl{font-family:'Bangers',cursive;color:var(--cyan);-webkit-text-stroke:.4px var(--ink);font-size:1.05rem;margin:12px 0 4px;display:block}
.f-in,.f-ta{width:100%;font-family:'Fredoka';font-weight:600;font-size:1rem;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;box-shadow:3px 3px 0 var(--ink)}
.f-ta{min-height:80px;resize:vertical}
.f-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.medias{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.media-it{display:flex;align-items:center;gap:8px;background:#FFFCE0;border:2px solid var(--ink);border-radius:10px;padding:5px 9px;font-weight:700}
.media-it .rm{cursor:pointer;color:var(--rose);font-weight:900;margin-left:auto}
.modal__title{font-family:'Bangers',cursive;font-size:clamp(1.5rem,4vw,2.4rem);color:var(--cyan);-webkit-text-stroke:1px var(--ink);margin:6px 60px 10px 6px}
.v-desc{font-family:'Fredoka';font-weight:500;font-size:1.4rem;line-height:1.5;margin:0 0 14px;white-space:pre-wrap}
.v-media{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.v-media img{width:100%;border:4px solid var(--ink);border-radius:16px}
.v-media iframe,.v-media video{width:100%;border:4px solid var(--ink);border-radius:16px;background:#000}
.v-media iframe{height:min(64vh,560px)}
.v-media .lnk{font-family:'Bangers',cursive;font-size:1.1rem;background:var(--jaune);border:3px solid var(--ink);border-radius:14px;padding:12px 18px;box-shadow:4px 4px 0 var(--ink);text-decoration:none;color:var(--ink);display:inline-block}
/* Timer */
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:12px 18px;margin:8px 0 4px}
.timer__num{font-family:'Bangers',cursive;font-size:clamp(2.4rem,8vw,4rem);color:var(--ink);letter-spacing:2px;min-width:160px;text-align:center}
.timer.done .timer__num{color:var(--rose)}
.timer button{font-family:'Bangers',cursive;cursor:pointer;font-size:1rem;border:3px solid var(--ink);border-radius:12px;padding:10px 16px;box-shadow:3px 3px 0 var(--ink);background:var(--vert);color:#fff}
.timer button.sec{background:#fff;color:var(--ink)}
.timer__done{font-family:'Bangers',cursive;font-size:1.4rem;color:var(--rose);-webkit-text-stroke:.5px var(--ink)}

/* Sélecteur banque */
.bq-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.bq-grp{font-family:'Bangers',cursive;color:var(--cyan);-webkit-text-stroke:.3px var(--ink);font-size:.85rem;margin-left:6px}
.bq-grp:first-child{margin-left:0}
.bq-chip{font-family:'Fredoka';font-weight:700;font-size:.85rem;cursor:pointer;border:2.5px solid var(--ink);border-radius:11px;background:#fff;box-shadow:2px 2px 0 var(--ink);padding:4px 10px;transition:transform .1s,background .1s}
.bq-chip:hover{transform:translate(-1px,-1px);background:#FFFCE0}
.bq-chip.on{background:var(--jaune)}
.bq-count{font-family:'Bangers',cursive;color:var(--orange);font-size:.95rem;margin:6px 0}
.bq-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:2px}
.bq-it{display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;background:#FFFCE0;border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:9px 12px;transition:transform .1s,box-shadow .1s}
.bq-it:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);background:#fff7c2}
.bq-it__top{display:flex;align-items:center;gap:8px}
.bq-it__t{flex:1;font-family:'Bangers',cursive;font-size:1rem;color:var(--ink)}
.bq-it__desc{font-family:'Fredoka';font-weight:500;font-size:.9rem;color:#333;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bq-it__tags{font-family:'Fredoka';font-weight:600;font-size:.78rem;color:var(--gris-dd)}
.bq-back{font-family:'Bangers',cursive;cursor:pointer;font-size:.9rem;border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:7px 14px;background:var(--gris)}
.act-chip .lien{flex:none;font-size:.85rem}
@media (max-width:760px){body{padding:10px}}
@page{size:landscape;margin:7mm}
@media print{
  body{background:#fff!important;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar,.rail__ctrl,.addbar,.act-pm,.modal,.act-chip .rm,.act-chip .chk,.sheet-mascotte{display:none!important}
  .act-empty{display:none!important}
  .sheet{box-shadow:none;border-width:3px;border-radius:16px;padding:6px;max-width:100%}
  .sheet__title{font-size:1.7rem;margin:0 0 2px}
  .sheet__week{margin:0 0 6px}.sheet__week label{font-size:1rem}.sheet__week input{padding:3px 8px;font-size:.9rem;box-shadow:none}
  .grid{gap:5px}
  .day-hd{box-shadow:2px 2px 0 var(--ink)!important}
  .day-hd__name{font-size:1.05rem;padding:4px}.day-hd__name input[type=checkbox]{width:16px;height:16px}
  .day-hd__date{font-size:1rem;padding:4px;border-top-width:3px}
  .rail{box-shadow:2px 2px 0 var(--ink)!important;padding:5px 4px}
  .rail__lbl{font-size:.95rem}
  .rail--break .rail__lbl{font-size:1.1rem}
  .rail__hrs{font-size:.78rem}.rail__hrs input{border:1px solid #bbb;width:46px;font-size:.78rem;padding:2px}
  .slot{box-shadow:2px 2px 0 var(--ink)!important;min-height:0;padding:5px;gap:3px}
  .slot__lbl{font-size:.85rem}
  .slot input.g{font-size:.9rem}
  .act-chip{font-size:.85rem;box-shadow:1px 1px 0 var(--ink)!important;padding:4px 7px}
  .act-chip .dur,.act-chip .fait{font-size:.7rem}
  .act-chip.is-done{filter:none;opacity:1;background:#eee}
}
</style>
</head>
<body>
<div class="sheet">
  <div class="sheet-mascotte" aria-hidden="true"></div>
  <h1 class="sheet__title">Planification de la semaine</h1>
  <div class="sheet__week"><label>Semaine du :</label><input type="date" id="weekStart"></div>
  <div class="toolbar">
    <div class="metier-sw"><button data-metier="ep"><span class="m-emo">🏫</span> <span class="m-lbl">ÉP</span></button><button data-metier="camp"><span class="m-emo">⛺</span> <span class="m-lbl">Camp</span></button><button data-metier="sdg"><span class="m-emo">🧸</span> <span class="m-lbl">SDG</span></button></div>
    <button class="btn" id="langBtn">EN</button>
    <div class="stepper"><span id="lblPeriods">Périodes</span> <button data-step="-1">−</button><b id="pcount">6</b><button data-step="1">＋</button></div>
    <button class="btn" id="toggleDays">5 ↔ 3 jours</button>
    <button class="btn btn--print" id="btnPrint" onclick="window.print()">🖨️ Enregistrer PDF</button>
    <button class="btn" id="reset">↺ Vider la semaine</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal"><div class="modal__box"><button class="modal__x" id="modalX">✕</button><div id="modalBody"></div></div></div>

// Migration : ancien titre/médias uniques → 1 activité dans la liste
function migrate(){
  structure.forEach(ln=>{ if(ln.type!=='period')return; [0,1,2,3,4].forEach(di=>{
    const ak=ln.id+'_acts_'+di; if(data[ak])return;
    const ti=data[ln.id+'_a_'+di], lk=data[ln.id+'_lk_'+di], at=data[ln.id+'_att_'+di];
    if(ti||lk||(at&&at.length)){ const m=[]; (at||[]).forEach(a=>m.push({kind:mediaKindOf(a.type),name:a.name,data:a.data}));
      if(lk) m.push({kind:'link',url:lk}); data[ak]=[{id:newId(),titre:ti||t('game'),desc:'',duree:'',medias:m}]; }
  });});
}

function dureeFromPlage(p){ if(!p)return''; const t=[...p.matchAll(/(\d+)\s*h\s*(\d+)?/g)].map(m=>(+m[1])*60+(+(m[2]||0))); if(t.length<2)return''; const d=t[1]-t[0]; return d>0?String(d):''; }
async function loadBanque(){ if(BANQUE)return BANQUE;
  try{ const r=await fetch('../planification/data/camp.json'); const weeks=await r.json(); const out=[];
    weeks.forEach(w=>{ Object.entries(w.groupes||{}).forEach(([g,gd])=>{ (gd.blocs||[]).forEach((b,i)=>{
      out.push({ id:'camp-w'+w.semaine+'-'+g+'-'+i, titre:b.nom||'Activité', desc:b.desc||'', but:b.but||'',
        deroulement:b.deroulement||[], variantes:b.variantes||[], astuce:b.astuce||'', materiel:b.materiel||[],
        lieu:b.lieu||'', energie:b.energie||'', groupe:g, semaine:w.semaine, theme:w.theme||'', duree:dureeFromPlage(b.plage) });
    }); }); });
    BANQUE=out;
  }catch(e){ BANQUE=[]; }
  return BANQUE;
}
function banqueFiltered(){ const q=banqueState.q.toLowerCase().trim();
  return BANQUE.filter(f=>(!banqueState.groupe||f.groupe===banqueState.groupe)&&(!banqueState.energie||f.energie===banqueState.energie)

function bqChip(group,val,lbl){ return `<button class="bq-chip ${banqueState[group]===val?'on':''}" data-bq="${group}" data-val="${val}">${lbl}</button>`; }
function refreshBqList(){ const list=banqueFiltered(); const c=modalBody.querySelector('.bq-count'); const l=modalBody.querySelector('.bq-list');
  if(c)c.textContent=list.length+' '+t('games'); if(l)l.innerHTML=list.length?list.map(bqItemHTML).join(''):`<div class="act-empty" style="padding:20px">${t('noResult')}</div>`; }
function renderBanque(){ const list=banqueFiltered();
  modalBody.innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin:6px 60px 12px 6px"><button class="bq-back" data-bqback="1">←</button><h2 class="modal__title" style="margin:0;font-size:clamp(1.3rem,3.5vw,2rem)">${t('campLib')}</h2></div>
    <input class="f-in" id="bqQ" placeholder="${t('searchPh')}" value="${esc(banqueState.q)}" style="margin-bottom:10px">
    <div class="bq-filters"><span class="bq-grp">${t('age')}</span>${['5-7','8-10','11-12'].map(g=>bqChip('groupe',g,g+' '+t('yrs'))).join('')}
      <span class="bq-grp">${t('energy')}</span>${ENERGIES.map(k=>bqChip('energie',k,energyLbl(k))).join('')}
      <span class="bq-grp">${t('place')}</span>${LIEUX.map(k=>bqChip('lieu',k,lieuLbl(k))).join('')}</div>

  const q=modalBody.querySelector('#bqQ'); q.addEventListener('input',e=>{ banqueState.q=e.target.value; refreshBqList(); });

async function openBanque(){ openModal(); modalBody.innerHTML=`<div class="act-empty" style="padding:24px">${t('loadingLib')}</div>`; await loadBanque(); renderBanque(); }
function pickFiche(id){ const f=(BANQUE||[]).find(x=>x.id===id); if(!f)return;
  let desc=f.desc||'';
  if(f.but) desc+=(desc?'\n\n':'')+t('goal')+f.but;
  if(f.deroulement&&f.deroulement.length) desc+='\n\n'+t('steps')+'\n• '+f.deroulement.join('\n• ');
  if(f.materiel&&f.materiel.length) desc+='\n\n'+t('equip')+f.materiel.join(', ');
  if(f.astuce) desc+='\n\n'+t('tip')+f.astuce;
  openEdit(editCtx.id,editCtx.di,{titre:f.titre,desc,duree:f.duree,ref:{source:'camp',id:f.id}});
}
// délégation pour la banque (modalBody persiste, on attache une fois)
modalBody.addEventListener('click',e=>{

function openModal(){ modal.classList.add('open'); }
function closeModal(){ modal.classList.remove('open'); modalBody.innerHTML=''; if(timerInt){clearInterval(timerInt);timerInt=null;} }
document.getElementById('modalX').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

function openEdit(id,di,prefill){
  editCtx={id,di}; editMedias=[]; editRef=prefill?.ref||null;
  modalBody.innerHTML=`
    <button class="btn" id="fBanque" style="background:var(--cyan);color:#fff;width:100%;margin:2px 0 4px;font-size:1.05rem">${t('chooseLib')}</button>
    ${editRef?`<div class="media-it" style="background:#e6f7ff">${t('linkedLib')} <span class="rm" id="fUnref">✕</span></div>`:''}
    <label class="f-lbl">${t('fTitle')}</label><input class="f-in" id="fTitre" placeholder="${t('fTitlePh')}">
    <label class="f-lbl">${t('fDesc')}</label><textarea class="f-ta" id="fDesc" placeholder="${t('fDescPh')}"></textarea>
    <label class="f-lbl">${t('fDur')}</label><input class="f-in" id="fDuree" type="number" min="1" placeholder="${t('fDurPh')}" style="max-width:160px">
    <label class="f-lbl">${t('fMedia')}</label>
    <div class="f-row"><label class="btn"><input type="file" id="fFile" accept="image/png,image/jpeg,application/pdf,audio/mpeg,audio/mp3,video/mp4" multiple hidden>${t('importFile')}</label></div>
    <label class="f-lbl">${t('fLink')}</label>
    <div class="f-row"><input class="f-in" id="fLink" placeholder="https://youtube.com/…" style="flex:1"><button class="btn" id="fAddLink">${t('addLink')}</button></div>
    <div class="medias" id="fMedias"></div>
    <div style="text-align:center;margin-top:18px"><button class="btn btn--big" id="fAdd">${t('addBtn')}</button></div>`;
  document.getElementById('fFile').addEventListener('change',e=>{ for(const f of e.target.files){ if(f.size>MAX_FILE){alert(t('tooHeavyA')+f.name+t('tooHeavyB'));continue;} const rd=new FileReader(); rd.onload=()=>{ editMedias.push({kind:mediaKindOf(f.type),name:f.name,data:rd.result}); renderMedias(); }; rd.readAsDataURL(f); } e.target.value=''; });
  document.getElementById('fAddLink').addEventListener('click',()=>{ const v=document.getElementById('fLink').value.trim(); if(v){ editMedias.push({kind:'link',url:v}); document.getElementById('fLink').value=''; renderMedias(); } });
  document.getElementById('fAdd').addEventListener('click',saveAct);

function renderMedias(){ const box=document.getElementById('fMedias'); if(!box)return;
  box.innerHTML=editMedias.map((m,i)=>`<div class="media-it">${m.kind==='link'?'🔗':m.kind==='pdf'?'📄':m.kind==='audio'?'🎵':m.kind==='video'?'🎬':'🖼️'} ${esc(m.name||m.url)} <span class="rm" data-mrm="${i}">✕</span></div>`).join('');

function saveAct(){

function ytEmbed(u){ const m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{6,})/); return m?'https://www.youtube.com/embed/'+m[1]:null; }
function mediaView(m){
  if(m.kind==='img') return `<img src="${m.data}" alt="${esc(m.name)}">`;
  if(m.kind==='pdf') return `<iframe src="${m.data}"></iframe>`;
  if(m.kind==='audio') return `<audio src="${m.data}" controls style="width:100%"></audio>`;
  if(m.kind==='video') return `<video src="${m.data}" controls></video>`;
  const yt=ytEmbed(m.url||''); if(yt) return `<iframe src="${yt}" allowfullscreen></iframe>`;
  if(/\.(mp4|webm)$/i.test(m.url)) return `<video src="${esc(m.url)}" controls></video>`;
  if(/\.(mp3|wav|m4a)$/i.test(m.url)) return `<audio src="${esc(m.url)}" controls style="width:100%"></audio>`;
  return `<a class="lnk" href="${esc(m.url)}" target="_blank" rel="noopener">${t('openLink')}</a>`;
}
// Buzzer de basket : bourdonnement grave et puissant ~1,8 s
function buzzer(){ try{ const c=new(window.AudioContext||window.webkitAudioContext)(); const D=1.8;
  [110,165].forEach(f=>{ const o=c.createOscillator(),g=c.createGain(); o.type='square'; o.frequency.value=f; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(.4,c.currentTime+.03); g.gain.setValueAtTime(.4,c.currentTime+D-.15); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+D);
    o.start(); o.stop(c.currentTime+D); }); }catch(e){} }
function openView(id,di,actId){
  const a=acts(id,di).find(x=>x.id===actId); if(!a)return;
  const dur=parseInt(a.duree)||0;
  let html=`<h2 class="modal__title">${esc(a.titre)}</h2>`;
  if(a.desc) html+=`<p class="v-desc">${esc(a.desc)}</p>`;
  if(dur>0) html+=`<div class="timer" id="vTimer"><div class="timer__num" id="vNum">${String(dur).padStart(2,'0')}:00</div>
    <button id="vStart">${t('start')}</button><button class="sec" id="vReset">↺</button><span class="timer__done" id="vDone" style="display:none">${t('gameOver')}</span></div>`;
  if(a.medias&&a.medias.length) html+=`<div class="v-media">${a.medias.map(mediaView).join('')}</div>`;
  modalBody.innerHTML=html; openModal();
  if(dur>0){ let rem=dur*60, running=false;
    const num=document.getElementById('vNum'), done=document.getElementById('vDone'), tm=document.getElementById('vTimer'), st=document.getElementById('vStart');
    const fmt=()=>{ num.textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0'); };
    st.addEventListener('click',()=>{ if(running){ clearInterval(timerInt); running=false; st.textContent=t('resume'); return; }
      running=true; st.textContent=t('pauseBtn'); timerInt=setInterval(()=>{ rem--; fmt(); if(rem<=0){ clearInterval(timerInt); timerInt=null; running=false; tm.classList.add('done'); done.style.display='inline'; st.style.display='none'; buzzer(); a.done=true; save(); render(); } },1000); });
    document.getElementById('vReset').addEventListener('click',()=>{ if(timerInt){clearInterval(timerInt);timerInt=null;} rem=dur*60; running=false; tm.classList.remove('done'); done.style.display='none'; st.style.display='inline'; st.textContent=t('start'); fmt(); });
  }
}

  if(t.dataset.k){ data[t.dataset.k]=t.value; save(); }
  else if(t.dataset.date!=null){ data['date_'+t.dataset.date]=t.value; save(); }

  else if(t.dataset.h){ const r=structure.find(x=>x.id===t.dataset.row); if(r){r[t.dataset.h]=t.value;saveStruct();} }
});

grid.addEventListener('click',e=>{
  const dn=e.target.closest('[data-done]'); if(dn){ e.stopPropagation(); const [id,di,aid]=dn.dataset.done.split('|'); const a=(data[id+'_acts_'+di]||[]).find(x=>x.id===aid); if(a){ a.done=!a.done; save(); render(); } return; }
  const rm=e.target.closest('[data-delact]'); if(rm){ e.stopPropagation(); const [id,di,aid]=rm.dataset.delact.split('|'); const k=id+'_acts_'+di; data[k]=(data[k]||[]).filter(a=>a.id!==aid); save(); render(); return; }
  const op=e.target.closest('[data-open]'); if(op){ const [id,di,aid]=op.dataset.open.split('|'); openView(id,di,aid); return; }
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.more){ const [id,di]=b.dataset.more.split('|'); openEdit(id,di); }
  else if(b.dataset.less){ const [id,di]=b.dataset.less.split('|'); const k=id+'_acts_'+di; const arr=data[k]||[]; if(arr.length&&confirm(t('confRemoveLast'))){ arr.pop(); save(); render(); } }
  else if(b.dataset.up){ moveRow(b.dataset.up,-1); }
  else if(b.dataset.down){ moveRow(b.dataset.down,1); }
  else if(b.dataset.tog){ const r=structure.find(x=>x.id===b.dataset.tog); if(r){ r.type=r.type==='period'?'break':'period'; commit(); } }
  else if(b.dataset.del){ if(confirm(t('confDelRow'))){ structure=structure.filter(x=>x.id!==b.dataset.del); commit(); } }
  else if(b.dataset.add==='period'){ structure.push({id:newId(),label:'Période '+(nbPeriodes()+1),type:'period',h1:'',h2:''}); commit(); }
  else if(b.dataset.add==='pause'){ structure.push({id:newId(),label:'Pause',type:'break',h1:'',h2:''}); commit(); }
});
function moveRow(id,dir){ const i=structure.findIndex(x=>x.id===id),j=i+dir; if(i<0||j<0||j>=structure.length)return; [structure[i],structure[j]]=[structure[j],structure[i]]; commit(); }
function commit(){ saveStruct(); render(); }
document.querySelector('.stepper').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  if(+b.dataset.step>0){ structure.push({id:newId(),label:'Période '+(nbPeriodes()+1),type:'period',h1:'',h2:''}); commit(); }
  else { for(let i=structure.length-1;i>=0;i--){ if(structure[i].type==='period'){ structure.splice(i,1); break; } } commit(); } });
document.getElementById('toggleDays').addEventListener('click',()=>{ nbJours=nbJours===5?3:5; localStorage.setItem('semaine_nbjours',nbJours); render(); });
document.getElementById('reset').addEventListener('click',()=>{ if(confirm(t('confClear'))){ data={}; save(); render(); } });
document.getElementById('langBtn').addEventListener('click',()=>setLang(LANG==='fr'?'en':'fr'));
document.getElementById('weekStart').addEventListener('change',()=>{ load(); render(); });
function setMetier(m){ document.body.dataset.metier=m; localStorage.setItem('semaine_metier',m); document.querySelectorAll('.metier-sw button').forEach(b=>b.classList.toggle('on',b.dataset.metier===m)); }
document.querySelector('.metier-sw').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setMetier(b.dataset.metier); });

(function init(){ const ws=document.getElementById('weekStart'); const t=new Date(); const dow=(t.getDay()+6)%7; t.setDate(t.getDate()-dow);
  ws.value=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); setMetier(localStorage.getItem('semaine_metier')||'ep'); applyI18n(); load(); render(); })();
</script>
</body>
</html>
