<!DOCTYPE html>
<!-- `ztsp-decor` VA SUR <html>, PAS SUR <body> — les deux couches du décor sont
     en z-index négatif ; posées sur les pseudo-éléments d'un body qui porte un
     fond opaque, elles se résolvent dans le contexte d'empilement de la racine
     et passent derrière ce fond. Piège payé le 28 juillet, puis le 3 août.
     En mode intégré, `init()` (app.js) écrit `documentElement.style.background
     = 'transparent'` en style inline : il gagne sur cette classe, le hub garde
     son propre fond. Rien à ajouter pour ce cas. -->
<html class="ztsp-decor" lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Titre neutre : l'app sert les trois métiers. Le script de bas de page le
       précise selon `?metier=`. Celui-ci reste la valeur servie au robot
       d'indexation, qui n'exécute pas toujours le JS. -->
  <title>Planificateur — Zone Total Sport</title>
  <meta name="description" content="Planificateur quotidien pour l'education physique, le camp de jour et le service de garde. Annee, cycle, presences. Gratuit.">
  <link rel="icon" type="image/png" href="https://zonetotalsport.ca/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/zts.css">
  <link rel="stylesheet" href="../../shared/zts-modele.css">
  <style>
/* ═══ PLANIFICATEUR — styles app ═══ */

/* ── Thème par métier : paire d'accents + encre de contraste ──
   Pilotée par body[data-metier] (déjà posé par init via ?metier=).
   TOUT accent de l'app passe par --metier-1/--metier-2 — plus d'orange dur. */
body[data-metier="camp"]{ --metier-1:#FF6B00; --metier-2:#B026FF; --metier-ink:#fff; }
body[data-metier="ep"]  { --metier-1:#00E5FF; --metier-2:#1E90FF; --metier-ink:#111; }
body[data-metier="sdg"] { --metier-1:#39FF14; --metier-2:#169B62; --metier-ink:#111; }
/* Variante métier du bouton standard (scopée app — les --camps/--eps/--sdg de zts.css restent fixes) */
.zts-action--metier{ background:var(--metier-1); color:var(--metier-ink); }

/* Mode intégré (iframe dans un hub) : on cache le header/subnav/perso du planificateur */
body.zts-embed [data-zts-header], body.zts-embed .zts-subnav, body.zts-embed .p-perso, body.zts-embed [data-zts-footer], body.zts-embed .zts-footer { display:none !important; }
body.zts-embed { padding-top:6px !important; background:transparent !important; }
html:has(body.zts-embed) { background:transparent !important; }   /* html a un fond paper → transparent en intégré */
body.zts-embed[data-metier]{ background-image:none !important; }
/* Cache le fond gymnase PROPRE au planificateur en mode intégré → un seul fond (celui du hub) */
body.zts-embed::before, body.zts-embed::after, body.zts-embed[data-metier]::before, body.zts-embed[data-metier]::after { display:none !important; background:none !important; }
/* Intégré : le contenu remplit toute la largeur (le calendrier s'adapte à l'écran : ordi/tablette/iPhone) */
body.zts-embed main.zts-container { max-width:none !important; padding-left:clamp(4px,1vw,14px) !important; padding-right:clamp(4px,1vw,14px) !important; }
/* Cases du calendrier : remplissent la largeur, hauteur raisonnable et fluide (pas de carrés géants) */
body.zts-embed .p-cal-day { aspect-ratio:auto; min-height:clamp(52px,6vw,96px); padding:clamp(6px,1.2vw,16px) 4px; }
/* Fond blanc retiré → le gymnase transparaît ; numéros de dates en blanc avec contour pour la lisibilité */
body.zts-embed .p-cal-day { background:transparent; color:#fff; text-shadow:1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 0 2px 4px rgba(0,0,0,.55); }
body.zts-embed .p-cal-day:hover { background:rgba(0,0,0,.18); }
body.zts-embed .p-cal-day--today { background:var(--metier-1); color:var(--metier-ink); }
body.zts-embed .p-cal-header { color:#fff; text-shadow:1px 1px 0 var(--ink), -1px -1px 0 var(--ink); }
/* Bouton « Rétrécir » : visible uniquement en plein écran */
#ztsExitFs { display:none; position:fixed; top:14px; right:14px; z-index:99999; align-items:center; gap:6px; font-family:var(--font-impact); font-size:1rem; padding:10px 18px; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink); cursor:pointer; box-shadow:4px 4px 0 var(--ink); }
#ztsExitFs:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
body.zts-full #ztsExitFs { display:inline-flex; }
/* Aplatit la vue Semaine : pas de swirl ni de feuille en double (un seul encadré = celui du hub) */
body.zts-embed .sem-root { background:transparent !important; padding:4px !important; }
body.zts-embed .sem-root .sheet { background:transparent !important; border:none !important; box-shadow:none !important; padding:4px !important; max-width:none !important; }
/* PLEIN ÉCRAN (classe ajoutée par le hub) : fond bleu+jaune + UN encadré blanc autour de la vue */
body.zts-embed.zts-full { background:linear-gradient(180deg, rgba(255,254,247,.55) 0%, rgba(255,254,247,.4) 40%, rgba(255,254,247,.62) 100%), url('/bg-gym.jpg') center/cover fixed !important; padding:18px !important; overflow:auto; }
body.zts-embed.zts-full #app-root { background:#fff; border:5px solid var(--ink); border-radius:24px; box-shadow:10px 10px 0 var(--ink); max-width:1320px; margin:0 auto; padding:clamp(14px,2vw,28px); min-height:calc(100dvh - 36px); }

/* SWIRL JAUNE+CYAN RETIRÉ le 4 août 2026 (chantier patron). C'était le dernier
   endroit du site à porter l'ancien décor : rayons cyan et jaunes en cône
   depuis le coin bas-droit, posés en dur sur body[data-metier]. Le décor est
   maintenant celui du patron — marine, trame, rayons jaunes en rotation — et
   il vient de `html.ztsp-decor`, une seule fois pour tout le site.
   `html.ztsp-decor body` (0,1,2) remettrait de toute façon ce fond à
   transparent — il passe devant `body[data-metier]` (0,1,1). Mais on ne compte
   pas là-dessus : une déclaration morte qu'une seule règle tient à distance
   est une chausse-trappe pour la prochaine personne. On l'enlève. */

/* ── La bannière de métier, au patron — SCOPÉE À CETTE APP ──────────────────
   `.zts-metier-banner` vit dans shared/zts.css et sert une trentaine de pages
   (les trois hubs et une douzaine d'apps). Son aplat #19C3FF pleine largeur
   coupait le décor exactement comme les trois fonds de l'accueil. On ne la
   change PAS à la source : ces pages n'ont pas encore le décor, et le cyan y
   est encore le bon choix. Ce sera le chantier « étendre le décor aux apps ».
   Ici, on la neutralise pour cette page seulement. */
.zts-metier-banner{
  background:transparent !important;
  border:none !important;
  box-shadow:none !important;
  padding:0 !important;
  display:block !important;
}
.zts-metier-banner h1{
  font-family:var(--ztsp-f-titre); font-size:clamp(26px,3.6vw,42px);
  letter-spacing:.6px; color:#fff; margin:10px 0 2px;
  /* Le relief jaune à six ombres appartenait au fond cyan. Sur le marine il
     fait du bruit : le titre du patron est blanc, net, sans contour. */
  text-shadow:none;
}
/* L'étiquette reprend `.ztsp-eyebrow` — même forme que sur l'accueil. */
.zts-metier-banner__pill{
  font-family:var(--ztsp-f-punch); letter-spacing:1.6px; font-size:17px;
  background:var(--ztsp-jaune); color:#2B2A00;
  padding:4px 13px 2px; border-radius:7px; border:3px solid var(--ztsp-noir);
  transform:rotate(-1.6deg); box-shadow:3px 3px 0 rgba(0,0,0,.45);
}
body[data-metier="sdg"] .zts-metier-banner__pill{ background:var(--ztsp-lime);   color:#1E3300; }
body[data-metier="camp"] .zts-metier-banner__pill{ background:var(--ztsp-orange); color:#3D2400; }
/* Le trait de section, ajouté sous le titre par le script de bas de page. */
.zts-metier-banner .ztsp-sectrait{ margin-top:12px; }

/* L'écran d'avant-connexion était gris sur fond clair : `opacity:.6` sur du
   texte foncé. Sur le marine il faut l'inverse. */
.p-empty{ color:var(--ztsp-sur-fond-doux); opacity:1; }
.p-empty-text{ font-family:var(--ztsp-f-note); font-size:20px; }
.zts-container{position:relative;z-index:1}
/* Personnage EN HAUT À DROITE, interactif : survol = wiggle + bulle de bienvenue par métier */
.p-perso{
  position:fixed;top:88px;right:12px;width:clamp(92px,11vw,168px);aspect-ratio:3/4;
  background-size:contain;background-repeat:no-repeat;background-position:top center;
  z-index:40;cursor:pointer;filter:drop-shadow(4px 5px 0 rgba(0,0,0,.4));
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.p-perso:hover{transform:translateY(-6px) rotate(-5deg) scale(1.06);animation:p-perso-wiggle .5s ease-in-out .25s 1}
@keyframes p-perso-wiggle{0%,100%{transform:translateY(-6px) rotate(-5deg) scale(1.06)}25%{transform:translateY(-6px) rotate(4deg) scale(1.06)}75%{transform:translateY(-6px) rotate(-7deg) scale(1.06)}}
/* Bulle de salutation, à GAUCHE du perso (il est collé à droite de l'écran) */
.p-perso::after{
  content:'';position:absolute;right:94%;top:8px;opacity:0;
  transform:translateX(12px) scale(.9);transform-origin:right center;
  transition:opacity .2s,transform .2s;pointer-events:none;
  width:max-content;max-width:min(260px,62vw);white-space:normal;text-align:left;
  font-family:var(--font-body, 'Quicksand', 'Helvetica Neue', sans-serif);font-weight:700;font-size:.98rem;line-height:1.25;color:var(--ink);
  background:#fff;border:4px solid var(--ink);border-radius:16px;padding:10px 14px;box-shadow:5px 5px 0 var(--ink);
}
.p-perso:hover::after{opacity:1;transform:translateX(0) scale(1)}
body[data-metier="ep"]   .p-perso{background-image:url('img/mascotte-ep.png')}
body[data-metier="camp"] .p-perso{background-image:url('img/mascotte-camp.png')}
body[data-metier="sdg"]  .p-perso{background-image:url('img/mascotte-sdg.png')}
body[data-metier="ep"]   .p-perso::after{content:'Bienvenue dans la section éducation physique ! 🏀'}
body[data-metier="camp"] .p-perso::after{content:'Bienvenue dans la section camps de jour ! ⛺'}
body[data-metier="sdg"]  .p-perso::after{content:'Bienvenue dans la section service de garde ! 🧸'}
@media(max-width:900px){.p-perso{display:none}}

/* Group bar */
.p-group-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-4);padding:var(--space-3) var(--space-4);background:var(--cream);border:var(--bord);border-radius:var(--r-2);box-shadow:var(--ombre)}
.p-group-name{font-family:var(--font-impact);font-size:var(--fs-3)}
.p-group-theme{font-family:var(--font-fun);font-size:var(--fs-1);opacity:.7}

/* Secondary nav */
.p-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--space-4)}
.p-nav-btn{font-size:var(--fs-1);padding:8px 14px;background:#fff}   /* base visuelle = .zts-action */
.p-nav-btn.active{background:var(--metier-1);color:var(--metier-ink)}

/* Card */
.p-card{background:#fff;border:var(--bord-gros);border-radius:var(--r-3);box-shadow:var(--ombre-xl);padding:var(--space-4)}

/* Form */
.p-field{margin-bottom:var(--space-3)}
.p-label{display:block;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2);margin-bottom:var(--space-2)}
.p-input,.p-select{width:100%;padding:12px 16px;border:var(--bord);border-radius:var(--r-2);font-family:var(--font-body);font-size:var(--fs-2);background:#fff;box-sizing:border-box}
.p-input:focus,.p-select:focus{border-color:var(--metier-1);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--metier-1) 20%,transparent)}

/* Avatar */
.p-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:var(--bord);box-shadow:var(--ombre)}
.p-photo-sm{width:50px;height:50px}
.p-initials{width:80px;height:80px;border-radius:50%;border:var(--bord);box-shadow:var(--ombre);display:flex;align-items:center;justify-content:center;font-family:var(--font-impact);font-size:var(--fs-4);background:var(--cream);color:var(--ink);flex-shrink:0}
.p-initials-sm{width:50px;height:50px;font-size:var(--fs-2)}

/* Enfants grid (roster) */
.p-enfants-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--space-3);margin-bottom:var(--space-4)}
.p-enfant-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:var(--space-3);background:#fff;border:var(--bord);border-radius:var(--r-2);box-shadow:var(--ombre);cursor:pointer;transition:transform .15s;text-align:center}
.p-enfant-card:hover{transform:translateY(-3px);box-shadow:var(--ombre-xl)}
.p-enfant-name{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2)}
.p-enfant-sub{font-family:var(--font-body);font-size:var(--fs-1);opacity:.6}

/* Presence grid */
.p-presence-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:var(--space-3);margin:var(--space-3) 0}
.p-pcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-3) var(--space-2);border:4px solid #ccc;border-radius:var(--r-2);box-shadow:var(--ombre);cursor:pointer;transition:all .12s;text-align:center;background:#fff;position:relative;user-select:none;-webkit-user-select:none}
.p-pcard:active{transform:scale(.95)}
.p-pcard-tap{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;width:100%}
.p-arrive{margin-top:6px;width:100%;font-family:var(--font-fun);font-weight:700;font-size:clamp(10px,1.2vw,12px);cursor:pointer;background:var(--cream);border:2px solid var(--ink);border-radius:var(--r-1);box-shadow:2px 2px 0 var(--ink);padding:3px 6px}
.p-arrive:hover{background:var(--jaune)}
.p-pcard--attendu{opacity:.5;border-color:#bbb}
.p-pcard--attendu .p-photo,.p-pcard--attendu .p-initials{filter:saturate(.2)}
.p-pcard--present{border-color:var(--vert);opacity:1}
.p-pcard--parti{border-color:#999}
.p-pcard--parti .p-photo,.p-pcard--parti .p-initials{filter:grayscale(1)}
.p-pcard--absent{border-color:var(--rose);opacity:.55}
.p-pcard-time{font-family:var(--font-body);font-size:clamp(11px,1.4vw,13px);font-weight:700}
.p-pcard-badge{position:absolute;top:-8px;right:-8px;font-family:var(--font-impact);font-size:clamp(10px,1.2vw,12px);padding:2px 8px;border:2px solid var(--ink);border-radius:var(--r-1);box-shadow:2px 2px 0 var(--ink)}
.p-badge-present{background:var(--vert)}
.p-badge-absent{background:var(--rose);color:#fff}
.p-badge-parti{background:#ddd}
.p-badge-flag{background:var(--jaune)}
/* Particularités (mini sous le nom) */
.p-partic-row{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:1px;line-height:1}
.p-partic-mini{font-size:clamp(13px,1.6vw,16px);line-height:1;cursor:help}
/* "!" message-parent flag (coin photo) */
.p-msg-flag{position:absolute;top:-9px;left:-9px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--font-impact);font-size:17px;background:var(--jaune);color:var(--ink);border:2px solid var(--ink);border-radius:50%;box-shadow:2px 2px 0 var(--ink);z-index:4;animation:p-msgpulse 1.2s ease-in-out infinite}
@keyframes p-msgpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* Summary */
.p-summary{display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:center;margin-bottom:var(--space-3)}
.p-summary-item{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);padding:4px 12px;border:var(--bord);border-radius:var(--r-1);box-shadow:2px 2px 0 var(--ink);background:#fff}

/* Depart persons */
.p-depart-persons{display:flex;flex-wrap:wrap;gap:10px;margin:var(--space-3) 0}
.p-depart-person{display:inline-flex;align-items:center;gap:6px;padding:14px 20px;border:var(--bord);border-radius:var(--r-2);background:var(--cream);cursor:pointer;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2);box-shadow:var(--ombre);transition:all .15s}
.p-depart-person:hover{transform:translateY(-2px);box-shadow:var(--ombre-xl)}
.p-depart-person.selected{background:var(--metier-1);color:var(--metier-ink)}

/* Warning */
.p-warning{background:rgba(255,45,135,.12);border:2px solid var(--rose);border-radius:var(--r-2);padding:var(--space-3);font-family:var(--font-body);font-size:var(--fs-2);font-weight:700;margin:var(--space-3) 0;display:none}
.p-warning.show{display:block}

/* Particularités chips (modal enfant) */
.p-partic-chips{display:flex;flex-wrap:wrap;gap:8px}
.p-partic-chip{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);padding:6px 12px;border:2px solid var(--ink);border-radius:var(--r-1);background:#fff;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:all .12s;user-select:none}
.p-partic-chip:hover{transform:translateY(-1px)}
.p-partic-chip.on{background:var(--cyan);color:var(--ink)}

/* Journal de bord (modal depart) */
.p-humeur-row{display:flex;gap:10px;flex-wrap:wrap;margin:var(--space-2) 0}
.p-humeur-btn{flex:1;min-width:90px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:2px solid var(--ink);border-radius:var(--r-2);background:#fff;cursor:pointer;font-family:var(--font-fun);font-weight:700;box-shadow:2px 2px 0 var(--ink);transition:all .12s}
.p-humeur-emoji{font-size:clamp(20px,2.6vw,28px);line-height:1}
.p-humeur-lbl{font-size:var(--fs-1)}
.p-humeur-btn:hover{transform:translateY(-2px)}
.p-humeur-btn.on{background:var(--hc,var(--jaune));box-shadow:3px 3px 0 var(--ink)}
.p-msgparent-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--font-body);font-weight:700;font-size:var(--fs-2);background:rgba(255,234,0,.18);border:2px solid var(--jaune);border-radius:var(--r-2);padding:var(--space-3);margin:var(--space-3) 0}
.p-msgparent-toggle input{width:20px;height:20px;cursor:pointer;flex-shrink:0}

/* Messagerie coordo ↔ animateur */
.p-msg-bell.has-unread{animation:p-msgpulse 1s ease-in-out infinite}
.p-msg-badge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-family:var(--font-impact);font-size:11px;background:var(--rose);color:#fff;border:2px solid var(--ink);border-radius:var(--r-1);box-shadow:1px 1px 0 var(--ink)}
.p-msg-dot{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;margin-left:6px;font-family:var(--font-impact);font-size:11px;background:var(--rose);color:#fff;border:2px solid var(--ink);border-radius:var(--r-1);vertical-align:middle}
.p-msg-mini-btn{flex-shrink:0;display:inline-flex;align-items:center;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);padding:4px 10px;border:2px solid var(--ink);border-radius:var(--r-1);background:var(--cream);cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:all .12s}
.p-msg-mini-btn:hover{background:var(--cyan);transform:translateY(-1px)}
.p-msg-thread-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto}
.p-msg-thread-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:2px solid var(--ink);border-radius:var(--r-2);background:#fff;cursor:pointer;box-shadow:2px 2px 0 var(--ink);font-family:var(--font-body);text-align:left;transition:all .12s}
.p-msg-thread-row:hover{transform:translateY(-2px);background:var(--cream)}
.p-msg-thread-titre{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2)}
.p-msg-thread-meta{display:flex;align-items:center;gap:4px;font-size:var(--fs-1);opacity:.7;flex-shrink:0}
.p-msg-back{background:none;border:none;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2);cursor:pointer;color:var(--ink);padding:0;margin-bottom:2px}
.p-msg-body{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow-y:auto;padding:var(--space-2) 2px;margin:var(--space-2) 0}
.p-msg-bubble{max-width:82%;padding:8px 12px;border:2px solid var(--ink);border-radius:var(--r-2);box-shadow:2px 2px 0 var(--ink);font-family:var(--font-body)}
.p-msg-bubble.mine{align-self:flex-end;background:var(--cyan)}
.p-msg-bubble.them{align-self:flex-start;background:var(--jaune)}
.p-msg-who{font-size:clamp(10px,1.2vw,12px);font-weight:700;opacity:.6;margin-bottom:2px}
.p-msg-text{font-size:var(--fs-2);white-space:pre-wrap;word-break:break-word}
.p-msg-compose{display:flex;gap:8px;align-items:flex-end}
.p-msg-compose textarea{flex:1;resize:vertical}

/* Évaluation PFEQ — tableau élèves × critères */
.p-eval-wrap{overflow-x:auto;border:3px solid var(--ink);border-radius:var(--r-2);box-shadow:var(--ombre);background:#fff;-webkit-overflow-scrolling:touch}
.p-eval-table{border-collapse:collapse;width:100%;font-family:var(--font-body)}
.p-eval-table th,.p-eval-table td{border:1px solid #e0e3e8;padding:8px;text-align:center;vertical-align:middle}
.p-eval-sticky{position:sticky;left:0;z-index:2;background:#fff}
.p-eval-name{min-width:130px;text-align:left!important;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1)}
.p-eval-name .p-photo-sm,.p-eval-name .p-initials-sm{display:inline-block;vertical-align:middle;margin-right:6px}
.p-eval-col{min-width:88px;background:var(--cream)}
.p-eval-colh{display:flex;align-items:flex-start;gap:4px;justify-content:center;font-family:var(--font-fun);font-weight:700;font-size:clamp(11px,1.3vw,13px);line-height:1.15}
.p-eval-colx{flex-shrink:0;border:none;background:none;color:var(--rose);cursor:pointer;font-size:13px;font-weight:700;padding:0 2px}
.p-eval-coltype{font-family:var(--font-body);font-size:clamp(9px,1.1vw,11px);opacity:.55;margin-top:2px}
.p-eval-cell{cursor:pointer;font-family:var(--font-impact);font-size:clamp(13px,1.7vw,17px);min-width:64px;transition:background .1s;user-select:none}
.p-eval-cell:hover{background:var(--jaune)}
.p-eval-cell.has-val{background:#eafff0}
.p-eval-cell .p-eval-val{pointer-events:none}

/* History */
.p-history-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border:var(--bord);border-radius:var(--r-2);box-shadow:var(--ombre);background:#fff;margin-bottom:var(--space-3)}
.p-history-date{font-family:var(--font-impact);font-size:var(--fs-2);min-width:90px;flex-shrink:0}
.p-history-detail{font-family:var(--font-body);font-size:var(--fs-1);flex:1}
.p-history-flag{display:inline-block;padding:2px 8px;border-radius:var(--r-1);font-family:var(--font-impact);font-size:clamp(10px,1.2vw,12px);background:var(--rose);color:#fff;border:2px solid var(--ink)}

/* Photo upload */
.p-photo-upload{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}
.p-photo-preview{width:120px;height:120px;border-radius:50%;border:var(--bord-gros);box-shadow:var(--ombre-xl);overflow:hidden;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer}
.p-photo-preview img{width:100%;height:100%;object-fit:cover}

/* Autorise rows */
.p-autorise-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.p-autorise-row .p-input{flex:1}
.p-autorise-remove{width:36px;height:36px;border:var(--bord);border-radius:50%;background:var(--rose);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* Sync bar */
.p-sync{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:6px 16px;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);text-align:center;transition:transform .3s;transform:translateY(100%)}
.p-sync--offline{background:var(--rose);color:#fff;transform:translateY(0)}
.p-sync--syncing{background:var(--jaune);color:var(--ink);transform:translateY(0)}

/* Empty / Welcome */
.p-empty{text-align:center;padding:var(--space-5);opacity:.6}
.p-empty-icon{font-size:48px;margin-bottom:var(--space-2)}
.p-empty-text{font-family:var(--font-fun);font-size:var(--fs-2)}
.p-welcome{text-align:center;max-width:500px;margin:0 auto}
.p-welcome h2{font-family:var(--font-impact);font-size:var(--fs-5);margin-bottom:var(--space-3)}
.p-welcome p{font-family:var(--font-body);font-size:var(--fs-2);opacity:.85;margin-bottom:var(--space-4)}

/* Modal actions */
.p-modal-actions{display:flex;gap:10px;margin-top:var(--space-4);flex-wrap:wrap}

/* ═══ CALENDRIER ═══ */
.p-date-nav{display:flex;align-items:center;justify-content:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.p-date-nav .p-day-title{font-family:var(--font-impact);font-size:clamp(1.6rem,5vw,2.8rem)}
.p-date-nav .p-day-nav-btn{width:clamp(44px,6vw,60px);height:clamp(44px,6vw,60px);font-size:clamp(1.2rem,3vw,1.8rem)}
.p-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(4px,1vw,10px);margin-bottom:var(--space-4)}
.p-cal-header{text-align:center;font-family:var(--font-impact);font-weight:700;font-size:clamp(1rem,2.5vw,1.6rem);padding:clamp(6px,1.5vw,14px) 0;color:var(--ink)}
.p-cal-day{text-align:center;padding:clamp(16px,4vw,36px) 4px;border-radius:var(--r-2);cursor:pointer;font-family:var(--font-body);font-size:clamp(1.2rem,3.5vw,2.2rem);font-weight:700;border:var(--bord);background:#fff;box-shadow:3px 3px 0 var(--ink);transition:all .12s;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.p-cal-day:hover{transform:translateY(-2px);box-shadow:5px 5px 0 var(--ink);background:var(--cream)}
.p-cal-day--today{background:var(--metier-1);color:var(--metier-ink);box-shadow:4px 4px 0 var(--ink)}
.p-cal-day--today:hover{background:color-mix(in srgb,var(--metier-1) 82%,#000)}
.p-cal-day--has-blocs{background:var(--vert);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.p-cal-day--has-blocs:hover{background:#3a9e3e}
.p-cal-day--weekend{opacity:.3;cursor:default;border-color:#ddd;box-shadow:none;background:var(--cream)}
.p-cal-day--weekend:hover{transform:none;box-shadow:none;background:var(--cream)}
.p-cal-day--empty{pointer-events:none;border:none;box-shadow:none;background:transparent}

/* ═══ JOURNEE (blocs timeline) ═══ */
.p-day-header{text-align:center;margin-bottom:var(--space-3)}
.p-day-back{display:inline-block;margin-bottom:var(--space-2);font-size:clamp(1rem,2.5vw,1.4rem);cursor:pointer;opacity:.6}
.p-day-back:hover{opacity:1}
.p-day-main-title{font-family:var(--font-impact);font-size:clamp(2rem,6vw,3.2rem);color:var(--metier-1);cursor:pointer;margin-bottom:var(--space-2);transition:color .15s;text-align:center}
.p-day-main-title:hover{color:var(--ink)}
.p-day-title-row{display:flex;align-items:center;justify-content:center;gap:var(--space-3);margin-bottom:var(--space-1)}
.p-day-title{font-family:var(--font-fun);font-size:clamp(1.4rem,4.5vw,2.4rem);cursor:pointer;transition:color .15s}
.p-day-title:hover{color:var(--metier-1)}
.p-bloc-attachments{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.p-bloc-attach{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;background:var(--cream);border:2px solid var(--ink);border-radius:var(--r-1);font-family:var(--font-fun);font-size:var(--fs-1);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);transition:all .12s}
.p-bloc-attach:hover{background:var(--metier-1);color:var(--metier-ink);transform:translateY(-1px)}
.p-attach-preview{max-width:100%;max-height:200px;border-radius:var(--r-2);border:var(--bord);margin-top:8px}
.p-day-nav{display:flex;gap:6px}
.p-day-nav-btn{width:40px;height:40px;border:var(--bord);border-radius:50%;background:#fff;cursor:pointer;box-shadow:var(--ombre);display:flex;align-items:center;justify-content:center;font-size:var(--fs-2)}
.p-day-nav-btn:hover{transform:scale(1.1)}
.p-section-title{font-family:var(--font-impact);font-size:var(--fs-3);margin:var(--space-4) 0 var(--space-3);padding-bottom:var(--space-2);border-bottom:3px solid var(--ink)}
.p-timeline{display:flex;flex-direction:column;gap:var(--space-2)}
.p-bloc{display:flex;align-items:stretch;gap:0;background:#fff;border:3px solid var(--ink);border-radius:var(--r-2);box-shadow:var(--ombre);overflow:hidden;transition:transform .12s}
.p-bloc:hover{transform:translateX(3px)}
.p-bloc-color{width:8px;flex-shrink:0}
.p-bloc-body{flex:1;padding:12px 14px;min-width:0}
.p-bloc-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-bloc-type{font-family:var(--font-impact);font-size:var(--fs-1);padding:2px 10px;border:2px solid var(--ink);border-radius:var(--r-1);color:#fff;white-space:nowrap}
.p-bloc-titre{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2)}
.p-bloc-times{font-family:var(--font-body);font-size:var(--fs-1);opacity:.6;margin-top:4px}
.p-bloc-detail{font-family:var(--font-body);font-size:var(--fs-1);opacity:.7;margin-top:2px}
.p-bloc-notes{font-size:var(--fs-1);margin-top:6px;padding:8px 10px;background:var(--cream);border-radius:var(--r-1);white-space:pre-wrap;line-height:1.4}
.p-textarea{resize:vertical;min-height:60px;font-family:var(--font-body);font-size:var(--fs-2)}
.p-font-grid{display:flex;flex-wrap:wrap;gap:6px}
.p-font-option{padding:6px 14px;border:3px solid #ddd;border-radius:var(--r-2);cursor:pointer;font-size:var(--fs-1);transition:all .12s}
.p-font-option:hover{border-color:var(--ink);transform:translateY(-1px)}
.p-font-option.selected{border-color:var(--metier-1);background:var(--metier-1);color:var(--metier-ink)}
.p-color-grid{display:flex;flex-wrap:wrap;gap:6px}
.p-color-option{width:38px;height:38px;border:3px solid var(--ink);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;transition:all .12s}
.p-color-option:hover{transform:scale(1.15)}
.p-color-option.selected{box-shadow:0 0 0 3px var(--metier-1),0 0 0 5px #fff}
.p-bloc-actions{display:flex;flex-direction:column;gap:2px;padding:4px;justify-content:center}
.p-bloc-btn{width:36px;height:36px;border:var(--bord);border-radius:var(--r-1);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .1s}
.p-bloc-btn:hover{background:var(--cream)}
.p-bloc-btn--danger:hover{background:var(--rose);color:#fff}
.p-bloc-add{display:flex;justify-content:center;margin:var(--space-3) 0}

/* Gabarit */
.p-gabarit-header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-4)}

/* Type selector in modal */
.p-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:var(--space-3)}
.p-type-option{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:3px solid #ddd;border-radius:var(--r-2);cursor:pointer;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);transition:all .12s;text-align:center}
.p-type-option:hover{transform:translateY(-2px)}
.p-type-option.selected{border-color:var(--metier-1);background:color-mix(in srgb,var(--metier-1) 8%,transparent)}
.p-type-icon{font-size:24px}

/* Apply modal */
.p-apply-section{margin-bottom:var(--space-4)}

/* ═══ MODE LIVE ═══ */
.p-live{min-height:100vh;padding:var(--space-3)}
.p-live-header{text-align:center;margin-bottom:var(--space-4)}
.p-live-title{font-family:var(--font-impact);font-size:clamp(2rem,6vw,3.4rem);color:var(--metier-1);margin:var(--space-2) 0}
.p-live-date{font-family:var(--font-fun);font-size:clamp(1.2rem,3.5vw,2rem);margin-bottom:var(--space-1)}
.p-live-clock{font-family:var(--font-impact);font-size:clamp(2rem,7vw,4rem);color:var(--ink);letter-spacing:2px}
.p-live-timeline{display:flex;flex-direction:column;gap:var(--space-3);max-width:900px;margin:0 auto}
.p-live-bloc{background:#fff;border:3px solid var(--ink);border-radius:var(--r-2);padding:clamp(14px,3vw,24px);box-shadow:var(--ombre);transition:all .4s}
.p-live-bloc--active{background:#fffde7;box-shadow:0 0 0 4px var(--metier-1),var(--ombre-xl);transform:scale(1.02)}
.p-live-bloc--done{opacity:.35;filter:blur(1px);transform:scale(.97)}
.p-live-bloc-head{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.p-live-bloc-titre{font-family:var(--font-impact);font-size:clamp(1.2rem,3.5vw,2rem)}
.p-live-bloc-time{font-family:var(--font-body);font-size:clamp(1rem,2.5vw,1.4rem);opacity:.6;margin-top:4px}
.p-live-bloc-notes{font-family:var(--font-fun);font-size:clamp(1rem,2.5vw,1.3rem);margin-top:8px;padding:10px 14px;background:var(--cream);border-radius:var(--r-1);white-space:pre-wrap}
.p-live-check{width:clamp(40px,6vw,56px);height:clamp(40px,6vw,56px);border:3px solid var(--vert);border-radius:50%;background:#fff;cursor:pointer;font-size:clamp(1.2rem,3vw,1.8rem);display:flex;align-items:center;justify-content:center;transition:all .15s;margin-left:auto;flex-shrink:0}
.p-live-check:hover{background:var(--vert);color:#fff;transform:scale(1.1)}
.p-live-done-badge{font-size:clamp(1.4rem,3vw,2rem);margin-left:auto}

/* ═══ CALENDRIER UNIFIE — toggle Jour/Semaine/Mois + vue Semaine (scope .zts-vue-*) ═══ */
.zts-vue-toggle{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:var(--space-4)}
.zts-vue-tab{font-size:var(--fs-2);padding:8px 18px;background:#fff}   /* base visuelle = .zts-action */
.zts-vue-tab--active{background:var(--metier-1);color:var(--metier-ink)}
.zts-vue-week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(4px,1vw,10px);margin-bottom:var(--space-4);align-items:start}
.zts-vue-week-col{display:flex;flex-direction:column;gap:6px;background:var(--cream);border:var(--bord);border-radius:var(--r-2);padding:6px;box-shadow:var(--ombre);min-height:120px}
.zts-vue-week-col--today{border-color:var(--metier-1);box-shadow:0 0 0 2px var(--metier-1),var(--ombre)}
.zts-vue-week-head{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;background:#fff;border:var(--bord);border-radius:var(--r-1);cursor:pointer;transition:all .12s}
.zts-vue-week-head:hover{background:var(--metier-1);color:var(--metier-ink);transform:translateY(-1px)}
.zts-vue-week-dow{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1)}
.zts-vue-week-num{font-family:var(--font-impact);font-size:var(--fs-3);line-height:1}
.zts-vue-mini-bloc{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#fff;border:2px solid var(--ink);border-left-width:6px;border-radius:var(--r-1);cursor:pointer;font-family:var(--font-body);transition:transform .1s}
.zts-vue-mini-bloc:hover{transform:translateX(2px)}
.zts-vue-mini-ic{flex-shrink:0}
.zts-vue-mini-titre{flex:1;min-width:0;font-size:var(--fs-1);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zts-vue-mini-times{flex-shrink:0;font-size:clamp(10px,1.4vw,12px);opacity:.6}
.zts-vue-week-empty{text-align:center;padding:10px 4px;font-family:var(--font-fun);font-size:var(--fs-1);opacity:.5;cursor:pointer;border:2px dashed #ccc;border-radius:var(--r-1)}
.zts-vue-week-empty:hover{opacity:.9;border-color:var(--metier-1);color:var(--metier-1)}
@media(max-width:640px){
  .zts-vue-week-grid{grid-template-columns:1fr}
  .zts-vue-week-col{flex-direction:row;flex-wrap:wrap;align-items:center;min-height:0}
  .zts-vue-week-head{flex-direction:row;gap:8px;min-width:84px}
  .zts-vue-mini-bloc{flex:1;min-width:140px}

  /* iOS : inputs ≥16px sinon Safari zoome au focus */
  .p-input,.p-select,textarea.p-input{font-size:16px}

  /* Modals : presque pleine largeur, scroll interne, marge sûre + safe-area iPhone */
  .zts-modal{padding:10px}
  .zts-modal__inner{padding:var(--space-4) var(--space-3) calc(var(--space-4) + env(safe-area-inset-bottom));max-height:calc(100dvh - 20px);border-radius:var(--r-3);box-shadow:6px 6px 0 var(--zts-noir)}

  /* Présences : plus de cartes par rangée sur petit écran */
  .p-presence-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--space-2)}
  .p-enfants-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}

  /* Barre de groupe + nav : compactes */
  .p-group-bar{padding:var(--space-2) var(--space-3)}
  .p-nav-btn{padding:8px 11px}

  /* Tableau coordo : la ligne enfant s'empile (nom / détail / bouton 💬) */
  .p-history-item{flex-wrap:wrap;gap:8px}
  .p-history-date{min-width:0;width:100%}
  .p-history-detail{flex:1 1 100%}
  .p-msg-mini-btn{padding:8px 12px}      /* cible tactile plus grande */

  /* Messagerie : corps plus haut, bulles plus larges, composer empilé */
  .p-msg-body{max-height:46dvh}
  .p-msg-thread-list{max-height:62dvh}
  .p-msg-bubble{max-width:90%}
  .p-msg-compose{flex-direction:column;align-items:stretch}
  .p-msg-compose .zts-action{width:100%}

  /* Journal de bord : 3 humeurs adaptables sans débordement */
  .p-humeur-btn{min-width:0;flex:1 1 28%}
  .p-depart-person{font-size:var(--fs-1);padding:12px 16px}
}

/* Tablette portrait : garder de l'air, modal centré confortable */
@media(min-width:641px) and (max-width:1024px){
  .p-presence-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}

/* ═══════════ COQUILLE v2 (Mandat D1 — réf. docs/maquette-planif-v2.html) ═══════════
   Scopée body.pv2 (flag ?v2=1). --m1/--m2/--mtxt posés par app-v2.js. */
/* LE SECOND SWIRL. Celui de `body[data-metier]` est parti plus haut, mais la
   coquille v2 en avait un deuxième, indépendant, qui recouvrait le décor du
   patron — vu en production le 4 août, session ouverte. On le retire aussi :
   `background:transparent` laisse passer `html.ztsp-decor`.

   LE `padding` RESTE, ET LE `!important` AVEC. La règle du chantier dit de ne
   jamais poser de padding sur `body`, parce que `adjustHeaderOffset()` y écrit
   la place réservée sous l'en-tête fixe. Ici c'est justement l'inverse qu'on
   veut : la coquille v2 masque l'en-tête partagé, il n'y a rien à réserver, et
   ces 16 px sont la gouttière autour du cadre de l'app. Le `!important` est ce
   qui le protège du calcul d'`adjustHeaderOffset`, qui écrit en style inline.

   La coquille elle-même n'est PAS touchée : ses cartes blanches à bordure
   noire, ses ombres décalées et ses polices sont déjà celles de la marque. */
/* Le raccourci `padding` ECRASAIT la reserve de l'en-tete.
   ──────────────────────────────────────────────────────────────────
   `adjustHeaderOffset` (shared/zts.js) mesure le bas reel de la barre et pose
   `body.padding-top`. Ce `padding:16px 12px!important` le remettait a 16px :
   la barre, haute de ~224px et fixee, serait passee PAR-DESSUS l'app.
   On ne force donc plus que les cotes et le bas ; le haut reste au shell,
   qui seul connait la hauteur reelle de sa barre a cette largeur. */
body.pv2{--m1:#2FC6F5;--m2:#FFF200;--mtxt:#111;--pv2-gold:#C9A000;
  background:transparent!important;
  padding-left:12px!important;padding-right:12px!important;padding-bottom:16px!important;}
/* L'EN-TETE ZTS RESTE VISIBLE (decision Joey, 2026-08-26).
   ──────────────────────────────────────────────────────────────────
   Il etait masque avec le reste du chrome. Consequence : un enseignant qui
   entrait ici par un lien direct n'avait AUCUN chemin de retour vers le site,
   ni menu, ni bascule de langue. Le Planificateur est l'aimant de la rentree :
   un aimant doit ramener vers ZTS, pas retenir.
   Restent masques — ils coutent de la hauteur sans rien apporter ICI :
     .zts-subnav          la sous-nav du site double la barre metier de l'app
     [data-zts-footer]    un pied de page sous un calendrier ne sert personne
     .zts-metier-banner   l'app affiche deja son metier dans sa propre barre
     .p-perso             la mascotte mangeait un coin de la grille */
body.pv2 .zts-subnav,body.pv2 .p-perso,body.pv2 [data-zts-footer],body.pv2 .zts-metier-banner{display:none!important}
body.pv2 main.zts-container{max-width:none!important;padding:0!important}
/* `min-height` n'est plus cable a `100vh - 80px` : ce 80 valait pour une page
   sans en-tete. Le body porte maintenant un padding-top mesure par
   adjustHeaderOffset (shared/zts.js), variable selon la largeur — un chiffre
   fige ferait depasser la carte et imposerait un defilement pour rien.
   `min-height:0` + `flex:1` laisse la carte prendre ce qui reste, quel que
   soit ce que l'en-tete a reserve. */
.pv2-app{max-width:1360px;margin:0 auto;border:4px solid var(--ink);border-radius:26px;background:#fffdf9;overflow:hidden;box-shadow:10px 10px 0 rgba(0,0,0,.55);min-height:0;flex:1;display:flex;flex-direction:column}
.pv2-topbar{display:flex;align-items:center;gap:12px;background:var(--m1);border-bottom:4px solid var(--ink);padding:10px 18px;flex-wrap:wrap}
.pv2-logo{font-family:var(--font-impact);font-size:24px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.pv2-act{background:#fff;color:var(--ink);font-size:18px;letter-spacing:1px;white-space:nowrap}
.pv2-act.sm{font-size:16px;padding:9px 14px;box-shadow:3px 3px 0 #111}
.pv2-act.prim{background:var(--m2)}
body.pv2[data-metier="camp"] .pv2-act.prim{color:#fff}
.pv2-metier{display:flex;gap:6px;margin-left:auto}
.pv2-subrow{display:none;gap:10px;flex-wrap:wrap;background:#fffbe0;border-bottom:4px solid var(--ink);padding:10px 18px}
.pv2-subrow.on{display:flex}
.pv2-body{display:flex;flex:1;min-height:0}
.pv2-main{flex:1;padding:18px 22px;min-width:0}
/* panneau groupes */
.pv2-gpanel{display:none;width:300px;border-left:4px solid var(--ink);background:#fff;padding:14px;flex-shrink:0}
.pv2-gpanel.on{display:block}
.pv2-gpanel h6{font-family:var(--font-bang);font-size:18px;letter-spacing:1.5px;margin:0 0 10px}
.pv2-annee{margin-bottom:8px;font-size:16px;padding:8px 10px}
.pv2-lecture{font-size:14px;font-weight:700;color:#a55;background:#fff2f2;border:2px dashed #d99;border-radius:8px;padding:4px 8px;margin-bottom:8px;text-align:center}
.pv2-gitem{border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);margin-bottom:9px;overflow:hidden}
.pv2-ghead{display:flex;align-items:center}
.pv2-gname{flex:1;font-family:var(--font-bang);font-size:20px;letter-spacing:1px;padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0}
.pv2-gitem.on .pv2-ghead{background:var(--m1)}
.pv2-gitem.on .pv2-gname{color:var(--mtxt)}
.pv2-growbtns{display:flex;gap:4px;padding-right:8px;flex-shrink:0}
.pv2-gbtn{cursor:pointer;font-size:14px;width:30px;height:30px;border:2px solid var(--ink);border-radius:8px;background:#fff;box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.pv2-gbtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.pv2-gbtn.del{color:#E23838;font-weight:900}
.pv2-gbtn.del:hover{background:#FF9B9B;color:#fff}
.pv2-gopts{border-top:3px solid var(--ink);background:#fffdf0;padding:8px}
.pv2-gopt{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:9px;background:#fff;box-shadow:2px 2px 0 var(--ink);padding:8px 12px;margin-bottom:6px;font-weight:600;font-size:16px;cursor:pointer;font-family:var(--font-fun)}
.pv2-gopt:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.pv2-gcfg{text-align:center;font-size:14px;color:#777;font-weight:700}
.pv2-gcfg span{cursor:pointer}
.pv2-gcfg span:hover{color:var(--ink);text-decoration:underline}
.pv2-gedit{padding:4px 8px;font-size:17px}
/* feuille + mensuel */
.pv2-sheet{border:4px solid var(--ink);border-radius:22px;background:#fff;box-shadow:8px 8px 0 var(--ink);padding:18px;width:100%}
.pv2-sheettitle{text-align:center;font-family:var(--font-impact);font-size:28px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:12px}
.pv2-sheettitle .c{color:var(--m1);text-shadow:2px 2px 0 var(--ink)}
.pv2-sheettitle .y{color:var(--m2);text-shadow:2px 2px 0 var(--ink)}
.pv2-mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pv2-mh{font-family:var(--font-impact);text-align:center;border:3px solid var(--ink);border-radius:10px;padding:8px 2px;font-size:22px;box-shadow:3px 3px 0 var(--ink)}
.pv2-mh.y{background:var(--m2);color:#189AD3}
.pv2-mh.c{background:var(--m1);color:var(--m2);text-shadow:1px 1px 0 var(--ink)}
.pv2-mcell{min-height:120px;border-radius:8px;padding:6px 10px;position:relative;font-family:var(--font-bang);cursor:pointer}
.pv2-mcell:hover{outline:3px solid var(--ink)}
.pv2-mcell.y{background:#FFFDE0;border:2px dashed var(--pv2-gold)}
.pv2-mcell.c{background:#E2F7FE;border:2px dashed var(--m1)}
.pv2-mcell.today{outline:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.pv2-mcell .num{font-size:26px;letter-spacing:1px}
.pv2-mcell .cyc{position:absolute;top:7px;right:11px;color:var(--pv2-gold);font-size:19px;cursor:pointer;padding:0 3px;border-radius:6px;line-height:1}
.pv2-mcell .cyc:hover{background:var(--m2);outline:2px solid var(--ink)}
.pv2-dotplan{position:absolute;bottom:8px;left:10px;color:#2ecc71;font-size:17px;text-shadow:1px 1px 0 var(--ink)}
/* calendrier scolaire : congés / pédagos / jours spéciaux */
.pv2-mcell.off{cursor:pointer}
.pv2-mcell.conge{background:#FFE0E0!important;border:2px dashed #E88!important}
.pv2-mcell.pedago{background:#E3E9FF!important;border:2px dashed #88A!important}
.pv2-mcell.special{box-shadow:inset 0 0 0 3px #B026FF}
.pv2-cbadge{position:absolute;top:8px;right:9px;font-family:var(--font-bang);font-size:12px;letter-spacing:.5px;padding:1px 7px;border:2px solid var(--ink);border-radius:8px}
.pv2-cbadge.conge{background:#FF9B9B;color:#7a1a1a}
.pv2-cbadge.pedago{background:#9FB4FF;color:#1a2a7a}
.pv2-clabel{position:absolute;left:8px;right:8px;bottom:7px;font-family:var(--font-fun);font-weight:700;font-size:11px;line-height:1.1;color:#444;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv2-clabel.special{color:#7a1a9a}
/* vue Semaine v2 : 5 colonnes = 5 journées planifiées (mêmes données que le Jour) */
.pv2-wsheet{position:relative}
.pv2-wsheet{padding-top:34px}
.pv2-wmascotte{position:absolute;top:-52px;left:-4px;width:clamp(64px,7vw,96px);filter:drop-shadow(3px 4px 0 rgba(0,0,0,.5));pointer-events:none;z-index:2}
@media(max-width:820px){.pv2-wmascotte{display:none}}
.pv2-wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.pv2-wday{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:4px 4px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;min-height:180px}
.pv2-wday.today{outline:3px solid var(--ink);outline-offset:2px}
.pv2-wday.off{opacity:.92}
.pv2-wday.conge{background:#FFF0F0}.pv2-wday.pedago{background:#F0F3FF}
.pv2-wdhd{font-family:var(--font-bang);letter-spacing:.5px;font-size:16px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--ink);cursor:pointer}
.pv2-wdhd.y{background:var(--m2);color:#189AD3}.pv2-wdhd.c{background:var(--m1);color:var(--m2);text-shadow:1px 1px 0 var(--ink)}
.pv2-wdnum{font-size:20px}
.pv2-wdbody{flex:1;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.pv2-wb{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:9px;background:#FFFDF3;padding:5px 7px;font-family:var(--font-fun);font-weight:700;font-size:12.5px;box-shadow:2px 2px 0 var(--ink)}
.pv2-wb.done{background:#DFF6E3;opacity:.85}
.pv2-wbi{flex-shrink:0;font-size:12px;border:2px solid var(--ink);border-radius:6px;padding:0 4px;color:#fff}
.pv2-wbt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv2-wbh{flex-shrink:0;font-family:var(--font-bang);font-size:11px;color:#666}
.pv2-wempty{margin:auto;color:#bbb;font-family:var(--font-fun);font-weight:700;font-size:13px}
.pv2-wspecial{margin:auto;text-align:center;font-family:var(--font-fun);font-weight:700;font-size:13px;color:#7a1a9a;padding:8px}
.pv2-wspecial small{color:#555;font-size:11px}
@media(max-width:820px){.pv2-wgrid{grid-template-columns:1fr 1fr}.pv2-wday{min-height:120px}}
.pv2-note{font-size:15px;color:#555;margin:10px 0 0;font-family:var(--font-fun)}
/* résumé de date + backdrop */
.pv2-backdrop{position:fixed;inset:0;background:rgba(20,20,30,.45);display:none;z-index:340}
.pv2-backdrop.open{display:block}
.pv2-drawer{position:fixed;top:6vh;right:4vw;width:min(560px,92vw);max-height:86vh;border:4px solid var(--ink);border-radius:18px;background:#fff;box-shadow:8px 8px 0 var(--ink);z-index:350;overflow:hidden;display:none;flex-direction:column}
.pv2-drawer.open{display:flex}
.pv2-dhd{background:var(--m1);border-bottom:4px solid var(--ink);padding:10px 16px;display:flex;align-items:center;gap:10px}
.pv2-dhd h4{font-family:var(--font-impact);margin:0;font-size:20px;flex:1;color:var(--mtxt)}
.pv2-sumline{border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);padding:9px 13px;margin:10px 14px 0;font-size:16.5px;font-family:var(--font-fun)}
.pv2-sumline b{font-size:17px;font-family:var(--font-bang);letter-spacing:.5px;color:#189AD3}
.pv2-pill{display:inline-block;border:2px solid var(--ink);border-radius:8px;padding:2px 10px;font-weight:700;font-size:14px;margin:2px 3px 0 0;background:#FFF9C4}
/* éditeur d'un jour (résumé de date) */
.pv2-daytypes{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pv2-daynote{width:100%;margin:4px 0 8px;font-size:14px;padding:9px 11px;border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);font-family:var(--font-fun);font-weight:700}
.pv2-daycyc{font-family:var(--font-fun);font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pv2-cycbtn{cursor:pointer;font-family:var(--font-bang);font-size:14px;min-width:30px;padding:4px 6px;border:2px solid var(--ink);border-radius:8px;background:#fff;box-shadow:2px 2px 0 var(--ink);color:var(--pv2-gold)}
.pv2-cycbtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.pv2-cycbtn.on{background:var(--m2);color:#189AD3}
.cyc.cyc-color{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);padding:0}
/* panneau config des jours-cycle */
.pv2-cfg{border:3px solid var(--ink);border-radius:14px;background:#FFFDF0;box-shadow:4px 4px 0 var(--ink);padding:12px 14px;margin-top:10px}
.pv2-cfgrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;font-family:var(--font-fun);font-weight:700;font-size:14px}
.pv2-cfglen{font-family:var(--font-bang);font-size:22px;color:#189AD3;min-width:26px;text-align:center}
.pv2-cycprev{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border:2px solid var(--ink);border-radius:7px;font-family:var(--font-bang);font-size:13px;padding:0 5px;background:#fff}
.pv2-cycprev.txt{color:var(--pv2-gold)}
.pv2-cfgnames{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.pv2-cycname{width:64px;font-size:13px;padding:5px 7px;border:2px solid var(--ink);border-radius:9px;box-shadow:2px 2px 0 var(--ink);font-family:var(--font-fun);font-weight:700}
.pv2-mute{color:#888}
/* vue jour en grille */
.pv2-dayhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pv2-daytitle{font-family:var(--font-impact);font-size:24px}
.pv2-drow{display:grid;grid-template-columns:112px 150px 1fr 96px;gap:8px;margin-bottom:8px}
.pv2-dcell{border:3px solid var(--ink);border-radius:10px;background:#fff;box-shadow:3px 3px 0 var(--ink);padding:10px 13px;font-size:17px;display:flex;align-items:center;min-height:24px;gap:8px;font-family:var(--font-fun)}
.pv2-dhead .pv2-dcell{background:var(--m1);color:var(--mtxt);font-family:var(--font-bang);letter-spacing:1px;justify-content:center;font-size:17px;padding:8px}
.pv2-time{font-family:var(--font-bang);font-size:17px;justify-content:center;text-align:center;line-height:1.2}
.pv2-tag{font-size:13.5px;font-weight:700;padding:3px 9px;border:2px solid var(--ink);border-radius:8px;background:#eee}
.pv2-btag{font-size:15px;border:2px solid var(--ink);border-radius:7px;padding:1px 6px;color:#fff;flex-shrink:0}
.pv2-derou{flex-wrap:wrap;align-items:flex-start}
.pv2-ed{outline:none;min-height:18px;cursor:text;flex:1;min-width:80px;white-space:pre-wrap;word-break:break-word;line-height:1.4;padding:1px 4px}
.pv2-ed:empty:before{content:'…';color:#bbb}
.pv2-ed:focus{background:#fffbd6;border-radius:6px}
.pv2-derou.pv2-dropon{background:#E2F7FE;outline:3px dashed var(--m1);outline-offset:-3px}
/* médias de case : chips uniformes en rangée dédiée (la mise en page ne bouge pas) */
.pv2-medias{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap}
.pv2-media{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--ink);border-radius:8px;background:#FFFCE0;padding:3px 9px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink);max-width:100%;font-family:var(--font-fun);transition:all .1s}
.pv2-media img{height:56px;max-width:140px;object-fit:cover;border-radius:5px;display:block}
.pv2-media .nm{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv2-media .rm{cursor:pointer;color:#E23838;font-weight:900;padding:0 2px}
.pv2-media:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
/* visionneuse média (dans le tiroir résumé) */
.pv2-mview{padding:12px 14px}
.pv2-mview img{width:100%;border:4px solid var(--ink);border-radius:14px;display:block}
.pv2-mview iframe{width:100%;height:min(64vh,560px);border:4px solid var(--ink);border-radius:14px;background:#fff}
.pv2-mview video{width:100%;border:4px solid var(--ink);border-radius:14px;background:#000}
.pv2-fait{justify-content:center;font-size:26px;cursor:pointer;font-family:var(--font-bang);user-select:none}
.pv2-fait:hover{background:#f3fff3}
.pv2-fait.ok{background:#B6F5C3}
.pv2-hole{border:3px dashed var(--ink);border-radius:13px;text-align:center;padding:14px;font-weight:700;font-size:16px;color:#777;background:#fffaf2;margin-bottom:9px;cursor:pointer;font-family:var(--font-fun);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.pv2-hole:hover{background:#fff3e2}
/* outils de rangée : minuterie + copier */
.pv2-rowtools{display:inline-flex;gap:4px;margin-left:auto;flex-shrink:0}
.pv2-tool{border:2px solid var(--ink);border-radius:8px;background:#fff;box-shadow:2px 2px 0 var(--ink);cursor:pointer;font-size:16px;padding:5px 9px;opacity:.5;transition:all .1s}
.pv2-drow:hover .pv2-tool,body.pv2.tbi .pv2-tool{opacity:1}
.pv2-tool:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.pv2-tool.on{background:var(--m2);opacity:1}
.pv2-countdown{font-family:var(--font-bang);font-size:23px;letter-spacing:1px}
.pv2-timing{background:var(--m2)!important;animation:pv2-pulse 1s ease-in-out infinite}
@keyframes pv2-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
body.pv2.tbi .pv2-tool{font-size:17px;padding:8px 12px;min-height:48px}
/* tuiles tiroirs */
/* `color` explicite sur TOUT panneau a fond clair.
   ──────────────────────────────────────────────────────────────────
   Le shell pose `color:#E6F4FA` sur son conteneur marine — juste pour lui,
   mais herite par tout descendant qui ne redefinit pas la sienne. Ces
   panneaux-ci ont `background:#fff` : sans `color`, on obtenait du blanc
   bleute sur blanc, mesure a 1.12 de contraste (norme AA : 4.5). Le titre
   « MES TIROIRS » et le compte du tiroir etaient invisibles a l'oeil tout en
   etant presents dans le DOM — c'est ce qui a fait echouer la recherche du
   tiroir Jeux, y compris par l'auteur de l'app.
   On corrige ICI, pas dans le shell : celui-ci sert ~1489 pages et sa regle
   est correcte dans son propre contexte. */
.pv2-dock{width:100%;background:#fff;color:var(--ink);padding:14px 16px;margin-top:14px;border-radius:16px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.pv2-dock h6{font-family:var(--font-bang);font-size:18px;letter-spacing:1.5px;margin:0 0 10px}
.pv2-dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px}
.pv2-mod{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .1s;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;background-size:cover;background-position:center;position:relative}
.pv2-mod:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.pv2-mod .mico{font-size:34px;text-align:center;margin-top:10px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}
.pv2-mod .mlabel{background:#fff;color:var(--ink);border-top:3px solid var(--ink);padding:6px 4px;text-align:center;font-family:var(--font-bang);font-size:15px;line-height:1.05}
.pv2-mbadge{position:absolute;top:6px;right:6px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:8px;font-size:12px;font-weight:700;padding:2px 6px;box-shadow:2px 2px 0 var(--ink)}
.pv2-empty{border:3px dashed var(--ink);border-radius:14px;padding:26px;text-align:center;color:#777;font-weight:600;font-size:16px;background:#fffaf2;font-family:var(--font-fun)}
/* carnet d'évaluation (façon iDoceo, style maquette) */
.pv2-evtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.pv2-evdate{font-family:var(--font-bang);font-size:18px;letter-spacing:.5px;min-width:110px;text-align:center}
.pv2-evwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pv2-evtable{width:100%;border-collapse:separate;border-spacing:8px}
.pv2-evtable th{font-family:var(--font-impact);font-size:16px;border:3px solid var(--ink);border-radius:10px;padding:9px 6px;box-shadow:3px 3px 0 var(--ink);background:var(--m1);color:var(--mtxt);position:relative;min-width:96px}
.pv2-evtable th small{display:block;font-family:var(--font-fun);font-size:12.5px;opacity:.75;margin-top:2px}
.pv2-evtable th.n{background:var(--m2);color:#189AD3;min-width:110px}
body.pv2[data-metier="camp"] .pv2-evtable th.n{color:#fff}
.pv2-evx{position:absolute;top:4px;right:6px;border:none;background:none;color:inherit;opacity:.55;cursor:pointer;font-size:15px;font-weight:700}
.pv2-evx:hover{opacity:1}
.pv2-evname{border:3px solid var(--ink);border-radius:10px;background:#fff;box-shadow:3px 3px 0 var(--ink);padding:10px 13px;font-weight:700;font-size:19px;font-family:var(--font-fun)}
.pv2-evcell{border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);text-align:center;font-family:var(--font-bang);font-size:26px;cursor:pointer;user-select:none;padding:8px 5px;min-width:84px;transition:transform .08s}
.pv2-evcell:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.pv2-evcell:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.pv2-evlegend{font-weight:700;font-size:16px;font-family:var(--font-fun);margin:12px 0;opacity:.8}
.pv2-portrait{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.pv2-pcard{flex:1;min-width:170px;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:4px 4px 0 var(--ink);padding:10px 14px}
.pv2-pcard h6{font-family:var(--font-bang);font-size:16px;letter-spacing:.5px;margin:0 0 6px;color:#189AD3}
.pv2-pbar{display:flex;height:30px;border:3px solid var(--ink);border-radius:8px;overflow:hidden}
.pv2-pbar div{display:flex;align-items:center;justify-content:center;font-family:var(--font-bang);font-size:15px;min-width:0;overflow:hidden}
.pv2-pmeta{font-size:14px;color:#666;margin-top:5px;font-weight:700;font-family:var(--font-fun)}
.pv2-evadd{display:flex;gap:8px;margin-top:14px;align-items:center}
.pv2-evadd .p-input{max-width:320px}
body.pv2.tbi .pv2-evcell{min-width:88px;min-height:60px;font-size:26px}
/* planification séquentielle (maquette D1 : titre + cours alternés jaune/cyan) */
.pv2-sqtabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.pv2-sqtitle{border:4px solid var(--m1);border-radius:14px;padding:10px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:baseline;box-shadow:3px 3px 0 var(--ink);background:#fff}
.pv2-sqtitle b{font-family:var(--font-impact);color:var(--m2);text-shadow:1.5px 1.5px 0 var(--ink);font-size:20px;flex-shrink:0}
.pv2-sqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:760px){.pv2-sqgrid{grid-template-columns:1fr}}
.pv2-sq h5{font-family:var(--font-impact);text-align:center;margin:0 0 8px;font-size:19px;color:var(--m1);text-shadow:1.5px 1.5px 0 var(--ink)}
.pv2-sqdate{border:3px solid;border-radius:10px;padding:6px 11px;font-size:15px;margin-bottom:8px;box-shadow:2px 2px 0 var(--ink);background:#fff;font-family:var(--font-fun)}
.pv2-sqdate b{font-family:var(--font-bang)}
.pv2-sqbox{border:3px solid;border-radius:14px;min-height:110px;padding:10px 12px;font-size:15px;box-shadow:3px 3px 0 var(--ink);background:#fff;font-family:var(--font-fun)}
.pv2-sq .alt-y,.pv2-sqdate.alt-y,.pv2-sqbox.alt-y{border-color:var(--pv2-gold)}
.pv2-sqdate.alt-y b{color:var(--pv2-gold)}
.pv2-sq .alt-c,.pv2-sqdate.alt-c,.pv2-sqbox.alt-c{border-color:var(--m1)}
.pv2-sqdate.alt-c b{color:#189AD3}
.pv2-sqadd{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pv2-sqed{outline:none;cursor:text;white-space:pre-wrap;word-break:break-word;min-width:40px;display:inline-block;min-height:1em}
.pv2-sqed:focus{background:#fffbd6;border-radius:6px}
.pv2-sqed:empty:before{content:'…';color:#bbb}
.pv2-sqbox.pv2-sqed{display:block;min-width:0;width:auto;min-height:110px}
.pv2-sqtitle .pv2-sqed{flex:1;font-size:18px;font-weight:700;font-family:var(--font-fun)}
/* planification annuelle (1 ligne = 1 semaine, format gymnase) */
.pv2-anhead{display:flex;align-items:center;gap:18px;margin-bottom:10px}
.pv2-anhdays{display:grid;grid-template-columns:repeat(5,76px)}
.pv2-anhd{border:3px solid var(--ink);padding:9px 0;text-align:center;font-family:var(--font-impact);font-size:18px}
.pv2-anhd.y{background:var(--m2);color:#189AD3}
.pv2-anhd.c{background:var(--m1);color:var(--m2);text-shadow:1px 1px 0 var(--ink)}
.pv2-anweek{display:flex;align-items:center;gap:18px;margin-bottom:13px}
.pv2-andays{display:grid;grid-template-columns:repeat(5,76px)}
.pv2-and{border:3px solid var(--ink);padding:11px 0;text-align:center;font-family:var(--font-bang);font-size:26px;background:#fff}
.pv2-and.cy{color:#189AD3}
.pv2-and.yl{color:var(--pv2-gold)}
.pv2-and.off{background:#f4f4f4}
.pv2-anarr{font-size:32px}
.pv2-anbar{flex:1;background:#EFEFEF;border:3px solid var(--ink);border-radius:16px;padding:15px 19px;display:flex;gap:14px;font-size:20px;box-shadow:4px 4px 0 var(--ink);flex-wrap:wrap;align-items:baseline}
.pv2-anbar b{font-family:var(--font-bang);font-size:19px;letter-spacing:1px;flex-shrink:0}
.pv2-anbar .la{color:var(--pv2-gold)}
.pv2-anbar .lc{color:#189AD3}
.pv2-anbar .ed{flex:1;min-width:130px;font-weight:600;font-family:var(--font-fun);background:#fff;border-radius:8px;padding:2px 8px}
@media(max-width:860px){
  .pv2-anhdays,.pv2-andays{grid-template-columns:repeat(5,44px)}
  .pv2-and{font-size:18px;padding:7px 0}
  .pv2-anhd{font-size:13px;padding:6px 0}
  .pv2-anarr{display:none}
  .pv2-anweek{flex-wrap:wrap;gap:8px}

/* impression : la feuille affichée devient l'imprimable (bouton 🖨️ PDF) */
@media print{
  body.pv2{background:#fff!important;padding:0!important}
  body.pv2 .pv2-topbar,body.pv2 .pv2-subrow,body.pv2 .pv2-gpanel,body.pv2 .pv2-tbibtn,
  body.pv2 .pv2-dock,body.pv2 #v2-toast,body.pv2 .pv2-sqtabs,body.pv2 .pv2-sqadd,body.pv2 .pv2-note{display:none!important}
  body.pv2 .pv2-app{border:none;box-shadow:none;min-height:0}
  body.pv2 .pv2-sheet{box-shadow:none;border-width:2px}
  body.pv2 .pv2-main{padding:0}
}
/* TBI + toast */
.pv2-tbibtn{position:fixed;bottom:14px;right:14px;z-index:360;font-size:16px;padding:9px 14px;background:#fff}
body.pv2.tbi{zoom:1.4;padding:8px!important}
body.pv2.tbi .pv2-act{font-size:19px;padding:13px 22px;min-height:60px}
body.pv2.tbi .pv2-act.sm{font-size:17px;padding:9px 17px;min-height:48px}
body.pv2.tbi .pv2-gopt,body.pv2.tbi .pv2-fait{min-height:60px}
#v2-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:400}
.pv2-toast-in{border:3px solid var(--ink);border-radius:10px;background:#fff;box-shadow:4px 4px 0 var(--ink);padding:10px 16px;font-weight:600;font-size:13.5px;font-family:var(--font-fun)}
@media(max-width:760px){
  .pv2-body{flex-direction:column}
  .pv2-gpanel{width:100%;border-left:none;border-top:4px solid var(--ink)}
  .pv2-drawer{top:auto;bottom:0;right:0;left:0;width:100%;border-radius:18px 18px 0 0}
  .pv2-drow{grid-template-columns:74px 90px 1fr 62px}
}

/* ═══ TIROIR JEUX — panneau par-dessus la journée (on ne quitte jamais le calendrier) ═══ */
.tiroir{position:fixed;inset:0;z-index:400;display:none;background:rgba(26,26,46,.55)}
.tiroir.open{display:block}
.tiroir__panel{
  position:absolute;top:0;right:0;bottom:0;width:min(540px,100%);
  background:var(--paper);border-left:5px solid var(--ink);
  box-shadow:-8px 0 0 rgba(26,26,46,.35);
  display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
  padding:var(--space-4) var(--space-3) calc(var(--space-4) + env(safe-area-inset-bottom));
  animation:tiroir-in .22s cubic-bezier(.34,1.3,.64,1);
}
@keyframes tiroir-in{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
.tiroir__head{position:relative;border-bottom:4px solid var(--ink);padding-bottom:var(--space-2);margin-bottom:var(--space-3);
  background:linear-gradient(120deg,color-mix(in srgb,var(--metier-1) 14%,transparent),color-mix(in srgb,var(--metier-2) 14%,transparent));border-radius:var(--r-2);padding:var(--space-3)}
.tiroir__title{font-family:var(--font-impact);font-size:var(--fs-4);color:var(--metier-1);text-shadow:2px 2px 0 rgba(26,26,46,.18)}
.tiroir__slot{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2);color:var(--metier-2);margin-top:2px}
.tiroir__close{position:absolute;top:10px;right:10px;padding:6px 12px;font-size:var(--fs-2);line-height:1}
.tiroir__count{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);color:var(--ink);opacity:.75;margin:2px 2px var(--space-2)}
.tiroir__list{display:flex;flex-direction:column;gap:var(--space-2)}
.tiroir__row{display:flex;align-items:center;gap:var(--space-2);background:#fff;border:3px solid var(--ink);
  border-radius:var(--r-2);box-shadow:var(--ombre);padding:10px 12px}
.tiroir__row-main{flex:1;min-width:0}
.tiroir__row-titre{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2);line-height:1.2}
.tiroir__row-meta{font-family:var(--font-body);font-size:var(--fs-1);opacity:.65;margin-top:2px}
.tiroir__add{flex-shrink:0;font-size:var(--fs-1);white-space:nowrap}
.tiroir__msg{text-align:center;font-family:var(--font-fun);font-weight:700;padding:var(--space-4);opacity:.75;display:flex;flex-direction:column;gap:var(--space-2);align-items:center}
/* Filtres : gros choix simples ; chip active = violet Pop Art */
.tiroir__filtres{margin-bottom:var(--space-3)}
.tiroir__frow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tiroir__chip{font-size:var(--fs-1);padding:8px 14px}
.tiroir__chip.on{background:var(--metier-2);color:#fff}
.tiroir__search summary{cursor:pointer;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);opacity:.6;padding:2px}
.tiroir__search[open] summary{opacity:1}
.tiroir__search .p-input{margin-top:6px}
/* Mobile-first : plein écran sous 720px */
@media(max-width:720px){
  .tiroir__panel{width:100%;border-left:none}
  .tiroir__row{flex-direction:column;align-items:stretch}
  .tiroir__add{width:100%;text-align:center}
}
/* Flash BD du bloc fraîchement inséré depuis le tiroir */
.p-bloc--flash{animation:p-bloc-flash .9s cubic-bezier(.34,1.56,.64,1) 1}
@keyframes p-bloc-flash{
  0%{transform:scale(.94);box-shadow:0 0 0 0 transparent}
  30%{transform:scale(1.03);box-shadow:0 0 0 6px color-mix(in srgb,var(--metier-1) 55%,transparent),8px 8px 0 var(--metier-2)}
  60%{transform:scale(1);box-shadow:0 0 0 4px color-mix(in srgb,var(--metier-2) 40%,transparent),var(--ombre)}
  100%{transform:scale(1);box-shadow:var(--ombre)}
}
/* Trou libre dans la timeline → ouvre le tiroir sur ce créneau */
.p-trou{display:block;width:100%;text-align:center;padding:10px 12px;cursor:pointer;
  font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);color:var(--metier-1);
  background:color-mix(in srgb,var(--metier-1) 6%,transparent);border:3px dashed var(--metier-1);border-radius:var(--r-2);
  transition:all .12s}
.p-trou:hover{background:color-mix(in srgb,var(--metier-2) 10%,transparent);border-color:var(--metier-2);color:var(--metier-2);transform:translate(-2px,-2px)}
  </style>
</head>
<body data-metier="camp">

  <button id="ztsExitFs" type="button" title="Rétrécir" onclick="try{parent.postMessage({type:'zts-exitfullscreen'},'*')}catch(e){};try{(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document)}catch(e){}">⤡ Rétrécir</button>

  <div class="p-perso" aria-hidden="true"></div>

  <div data-zts-header></div>

  <nav class="zts-subnav">
    <a href="../../index.html" data-i18n="subnav.back_home">&larr; Accueil</a>
  </nav>

  <main class="zts-container" style="padding-top:var(--space-5);padding-bottom:var(--space-7);">
    <!-- L'étiquette disait « Camp de jour » EN DUR, quel que soit `?metier=`.
         Un prof d'ÉPS arrivant de l'accueil lisait « Camp de jour » sur une app
         qui, elle, avait bien lu son métier (body[data-metier] était correct).
         Elle est maintenant écrite par `poseLibelleMetier()`, plus bas. -->
    <section class="zts-metier-banner" style="margin-bottom:var(--space-5);">
      <div>
        <span class="zts-metier-banner__pill" id="pMetierPill">Camp de jour</span>
        <h1 style="margin-top:8px;">Planificateur quotidien</h1>
      </div>
    </section>

    <div id="app-root">
      <div class="p-empty"><div class="p-empty-text">Chargement...</div></div>
    </div>
  </main>

  <!-- Modal: Enfant -->
  <div class="zts-modal" id="modal-enfant" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="zts-modal__inner" id="modal-enfant-inner"></div>
  </div>

  <!-- Modal: Depart -->
  <div class="zts-modal" id="modal-depart" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="zts-modal__inner" id="modal-depart-inner"></div>
  </div>

  <!-- Modal: Bloc -->
  <div class="zts-modal" id="modal-bloc" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="zts-modal__inner" id="modal-bloc-inner"></div>
  </div>

  <!-- Modal: Appliquer gabarit -->
  <div class="zts-modal" id="modal-messages" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="zts-modal__inner" id="modal-messages-inner"></div>
  </div>

  <div class="zts-modal" id="modal-eval" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="zts-modal__inner" id="modal-eval-inner"></div>
  </div>

  <div class="zts-modal" id="modal-presences" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="zts-modal__inner" id="modal-presences-inner"></div>
  </div>

  <div class="zts-modal" id="modal-appliquer" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="zts-modal__inner" id="modal-appliquer-inner"></div>
  </div>

  <!-- Tiroir : choisir un jeu (par-dessus la journée) -->
  <div class="tiroir" id="tiroir-jeux" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Choisir un jeu">
    <div class="tiroir__panel"></div>
  </div>

  <!-- v2 : résumé de date (clic sur une case du calendrier mensuel) -->
  <div class="pv2-backdrop" id="v2-backdrop"></div>
  <div class="pv2-drawer" id="v2-daysum" role="dialog" aria-modal="true">
    <div class="pv2-dhd"><h4 data-ds-title>📆</h4>
      <button class="zts-action pv2-act sm" data-action="v2-close-daysum">✕</button></div>
    <div data-ds-body style="overflow-y:auto;padding-bottom:14px;"></div>
    <div style="padding:12px 14px;border-top:3px solid var(--ink);text-align:right;">
      <button class="zts-action pv2-act sm prim" data-action="v2-open-jour">☀️ Ouvrir la planif du jour ➜</button>
    </div>
  </div>

  <!-- Sync indicator -->
  <div id="sync-bar" class="p-sync"></div>

  <div data-zts-footer></div>

  <script src="../../shared/zts.js"></script>
  <!-- Verrou d'inscription — LOT 1 vague A, 2026-08-13.
       Le planificateur etait l'une des 7 apps sans aucun verrou, alors qu'il
       est l'outil le plus lourd du site et qu'il est expose par le pied de page
       partage (~1489 pages). Meme patron que les 11 apps deja gardees.
       Le mur est independant de D24 : il se pose par-dessus l'app, quel que
       soit le mode (`?v2=1` plein ecran ou normal avec en-tete partage). -->
  <script src="/zts-lock-page.js" defer></script>
  <script src="/firebase-auth.js" defer></script>
  <script src="/zts-locked-fullscreen.js" defer></script>
  <script src="/zts-funnel.js" defer></script>
  <!-- Doit venir AVANT dataStore.js, qui appelle window.ZTSBanques. -->
  <script src="/zts-banques.js" defer></script>
  <script src="dataStore.js" defer></script>
  <script src="tiroir-jeux.js" defer></script>
  <script src="semaine-grid.js" defer></script>
  <script src="app.js" defer></script>
  <script src="app-v2.js" defer></script>

  <!-- LE LIBELLÉ DU MÉTIER, AVANT CONNEXION.
       L'app sert trois métiers mais s'annonçait « Camp de jour » partout :
       l'étiquette de la bannière et le <title> de l'onglet étaient en dur.
       Ce bloc les aligne sur le métier réel, celui que `?metier=` a posé sur
       `body[data-metier]`.

       POURQUOI ICI ET PAS DANS app.js : cet écran-là est ce qu'on voit AVANT
       de se connecter, et `init()` n'a pas encore tourné. Le script est donc
       autonome et ne dépend d'aucun état de l'app — comme la date du jour de
       l'accueil, isolée pour la même raison. Après connexion, la coquille v2
       masque cette bannière (`body.pv2 .zts-metier-banner{display:none}`) et
       gère le métier avec ses propres boutons : ce bloc ne la contredit pas.

       Le <title> est indexé : on garde « Planificateur » en tête pour ne pas
       casser la recherche, le métier vient en précision. -->
  <script>(function(){
    var LIB = {
      ep:   { fr:'Éducation physique', en:'Physical education' },
      camp: { fr:'Camp de jour',       en:'Day camp' },
      sdg:  { fr:'Service de garde',   en:'Daycare' }
    };
    function pose(){
      var m = document.body.getAttribute('data-metier');
      var l = LIB[m]; if(!l) return;
      var en = (typeof ztsLang !== 'undefined' && ztsLang === 'en');
      var nom = en ? l.en : l.fr;
      var pill = document.getElementById('pMetierPill');
      if (pill) pill.textContent = nom;
      document.title = (en ? 'Planner — ' : 'Planificateur — ') + nom + ' | Zone Total Sport';
    }

    // Le trait de section du patron, sous le titre de la bannière.
    function poseTrait(){
      var b = document.querySelector('.zts-metier-banner > div');
      if (!b || b.querySelector('.ztsp-sectrait')) return;
      var t = document.createElement('div');
      t.className = 'ztsp-sectrait'; t.setAttribute('aria-hidden','true');
      b.appendChild(t);
    }

    // LA MASCOTTE SE CACHAIT DERRIÈRE LE BANDEAU. `.p-perso` est en
    // `position:fixed; top:88px` — 88 px était la hauteur de l'ancien en-tête.
    // Celui du patron en fait plus de 300, et la mascotte disparaissait
    // dessous. On ne remet pas une autre valeur en dur : c'est
    // `adjustHeaderOffset()` (shared/zts.js) qui mesure l'en-tête et écrit le
    // resultat dans `body.paddingTop`. On s'aligne sur ce calcul, donc sur la
    // hauteur reelle, quelle que soit la densite de l'en-tete.
    function caleMascotte(){
      var p = document.querySelector('.p-perso'); if (!p) return;
      var h = parseFloat(getComputedStyle(document.body).paddingTop) || 88;
      p.style.top = Math.round(h + 12) + 'px';
    }
    // `init()` d'app.js lit `?metier=` et réécrit data-metier. Il est en `defer`
    // donc il a déjà tourné quand ce script s'exécute — mais il attend aussi la
    // base et l'authentification. On pose une fois tout de suite, et on suit
    // l'attribut ensuite : c'est le seul contrat stable entre les deux.
    pose(); poseTrait(); caleMascotte();
    try {
      new MutationObserver(pose).observe(document.body, {
        attributes: true, attributeFilter: ['data-metier']
      });
    } catch(e) {}
    // `adjustHeaderOffset` recalcule au chargement des polices et au
    // redimensionnement : on le suit aux deux moments.
    window.addEventListener('load', caleMascotte);
    window.addEventListener('resize', caleMascotte);
  })();</script>
</body>
