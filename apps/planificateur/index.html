<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificateur Camp de jour — Zone Total Sport</title>
  <meta name="description" content="Planificateur quotidien clé en main pour camps de jour. Grilles, présences, activités. Gratuit.">
  <link rel="icon" type="image/png" href="https://zonetotalsport.ca/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <!-- Polices Google (mêmes que le design system) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

  <!-- DESIGN SYSTEM PARTAGÉ (chemin depuis /apps/planificateur/) -->
  <link rel="stylesheet" href="../../shared/zts.css">

  <style>
    /* Espace pour le conteneur principal de l'app */
    .planif-root {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      text-align: center;
      padding: var(--space-5) var(--space-3);
    }
    .planif-root__status {
      font-family: var(--font-impact);
      font-size: var(--fs-4);
      color: var(--ink);
    }
    .planif-root__detail {
      font-family: var(--font-body);
      font-size: var(--fs-2);
      opacity: .85;
      max-width: 480px;
    }
    #smoke-result {
      margin-top: var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: var(--cream);
      border: var(--bord);
      border-radius: var(--r-2);
      box-shadow: var(--ombre);
      font-family: var(--font-body);
      font-size: var(--fs-1);
      text-align: left;
      max-width: 600px;
      width: 100%;
      white-space: pre-wrap;
      display: none;
    }
  </style>
</head>
<body data-metier="camp">

  <!-- Header injecté automatiquement -->
  <div data-zts-header></div>

  <!-- Sous-nav retour -->
  <nav class="zts-subnav">
    <a href="../../index.html" data-i18n="subnav.back_home">← Accueil</a>
  </nav>

  <!-- Bannière métier -->
  <main class="zts-container" style="padding-top:var(--space-5); padding-bottom:var(--space-7);">
    <section class="zts-metier-banner" style="margin-bottom:var(--space-5);">
      <div>
        <span class="zts-metier-banner__pill">Camp de jour</span>
        <h1 style="margin-top:8px;">Planificateur quotidien</h1>
      </div>
    </section>

    <!-- Conteneur principal — les vrais écrans arrivent en étape 2 -->
    <div class="planif-root" id="app-root">
      <div class="planif-root__status" id="app-status">Chargement...</div>
      <div class="planif-root__detail" id="app-detail">Connexion à Firestore en cours.</div>
      <div id="smoke-result"></div>
    </div>
  </main>

  <!-- Footer injecté automatiquement -->
  <div data-zts-footer></div>

  <!-- Utilitaires partagés (header/footer, i18n, modales, thème) -->
  <script src="../../shared/zts.js"></script>

  <!-- Auth Firebase (version racine, pas de copie) -->
  <script src="/firebase-auth.js" defer></script>

  <!-- App module -->
  <script src="app.js" type="module"></script>
</body>
</html>
