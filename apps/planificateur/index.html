<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificateur Camp de jour — Zone Total Sport</title>
  <meta name="description" content="Planificateur quotidien pour camps de jour. Roster, presences, departs. Gratuit.">
  <link rel="icon" type="image/png" href="https://zonetotalsport.ca/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/zts.css">
  <style>
/* ═══ PLANIFICATEUR — styles app ═══ */

/* Mode intégré (iframe dans un hub) : on cache le header/subnav/perso du planificateur */
body.zts-embed [data-zts-header], body.zts-embed .zts-subnav, body.zts-embed .p-perso, body.zts-embed [data-zts-footer], body.zts-embed .zts-footer { display:none !important; }
body.zts-embed { padding-top:6px !important; background:transparent !important; }
html:has(body.zts-embed) { background:transparent !important; }   /* html a un fond paper → transparent en intégré */
body.zts-embed[data-metier]{ background-image:none !important; }
/* Cache le fond gymnase PROPRE au planificateur en mode intégré → un seul fond (celui du hub) */
body.zts-embed::before, body.zts-embed::after, body.zts-embed[data-metier]::before, body.zts-embed[data-metier]::after { display:none !important; background:none !important; }
/* Intégré : le contenu remplit toute la largeur (le calendrier s'adapte à l'écran : ordi/tablette/iPhone) */
body.zts-embed main.zts-container { max-width:none !important; padding-left:clamp(4px,1vw,14px) !important; padding-right:clamp(4px,1vw,14px) !important; }
/* Cases du calendrier : remplissent la largeur, hauteur raisonnable et fluide (pas de carrés géants) */
body.zts-embed .p-cal-day { aspect-ratio:auto; min-height:clamp(52px,6vw,96px); padding:clamp(6px,1.2vw,16px) 4px; }
/* Fond blanc retiré → le gymnase transparaît ; numéros de dates en blanc avec contour pour la lisibilité */
body.zts-embed .p-cal-day { background:transparent; color:#fff; text-shadow:1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 0 2px 4px rgba(0,0,0,.55); }
body.zts-embed .p-cal-day:hover { background:rgba(0,0,0,.18); }
body.zts-embed .p-cal-day--today { background:var(--orange); color:#fff; }
body.zts-embed .p-cal-header { color:#fff; text-shadow:1px 1px 0 var(--ink), -1px -1px 0 var(--ink); }
/* Bouton « Rétrécir » : visible uniquement en plein écran */
#ztsExitFs { display:none; position:fixed; top:14px; right:14px; z-index:99999; align-items:center; gap:6px; font-family:var(--font-impact); font-size:1rem; padding:10px 18px; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink); cursor:pointer; box-shadow:4px 4px 0 var(--ink); }
#ztsExitFs:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
body.zts-full #ztsExitFs { display:inline-flex; }
/* Aplatit la vue Semaine : pas de swirl ni de feuille en double (un seul encadré = celui du hub) */
body.zts-embed .sem-root { background:transparent !important; padding:4px !important; }
body.zts-embed .sem-root .sheet { background:transparent !important; border:none !important; box-shadow:none !important; padding:4px !important; max-width:none !important; }
/* PLEIN ÉCRAN (classe ajoutée par le hub) : fond bleu+jaune + UN encadré blanc autour de la vue */
body.zts-embed.zts-full { background:linear-gradient(180deg, rgba(255,254,247,.55) 0%, rgba(255,254,247,.4) 40%, rgba(255,254,247,.62) 100%), url('/bg-gym.jpg') center/cover fixed !important; padding:18px !important; overflow:auto; }
body.zts-embed.zts-full #app-root { background:#fff; border:5px solid var(--ink); border-radius:24px; box-shadow:10px 10px 0 var(--ink); max-width:1320px; margin:0 auto; padding:clamp(14px,2vw,28px); min-height:calc(100dvh - 36px); }

/* Fond de marque SWIRL jaune+cyan UNIFORME sur toute la page (rayons larges depuis le coin bas-droit) */
body[data-metier]{
  background-color:var(--cyan);
  background-image:repeating-conic-gradient(from 8deg at 92% 97%,var(--jaune) 0deg 12deg,var(--cyan) 12deg 24deg);
  background-attachment:fixed;
}
.zts-container{position:relative;z-index:1}
/* Personnage EN HAUT À DROITE, interactif : survol = wiggle + bulle de bienvenue par métier */
.p-perso{
  position:fixed;top:88px;right:12px;width:clamp(92px,11vw,168px);aspect-ratio:3/4;
  background-size:contain;background-repeat:no-repeat;background-position:top center;
  z-index:40;cursor:pointer;filter:drop-shadow(4px 5px 0 rgba(0,0,0,.4));
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.p-perso:hover{transform:translateY(-6px) rotate(-5deg) scale(1.06);animation:p-perso-wiggle .5s ease-in-out .25s 1}
@keyframes p-perso-wiggle{0%,100%{transform:translateY(-6px) rotate(-5deg) scale(1.06)}25%{transform:translateY(-6px) rotate(4deg) scale(1.06)}75%{transform:translateY(-6px) rotate(-7deg) scale(1.06)}}
/* Bulle de salutation, à GAUCHE du perso (il est collé à droite de l'écran) */
.p-perso::after{
  content:'';position:absolute;right:94%;top:8px;opacity:0;
  transform:translateX(12px) scale(.9);transform-origin:right center;
  transition:opacity .2s,transform .2s;pointer-events:none;
  width:max-content;max-width:min(260px,62vw);white-space:normal;text-align:left;
  font-family:'Fredoka',system-ui,sans-serif;font-weight:700;font-size:.98rem;line-height:1.25;color:var(--ink);
  background:#fff;border:4px solid var(--ink);border-radius:16px;padding:10px 14px;box-shadow:5px 5px 0 var(--ink);
}
.p-perso:hover::after{opacity:1;transform:translateX(0) scale(1)}
body[data-metier="ep"]   .p-perso{background-image:url('img/mascotte-ep.png')}
body[data-metier="camp"] .p-perso{background-image:url('img/mascotte-camp.png')}
body[data-metier="sdg"]  .p-perso{background-image:url('img/mascotte-sdg.png')}
body[data-metier="ep"]   .p-perso::after{content:'Bienvenue dans la section éducation physique ! 🏀'}
body[data-metier="camp"] .p-perso::after{content:'Bienvenue dans la section camps de jour ! ⛺'}
body[data-metier="sdg"]  .p-perso::after{content:'Bienvenue dans la section service de garde ! 🧸'}
@media(max-width:900px){.p-perso{display:none}}

/* Group bar */
.p-group-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-4);padding:var(--space-3) var(--space-4);background:var(--cream);border:var(--bord);border-radius:var(--r-2);box-shadow:var(--ombre)}
.p-group-name{font-family:var(--font-impact);font-size:var(--fs-3)}
.p-group-theme{font-family:var(--font-fun);font-size:var(--fs-1);opacity:.7}

/* Secondary nav */
.p-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--space-4)}
.p-nav-btn{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);padding:8px 14px;border:var(--bord);border-radius:var(--r-2);background:#fff;cursor:pointer;box-shadow:var(--ombre);transition:all .12s}
.p-nav-btn:hover{transform:translateY(-2px);box-shadow:var(--ombre-xl)}
.p-nav-btn.active{background:var(--orange);color:#fff}

/* Card */
.p-card{background:#fff;border:var(--bord-gros);border-radius:var(--r-3);box-shadow:var(--ombre-xl);padding:var(--space-4)}

/* Form */
.p-field{margin-bottom:var(--space-3)}
.p-label{display:block;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2);margin-bottom:var(--space-2)}
.p-input,.p-select{width:100%;padding:12px 16px;border:var(--bord);border-radius:var(--r-2);font-family:var(--font-body);font-size:var(--fs-2);background:#fff;box-sizing:border-box}
.p-input:focus,.p-select:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px rgba(255,107,0,.2)}

/* Avatar */
.p-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:var(--bord);box-shadow:var(--ombre)}
.p-photo-sm{width:50px;height:50px}
.p-initials{width:80px;height:80px;border-radius:50%;border:var(--bord);box-shadow:var(--ombre);display:flex;align-items:center;justify-content:center;font-family:var(--font-impact);font-size:var(--fs-4);background:var(--cream);color:var(--ink);flex-shrink:0}
.p-initials-sm{width:50px;height:50px;font-size:var(--fs-2)}

/* Enfants grid (roster) */
.p-enfants-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--space-3);margin-bottom:var(--space-4)}
.p-enfant-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:var(--space-3);background:#fff;border:var(--bord);border-radius:var(--r-2);box-shadow:var(--ombre);cursor:pointer;transition:transform .15s;text-align:center}
.p-enfant-card:hover{transform:translateY(-3px);box-shadow:var(--ombre-xl)}
.p-enfant-name{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2)}
.p-enfant-sub{font-family:var(--font-body);font-size:var(--fs-1);opacity:.6}

/* Presence grid */
.p-presence-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:var(--space-3);margin:var(--space-3) 0}
.p-pcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-3) var(--space-2);border:4px solid #ccc;border-radius:var(--r-2);box-shadow:var(--ombre);cursor:pointer;transition:all .12s;text-align:center;background:#fff;position:relative;user-select:none;-webkit-user-select:none}
.p-pcard:active{transform:scale(.95)}
.p-pcard-tap{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;width:100%}
.p-arrive{margin-top:6px;width:100%;font-family:var(--font-fun);font-weight:700;font-size:clamp(10px,1.2vw,12px);cursor:pointer;background:var(--cream);border:2px solid var(--ink);border-radius:var(--r-pill);box-shadow:2px 2px 0 var(--ink);padding:3px 6px}
.p-arrive:hover{background:var(--jaune)}
.p-pcard--attendu{opacity:.5;border-color:#bbb}
.p-pcard--attendu .p-photo,.p-pcard--attendu .p-initials{filter:saturate(.2)}
.p-pcard--present{border-color:var(--vert);opacity:1}
.p-pcard--parti{border-color:#999}
.p-pcard--parti .p-photo,.p-pcard--parti .p-initials{filter:grayscale(1)}
.p-pcard--absent{border-color:var(--rose);opacity:.55}
.p-pcard-time{font-family:var(--font-body);font-size:clamp(11px,1.4vw,13px);font-weight:700}
.p-pcard-badge{position:absolute;top:-8px;right:-8px;font-family:var(--font-impact);font-size:clamp(10px,1.2vw,12px);padding:2px 8px;border:2px solid var(--ink);border-radius:var(--r-pill);box-shadow:2px 2px 0 var(--ink)}
.p-badge-present{background:var(--vert)}
.p-badge-absent{background:var(--rose);color:#fff}
.p-badge-parti{background:#ddd}
.p-badge-flag{background:var(--jaune)}
/* Particularités (mini sous le nom) */
.p-partic-row{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:1px;line-height:1}
.p-partic-mini{font-size:clamp(13px,1.6vw,16px);line-height:1;cursor:help}
/* "!" message-parent flag (coin photo) */
.p-msg-flag{position:absolute;top:-9px;left:-9px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--font-impact);font-size:17px;background:var(--jaune);color:var(--ink);border:2px solid var(--ink);border-radius:50%;box-shadow:2px 2px 0 var(--ink);z-index:4;animation:p-msgpulse 1.2s ease-in-out infinite}
@keyframes p-msgpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* Summary */
.p-summary{display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:center;margin-bottom:var(--space-3)}
.p-summary-item{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);padding:4px 12px;border:var(--bord);border-radius:var(--r-pill);box-shadow:2px 2px 0 var(--ink);background:#fff}

/* Depart persons */
.p-depart-persons{display:flex;flex-wrap:wrap;gap:10px;margin:var(--space-3) 0}
.p-depart-person{display:inline-flex;align-items:center;gap:6px;padding:14px 20px;border:var(--bord);border-radius:var(--r-2);background:var(--cream);cursor:pointer;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2);box-shadow:var(--ombre);transition:all .15s}
.p-depart-person:hover{transform:translateY(-2px);box-shadow:var(--ombre-xl)}
.p-depart-person.selected{background:var(--orange);color:#fff}

/* Warning */
.p-warning{background:rgba(255,45,135,.12);border:2px solid var(--rose);border-radius:var(--r-2);padding:var(--space-3);font-family:var(--font-body);font-size:var(--fs-2);font-weight:700;margin:var(--space-3) 0;display:none}
.p-warning.show{display:block}

/* Particularités chips (modal enfant) */
.p-partic-chips{display:flex;flex-wrap:wrap;gap:8px}
.p-partic-chip{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);padding:6px 12px;border:2px solid var(--ink);border-radius:var(--r-pill);background:#fff;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:all .12s;user-select:none}
.p-partic-chip:hover{transform:translateY(-1px)}
.p-partic-chip.on{background:var(--cyan);color:var(--ink)}

/* Journal de bord (modal depart) */
.p-humeur-row{display:flex;gap:10px;flex-wrap:wrap;margin:var(--space-2) 0}
.p-humeur-btn{flex:1;min-width:90px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:2px solid var(--ink);border-radius:var(--r-2);background:#fff;cursor:pointer;font-family:var(--font-fun);font-weight:700;box-shadow:2px 2px 0 var(--ink);transition:all .12s}
.p-humeur-emoji{font-size:clamp(20px,2.6vw,28px);line-height:1}
.p-humeur-lbl{font-size:var(--fs-1)}
.p-humeur-btn:hover{transform:translateY(-2px)}
.p-humeur-btn.on{background:var(--hc,var(--jaune));box-shadow:3px 3px 0 var(--ink)}
.p-msgparent-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--font-body);font-weight:700;font-size:var(--fs-2);background:rgba(255,234,0,.18);border:2px solid var(--jaune);border-radius:var(--r-2);padding:var(--space-3);margin:var(--space-3) 0}
.p-msgparent-toggle input{width:20px;height:20px;cursor:pointer;flex-shrink:0}

/* Messagerie coordo ↔ animateur */
.p-msg-bell.has-unread{animation:p-msgpulse 1s ease-in-out infinite}
.p-msg-badge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-family:var(--font-impact);font-size:11px;background:var(--rose);color:#fff;border:2px solid var(--ink);border-radius:var(--r-pill);box-shadow:1px 1px 0 var(--ink)}
.p-msg-dot{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;margin-left:6px;font-family:var(--font-impact);font-size:11px;background:var(--rose);color:#fff;border:2px solid var(--ink);border-radius:var(--r-pill);vertical-align:middle}
.p-msg-mini-btn{flex-shrink:0;display:inline-flex;align-items:center;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);padding:4px 10px;border:2px solid var(--ink);border-radius:var(--r-pill);background:var(--cream);cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:all .12s}
.p-msg-mini-btn:hover{background:var(--cyan);transform:translateY(-1px)}
.p-msg-thread-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto}
.p-msg-thread-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:2px solid var(--ink);border-radius:var(--r-2);background:#fff;cursor:pointer;box-shadow:2px 2px 0 var(--ink);font-family:var(--font-body);text-align:left;transition:all .12s}
.p-msg-thread-row:hover{transform:translateY(-2px);background:var(--cream)}
.p-msg-thread-titre{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2)}
.p-msg-thread-meta{display:flex;align-items:center;gap:4px;font-size:var(--fs-1);opacity:.7;flex-shrink:0}
.p-msg-back{background:none;border:none;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2);cursor:pointer;color:var(--ink);padding:0;margin-bottom:2px}
.p-msg-body{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow-y:auto;padding:var(--space-2) 2px;margin:var(--space-2) 0}
.p-msg-bubble{max-width:82%;padding:8px 12px;border:2px solid var(--ink);border-radius:var(--r-2);box-shadow:2px 2px 0 var(--ink);font-family:var(--font-body)}
.p-msg-bubble.mine{align-self:flex-end;background:var(--cyan)}
.p-msg-bubble.them{align-self:flex-start;background:var(--jaune)}
.p-msg-who{font-size:clamp(10px,1.2vw,12px);font-weight:700;opacity:.6;margin-bottom:2px}
.p-msg-text{font-size:var(--fs-2);white-space:pre-wrap;word-break:break-word}
.p-msg-compose{display:flex;gap:8px;align-items:flex-end}
.p-msg-compose textarea{flex:1;resize:vertical}

/* Évaluation PFEQ — tableau élèves × critères */
.p-eval-wrap{overflow-x:auto;border:3px solid var(--ink);border-radius:var(--r-2);box-shadow:var(--ombre);background:#fff;-webkit-overflow-scrolling:touch}
.p-eval-table{border-collapse:collapse;width:100%;font-family:var(--font-body)}
.p-eval-table th,.p-eval-table td{border:1px solid #e0e3e8;padding:8px;text-align:center;vertical-align:middle}
.p-eval-sticky{position:sticky;left:0;z-index:2;background:#fff}
.p-eval-name{min-width:130px;text-align:left!important;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1)}
.p-eval-name .p-photo-sm,.p-eval-name .p-initials-sm{display:inline-block;vertical-align:middle;margin-right:6px}
.p-eval-col{min-width:88px;background:var(--cream)}
.p-eval-colh{display:flex;align-items:flex-start;gap:4px;justify-content:center;font-family:var(--font-fun);font-weight:700;font-size:clamp(11px,1.3vw,13px);line-height:1.15}
.p-eval-colx{flex-shrink:0;border:none;background:none;color:var(--rose);cursor:pointer;font-size:13px;font-weight:700;padding:0 2px}
.p-eval-coltype{font-family:var(--font-body);font-size:clamp(9px,1.1vw,11px);opacity:.55;margin-top:2px}
.p-eval-cell{cursor:pointer;font-family:var(--font-impact);font-size:clamp(13px,1.7vw,17px);min-width:64px;transition:background .1s;user-select:none}
.p-eval-cell:hover{background:var(--jaune)}
.p-eval-cell.has-val{background:#eafff0}
.p-eval-cell .p-eval-val{pointer-events:none}

/* History */
.p-history-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border:var(--bord);border-radius:var(--r-2);box-shadow:var(--ombre);background:#fff;margin-bottom:var(--space-3)}
.p-history-date{font-family:var(--font-impact);font-size:var(--fs-2);min-width:90px;flex-shrink:0}
.p-history-detail{font-family:var(--font-body);font-size:var(--fs-1);flex:1}
.p-history-flag{display:inline-block;padding:2px 8px;border-radius:var(--r-pill);font-family:var(--font-impact);font-size:clamp(10px,1.2vw,12px);background:var(--rose);color:#fff;border:2px solid var(--ink)}

/* Photo upload */
.p-photo-upload{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}
.p-photo-preview{width:120px;height:120px;border-radius:50%;border:var(--bord-gros);box-shadow:var(--ombre-xl);overflow:hidden;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer}
.p-photo-preview img{width:100%;height:100%;object-fit:cover}

/* Autorise rows */
.p-autorise-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.p-autorise-row .p-input{flex:1}
.p-autorise-remove{width:36px;height:36px;border:var(--bord);border-radius:50%;background:var(--rose);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* Sync bar */
.p-sync{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:6px 16px;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);text-align:center;transition:transform .3s;transform:translateY(100%)}
.p-sync--offline{background:var(--rose);color:#fff;transform:translateY(0)}
.p-sync--syncing{background:var(--jaune);color:var(--ink);transform:translateY(0)}

/* Empty / Welcome */
.p-empty{text-align:center;padding:var(--space-5);opacity:.6}
.p-empty-icon{font-size:48px;margin-bottom:var(--space-2)}
.p-empty-text{font-family:var(--font-fun);font-size:var(--fs-2)}
.p-welcome{text-align:center;max-width:500px;margin:0 auto}
.p-welcome h2{font-family:var(--font-impact);font-size:var(--fs-5);margin-bottom:var(--space-3)}
.p-welcome p{font-family:var(--font-body);font-size:var(--fs-2);opacity:.85;margin-bottom:var(--space-4)}

/* Modal actions */
.p-modal-actions{display:flex;gap:10px;margin-top:var(--space-4);flex-wrap:wrap}

/* ═══ CALENDRIER ═══ */
.p-date-nav{display:flex;align-items:center;justify-content:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.p-date-nav .p-day-title{font-family:var(--font-impact);font-size:clamp(1.6rem,5vw,2.8rem)}
.p-date-nav .p-day-nav-btn{width:clamp(44px,6vw,60px);height:clamp(44px,6vw,60px);font-size:clamp(1.2rem,3vw,1.8rem)}
.p-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(4px,1vw,10px);margin-bottom:var(--space-4)}
.p-cal-header{text-align:center;font-family:var(--font-impact);font-weight:700;font-size:clamp(1rem,2.5vw,1.6rem);padding:clamp(6px,1.5vw,14px) 0;color:var(--ink)}
.p-cal-day{text-align:center;padding:clamp(16px,4vw,36px) 4px;border-radius:var(--r-2);cursor:pointer;font-family:var(--font-body);font-size:clamp(1.2rem,3.5vw,2.2rem);font-weight:700;border:var(--bord);background:#fff;box-shadow:3px 3px 0 var(--ink);transition:all .12s;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.p-cal-day:hover{transform:translateY(-2px);box-shadow:5px 5px 0 var(--ink);background:var(--cream)}
.p-cal-day--today{background:var(--orange);color:#fff;box-shadow:4px 4px 0 var(--ink)}
.p-cal-day--today:hover{background:#e05e00}
.p-cal-day--has-blocs{background:var(--vert);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.p-cal-day--has-blocs:hover{background:#3a9e3e}
.p-cal-day--weekend{opacity:.3;cursor:default;border-color:#ddd;box-shadow:none;background:var(--cream)}
.p-cal-day--weekend:hover{transform:none;box-shadow:none;background:var(--cream)}
.p-cal-day--empty{pointer-events:none;border:none;box-shadow:none;background:transparent}

/* ═══ JOURNEE (blocs timeline) ═══ */
.p-day-header{text-align:center;margin-bottom:var(--space-3)}
.p-day-back{display:inline-block;margin-bottom:var(--space-2);font-size:clamp(1rem,2.5vw,1.4rem);cursor:pointer;opacity:.6}
.p-day-back:hover{opacity:1}
.p-day-main-title{font-family:var(--font-impact);font-size:clamp(2rem,6vw,3.2rem);color:var(--orange);cursor:pointer;margin-bottom:var(--space-2);transition:color .15s;text-align:center}
.p-day-main-title:hover{color:var(--ink)}
.p-day-title-row{display:flex;align-items:center;justify-content:center;gap:var(--space-3);margin-bottom:var(--space-1)}
.p-day-title{font-family:var(--font-fun);font-size:clamp(1.4rem,4.5vw,2.4rem);cursor:pointer;transition:color .15s}
.p-day-title:hover{color:var(--orange)}
.p-bloc-attachments{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.p-bloc-attach{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;background:var(--cream);border:2px solid var(--ink);border-radius:var(--r-pill);font-family:var(--font-fun);font-size:var(--fs-1);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);transition:all .12s}
.p-bloc-attach:hover{background:var(--orange);color:#fff;transform:translateY(-1px)}
.p-attach-preview{max-width:100%;max-height:200px;border-radius:var(--r-2);border:var(--bord);margin-top:8px}
.p-day-nav{display:flex;gap:6px}
.p-day-nav-btn{width:40px;height:40px;border:var(--bord);border-radius:50%;background:#fff;cursor:pointer;box-shadow:var(--ombre);display:flex;align-items:center;justify-content:center;font-size:var(--fs-2)}
.p-day-nav-btn:hover{transform:scale(1.1)}
.p-section-title{font-family:var(--font-impact);font-size:var(--fs-3);margin:var(--space-4) 0 var(--space-3);padding-bottom:var(--space-2);border-bottom:3px solid var(--ink)}
.p-timeline{display:flex;flex-direction:column;gap:var(--space-2)}
.p-bloc{display:flex;align-items:stretch;gap:0;background:#fff;border:3px solid var(--ink);border-radius:var(--r-2);box-shadow:var(--ombre);overflow:hidden;transition:transform .12s}
.p-bloc:hover{transform:translateX(3px)}
.p-bloc-color{width:8px;flex-shrink:0}
.p-bloc-body{flex:1;padding:12px 14px;min-width:0}
.p-bloc-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-bloc-type{font-family:var(--font-impact);font-size:var(--fs-1);padding:2px 10px;border:2px solid var(--ink);border-radius:var(--r-pill);color:#fff;white-space:nowrap}
.p-bloc-titre{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2)}
.p-bloc-times{font-family:var(--font-body);font-size:var(--fs-1);opacity:.6;margin-top:4px}
.p-bloc-detail{font-family:var(--font-body);font-size:var(--fs-1);opacity:.7;margin-top:2px}
.p-bloc-notes{font-size:var(--fs-1);margin-top:6px;padding:8px 10px;background:var(--cream);border-radius:var(--r-1);white-space:pre-wrap;line-height:1.4}
.p-textarea{resize:vertical;min-height:60px;font-family:var(--font-body);font-size:var(--fs-2)}
.p-font-grid{display:flex;flex-wrap:wrap;gap:6px}
.p-font-option{padding:6px 14px;border:3px solid #ddd;border-radius:var(--r-2);cursor:pointer;font-size:var(--fs-1);transition:all .12s}
.p-font-option:hover{border-color:var(--ink);transform:translateY(-1px)}
.p-font-option.selected{border-color:var(--orange);background:var(--orange);color:#fff}
.p-color-grid{display:flex;flex-wrap:wrap;gap:6px}
.p-color-option{width:38px;height:38px;border:3px solid var(--ink);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;transition:all .12s}
.p-color-option:hover{transform:scale(1.15)}
.p-color-option.selected{box-shadow:0 0 0 3px var(--orange),0 0 0 5px #fff}
.p-bloc-actions{display:flex;flex-direction:column;gap:2px;padding:4px;justify-content:center}
.p-bloc-btn{width:36px;height:36px;border:var(--bord);border-radius:var(--r-1);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .1s}
.p-bloc-btn:hover{background:var(--cream)}
.p-bloc-btn--danger:hover{background:var(--rose);color:#fff}
.p-bloc-add{display:flex;justify-content:center;margin:var(--space-3) 0}

/* Gabarit */
.p-gabarit-header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-4)}

/* Type selector in modal */
.p-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:var(--space-3)}
.p-type-option{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:3px solid #ddd;border-radius:var(--r-2);cursor:pointer;font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);transition:all .12s;text-align:center}
.p-type-option:hover{transform:translateY(-2px)}
.p-type-option.selected{border-color:var(--orange);background:rgba(255,107,0,.08)}
.p-type-icon{font-size:24px}

/* Apply modal */
.p-apply-section{margin-bottom:var(--space-4)}

/* ═══ MODE LIVE ═══ */
.p-live{min-height:100vh;padding:var(--space-3)}
.p-live-header{text-align:center;margin-bottom:var(--space-4)}
.p-live-title{font-family:var(--font-impact);font-size:clamp(2rem,6vw,3.4rem);color:var(--orange);margin:var(--space-2) 0}
.p-live-date{font-family:var(--font-fun);font-size:clamp(1.2rem,3.5vw,2rem);margin-bottom:var(--space-1)}
.p-live-clock{font-family:var(--font-impact);font-size:clamp(2rem,7vw,4rem);color:var(--ink);letter-spacing:2px}
.p-live-timeline{display:flex;flex-direction:column;gap:var(--space-3);max-width:900px;margin:0 auto}
.p-live-bloc{background:#fff;border:3px solid var(--ink);border-radius:var(--r-2);padding:clamp(14px,3vw,24px);box-shadow:var(--ombre);transition:all .4s}
.p-live-bloc--active{background:#fffde7;box-shadow:0 0 0 4px var(--orange),var(--ombre-xl);transform:scale(1.02)}
.p-live-bloc--done{opacity:.35;filter:blur(1px);transform:scale(.97)}
.p-live-bloc-head{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.p-live-bloc-titre{font-family:var(--font-impact);font-size:clamp(1.2rem,3.5vw,2rem)}
.p-live-bloc-time{font-family:var(--font-body);font-size:clamp(1rem,2.5vw,1.4rem);opacity:.6;margin-top:4px}
.p-live-bloc-notes{font-family:var(--font-fun);font-size:clamp(1rem,2.5vw,1.3rem);margin-top:8px;padding:10px 14px;background:var(--cream);border-radius:var(--r-1);white-space:pre-wrap}
.p-live-check{width:clamp(40px,6vw,56px);height:clamp(40px,6vw,56px);border:3px solid var(--vert);border-radius:50%;background:#fff;cursor:pointer;font-size:clamp(1.2rem,3vw,1.8rem);display:flex;align-items:center;justify-content:center;transition:all .15s;margin-left:auto;flex-shrink:0}
.p-live-check:hover{background:var(--vert);color:#fff;transform:scale(1.1)}
.p-live-done-badge{font-size:clamp(1.4rem,3vw,2rem);margin-left:auto}

/* ═══ CALENDRIER UNIFIE — toggle Jour/Semaine/Mois + vue Semaine (scope .zts-vue-*) ═══ */
.zts-vue-toggle{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:var(--space-4)}
.zts-vue-tab{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2);padding:8px 18px;border:var(--bord);border-radius:var(--r-pill);background:#fff;cursor:pointer;box-shadow:var(--ombre);transition:all .12s}
.zts-vue-tab:hover{transform:translateY(-2px);box-shadow:var(--ombre-xl)}
.zts-vue-tab--active{background:var(--orange);color:#fff}
.zts-vue-week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(4px,1vw,10px);margin-bottom:var(--space-4);align-items:start}
.zts-vue-week-col{display:flex;flex-direction:column;gap:6px;background:var(--cream);border:var(--bord);border-radius:var(--r-2);padding:6px;box-shadow:var(--ombre);min-height:120px}
.zts-vue-week-col--today{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange),var(--ombre)}
.zts-vue-week-head{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;background:#fff;border:var(--bord);border-radius:var(--r-1);cursor:pointer;transition:all .12s}
.zts-vue-week-head:hover{background:var(--orange);color:#fff;transform:translateY(-1px)}
.zts-vue-week-dow{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1)}
.zts-vue-week-num{font-family:var(--font-impact);font-size:var(--fs-3);line-height:1}
.zts-vue-mini-bloc{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#fff;border:2px solid var(--ink);border-left-width:6px;border-radius:var(--r-1);cursor:pointer;font-family:var(--font-body);transition:transform .1s}
.zts-vue-mini-bloc:hover{transform:translateX(2px)}
.zts-vue-mini-ic{flex-shrink:0}
.zts-vue-mini-titre{flex:1;min-width:0;font-size:var(--fs-1);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zts-vue-mini-times{flex-shrink:0;font-size:clamp(10px,1.4vw,12px);opacity:.6}
.zts-vue-week-empty{text-align:center;padding:10px 4px;font-family:var(--font-fun);font-size:var(--fs-1);opacity:.5;cursor:pointer;border:2px dashed #ccc;border-radius:var(--r-1)}
.zts-vue-week-empty:hover{opacity:.9;border-color:var(--orange);color:var(--orange)}
@media(max-width:640px){
  .zts-vue-week-grid{grid-template-columns:1fr}
  .zts-vue-week-col{flex-direction:row;flex-wrap:wrap;align-items:center;min-height:0}
  .zts-vue-week-head{flex-direction:row;gap:8px;min-width:84px}
  .zts-vue-mini-bloc{flex:1;min-width:140px}

  /* iOS : inputs ≥16px sinon Safari zoome au focus */
  .p-input,.p-select,textarea.p-input{font-size:16px}

  /* Modals : presque pleine largeur, scroll interne, marge sûre + safe-area iPhone */
  .zts-modal{padding:10px}
  .zts-modal__inner{padding:var(--space-4) var(--space-3) calc(var(--space-4) + env(safe-area-inset-bottom));max-height:calc(100dvh - 20px);border-radius:var(--r-3);box-shadow:6px 6px 0 var(--zts-noir)}

  /* Présences : plus de cartes par rangée sur petit écran */
  .p-presence-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--space-2)}
  .p-enfants-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}

  /* Barre de groupe + nav : compactes */
  .p-group-bar{padding:var(--space-2) var(--space-3)}
  .p-nav-btn{padding:8px 11px}

  /* Tableau coordo : la ligne enfant s'empile (nom / détail / bouton 💬) */
  .p-history-item{flex-wrap:wrap;gap:8px}
  .p-history-date{min-width:0;width:100%}
  .p-history-detail{flex:1 1 100%}
  .p-msg-mini-btn{padding:8px 12px}      /* cible tactile plus grande */

  /* Messagerie : corps plus haut, bulles plus larges, composer empilé */
  .p-msg-body{max-height:46dvh}
  .p-msg-thread-list{max-height:62dvh}
  .p-msg-bubble{max-width:90%}
  .p-msg-compose{flex-direction:column;align-items:stretch}
  .p-msg-compose .zts-btn{width:100%}

  /* Journal de bord : 3 humeurs adaptables sans débordement */
  .p-humeur-btn{min-width:0;flex:1 1 28%}
  .p-depart-person{font-size:var(--fs-1);padding:12px 16px}
}

/* Tablette portrait : garder de l'air, modal centré confortable */
@media(min-width:641px) and (max-width:1024px){
  .p-presence-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}

/* ═══ TIROIR JEUX — panneau par-dessus la journée (on ne quitte jamais le calendrier) ═══ */
.tiroir{position:fixed;inset:0;z-index:400;display:none;background:rgba(26,26,46,.55)}
.tiroir.open{display:block}
.tiroir__panel{
  position:absolute;top:0;right:0;bottom:0;width:min(540px,100%);
  background:var(--paper);border-left:5px solid var(--ink);
  box-shadow:-8px 0 0 rgba(26,26,46,.35);
  display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
  padding:var(--space-4) var(--space-3) calc(var(--space-4) + env(safe-area-inset-bottom));
  animation:tiroir-in .22s cubic-bezier(.34,1.3,.64,1);
}
@keyframes tiroir-in{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
.tiroir__head{position:relative;border-bottom:4px solid var(--ink);padding-bottom:var(--space-2);margin-bottom:var(--space-3);
  background:linear-gradient(120deg,rgba(255,107,0,.14),rgba(176,38,255,.14));border-radius:var(--r-2);padding:var(--space-3)}
.tiroir__title{font-family:var(--font-impact);font-size:var(--fs-4);color:var(--orange);text-shadow:2px 2px 0 rgba(26,26,46,.18)}
.tiroir__slot{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2);color:#B026FF;margin-top:2px}
.tiroir__close{position:absolute;top:10px;right:10px;padding:6px 12px;font-size:var(--fs-2);line-height:1}
.tiroir__count{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-1);opacity:.65;margin:2px 2px var(--space-2)}
.tiroir__list{display:flex;flex-direction:column;gap:var(--space-2)}
.tiroir__row{display:flex;align-items:center;gap:var(--space-2);background:#fff;border:3px solid var(--ink);
  border-radius:var(--r-2);box-shadow:var(--ombre);padding:10px 12px}
.tiroir__row-main{flex:1;min-width:0}
.tiroir__row-titre{font-family:var(--font-fun);font-weight:700;font-size:var(--fs-2);line-height:1.2}
.tiroir__row-meta{font-family:var(--font-body);font-size:var(--fs-1);opacity:.65;margin-top:2px}
.tiroir__add{flex-shrink:0;font-size:var(--fs-1);white-space:nowrap}
.tiroir__msg{text-align:center;font-family:var(--font-fun);font-weight:700;padding:var(--space-4);opacity:.75;display:flex;flex-direction:column;gap:var(--space-2);align-items:center}
/* Mobile-first : plein écran sous 720px */
@media(max-width:720px){
  .tiroir__panel{width:100%;border-left:none}
  .tiroir__row{flex-direction:column;align-items:stretch}
  .tiroir__add{width:100%;text-align:center}
}
  </style>
</head>
