<!DOCTYPE html>
<!-- HUB MÉTIER — Camps de jour. Sur le design system partagé. -->
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeux et activités pour camp de jour — Zone Total Sport</title>
  <meta name="description" content="Grands jeux, brise-glaces, activités extérieures, plans B pluie et idées clé en main pour animer ton camp de jour. 100 % gratuit, testé sur le terrain.">

  <link rel="alternate" hreflang="fr" href="https://zonetotalsport.ca/camps-de-jour.html">
  <link rel="alternate" hreflang="en" href="https://zonetotalsport.ca/camps-de-jour.html?lang=en">
  <link rel="alternate" hreflang="x-default" href="https://zonetotalsport.ca/camps-de-jour.html">
  <meta property="og:title" content="Jeux et activités pour camp de jour">
  <meta property="og:description" content="Grands jeux, brise-glaces, activités extérieures, plans B pluie et idées clé en main pour animer ton camp de jour. 100 % gratuit.">
  <meta property="og:image" content="https://zonetotalsport.ca/logo-zts.png">
  <meta property="og:url" content="https://zonetotalsport.ca/camps-de-jour.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zone Total Sport">
  <meta property="og:locale" content="fr_CA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jeux et activités pour camp de jour — Zone Total Sport">
  <meta name="twitter:description" content="Grands jeux, brise-glaces, activités extérieures et idées clé en main pour ton camp de jour.">
  <meta name="twitter:image" content="https://zonetotalsport.ca/logo-zts.png">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"CollectionPage","name":"Activités pour camp de jour","description":"Grands jeux, brise-glaces, activités extérieures et plans B pour animer un camp de jour.","url":"https://zonetotalsport.ca/camps-de-jour.html","isPartOf":{"@type":"WebSite","name":"Zone Total Sport","url":"https://zonetotalsport.ca/"},"breadcrumb":{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Accueil","item":"https://zonetotalsport.ca/"},{"@type":"ListItem","position":2,"name":"Camps de jour","item":"https://zonetotalsport.ca/camps-de-jour.html"}]}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/zts.css">
</head>
<body data-metier="camp" class="has-perso">

  <div data-zts-header></div>

  <nav class="zts-subnav">
    <a href="index.html" data-i18n="subnav.back_home">← Accueil</a>
  </nav>

  <main class="zts-container hub-sheet" style="padding-top:var(--space-4); padding-bottom:var(--space-7);">

    <section class="zts-metier-banner" style="margin-bottom:var(--space-5);">
      <div>
        <span class="zts-metier-banner__pill" data-i18n="hub.camp.pill">Zone Camp</span>
        <h1 style="margin-top:10px;" data-i18n="hub.camp.title">Des étés mémorables.</h1>
        <p style="margin-top:8px; font-family:var(--font-body); font-size:var(--fs-2); max-width:60ch;" data-i18n="hub.camp.intro">Tout pour animer un été de camp complet.</p>
      </div>
    </section>

    <section class="zts-menu" id="menuJour"></section>

    <!-- Cahier de planification intégré (planificateur en iframe) -->
    <section class="zts-plan">
      <h2 class="zts-plan__title">📔 Mon cahier de planification</h2>
      <div class="zts-plan__tabs">
        <button class="zts-plan__tab is-active" data-vue="presences" type="button">📅 Présences</button>
        <button class="zts-plan__tab" data-vue="semaine" type="button">🗓️ Semaine</button>
        <button class="zts-plan__tab" data-vue="jour" type="button">📝 Jour</button>
        <button class="zts-plan__tab zts-plan__fs" data-fs type="button" title="Plein écran">⛶ Plein écran</button>
      </div>
      <iframe class="zts-plan__frame" data-zts-plan-frame title="Planificateur" src="/apps/planificateur/?embed=1&metier=camp&vue=presences" loading="lazy"></iframe>
    </section>
    <script>
    (function(){
      var sec=document.currentScript.previousElementSibling;
      var frame=sec.querySelector('[data-zts-plan-frame]');
      sec.querySelectorAll('.zts-plan__tab[data-vue]').forEach(function(t){
        t.addEventListener('click',function(){
          sec.querySelectorAll('.zts-plan__tab[data-vue]').forEach(function(x){x.classList.remove('is-active');});
          t.classList.add('is-active');
          try{ frame.contentWindow.postMessage({type:'zts-setview',view:t.dataset.vue},'*'); }catch(e){}
        });
      });
      var fs=sec.querySelector('[data-fs]');
      if(fs) fs.addEventListener('click',function(){ try{ (frame.requestFullscreen||frame.webkitRequestFullscreen).call(frame); }catch(e){} });
    })();
    </script>

    <h2 style="font-family:var(--font-impact); font-size:var(--fs-4); margin:var(--space-4) 0 var(--space-3);" data-i18n="hub.active">Apps prêtes à l'emploi</h2>
    <div class="zts-grid" id="gridActive"></div>

    <h2 id="soonTitle" style="font-family:var(--font-impact); font-size:var(--fs-4); margin:var(--space-6) 0 var(--space-3); opacity:.8;" data-i18n="hub.coming">Bientôt disponibles</h2>
    <div class="zts-grid" id="gridSoon"></div>

  </main>

  <div data-zts-footer></div>

  <script src="shared/zts.js"></script>
  <script src="/firebase-auth.js" defer></script>
  <script src="/zts-funnel.js" defer></script>
  <script src="shared/zts-unlock.js"></script>
  <script>
    const ACTIVE = [
      { icon:'🎨', url:'apps/colorier/', tag:'new', fr:{n:'Pages à colorier',d:'Génère, colorie en ligne, imprime · sport & saines habitudes'}, en:{n:'Coloring pages',d:'Generate, color online, print · sport & healthy habits'} },
      { icon:'⚡', url:'https://zonetotalsport.ca/apps/transitions/', tag:'pro', fr:{n:'Boîte à outils camp',d:'Chrono, équipes, musique pour grands jeux'}, en:{n:'Camp toolbox',d:'Timer, teams, music for big games'} },
      { icon:'🎯', url:'https://zonetotalsport.ca/apps/scoreboard/', fr:{n:'Tableau indicateur',d:'Tournois et olympiades'}, en:{n:'Scoreboard',d:'Tournaments and olympics'} },
      { icon:'🎮', url:'https://jeux.zonetotalsport.ca', fr:{n:'Banque de jeux',d:'Grands jeux et plein air'}, en:{n:'Game bank',d:'Big and outdoor games'} },
      { icon:'🎵', url:'https://musique.zonetotalsport.ca', fr:{n:'Musique',d:'Chansons + ambiance grand jeu'}, en:{n:'Music',d:'Songs + big-game vibes'} },
      { icon:'🖍️', url:'https://tni.zonetotalsport.ca', fr:{n:'Tableau blanc TNI',d:'Pour journées intérieures pluie/canicule'}, en:{n:'IWB whiteboard',d:'For indoor rain/heat days'} },
      { icon:'✏️', url:'https://zonetotalsport.ca/blog.html', fr:{n:'Blog',d:'Stratégies d\'animation'}, en:{n:'Blog',d:'Leadership strategies'} },
      { icon:'🤝', url:'https://zonetotalsport.ca/aidons-nous/', fr:{n:'Communauté Camp',d:'Forum coordos et moniteurs'}, en:{n:'Camp Community',d:'Coordinators & counselors forum'} },
      { icon:'🎤', url:'apps/chansons-camp/', tag:'new', fr:{n:'Chansons & cris de camp',d:'Paroles, filtres énergie/thème'}, en:{n:'Camp songs & cheers',d:'Lyrics, energy/theme filters'} },
      { icon:'🏆', url:'apps/grands-jeux/', tag:'new', fr:{n:'Grands jeux',d:'Jeux grands groupes, fiches complètes'}, en:{n:'Big games',d:'Large-group games, full sheets'} },
      { icon:'🏴‍☠️', url:'apps/jeux-par-theme/', tag:'new', fr:{n:'Jeux par thème',d:'Pirates, espace, médiéval, etc.'}, en:{n:'Themed games',d:'Pirates, space, medieval, etc.'} },
      { icon:'😄', url:'apps/brise-glace/', tag:'new', fr:{n:'Brise-glace',d:'Présentation de début de semaine'}, en:{n:'Ice-breakers',d:'Start-of-week intros'} },
      { icon:'🔥', url:'apps/veillee-feu-de-camp/', tag:'new', fr:{n:'Veillée / feu de camp',d:'Activités de soirée'}, en:{n:'Evening / campfire',d:'Evening activities'} },
      { icon:'💦', url:'apps/jeux-eau/', tag:'new', fr:{n:'Jeux d\'eau',d:'Pour les chaudes journées'}, en:{n:'Water games',d:'For hot days'} },
      { icon:'🏷️', url:'apps/noms-de-clans/', tag:'new', fr:{n:'Générateur de noms de clans',d:'Noms d\'équipe aléatoires'}, en:{n:'Clan name generator',d:'Random team names'} },
      { icon:'🗺️', url:'apps/rallyes/', tag:'new', fr:{n:'Rallyes / chasses au trésor',d:'Modèles + générateur d\'indices'}, en:{n:'Rallies / treasure hunts',d:'Templates + clue generator'} },
      { icon:'🏅', url:'apps/olympiades/', tag:'new', fr:{n:'Olympiades / tournois',d:'Pointage inter-équipes'}, en:{n:'Olympics / tournaments',d:'Inter-team scoring'} }
    ];
    const SOON = [];

    // ===== Menu du jour Camp (bilingue) =====
    const MENU = {
      fr:{
        weather:{tag:'EXTÉRIEUR', note:'☀️ Idéal pour un grand jeu', suggTitle:'★ Suggestions par âge', sugg:[
          {cyc:'6-8',name:'Course aux trésors',desc:'Indices simples, équipes de 4, parcours autour du camp.'},
          {cyc:'9-11',name:'Capture du drapeau',desc:'Classique en 2 équipes. Stratégie + course.'},
          {cyc:'12+',name:'Olympiades thématiques',desc:'Épreuves variées avec système de points.'}]},
        game:{tag:'🏕️ Pour le terrain', name:'CAPTURE DRAPEAU', desc:'Deux équipes, deux drapeaux à protéger ou capturer. Stratégie d\'équipe, course folle, prison à délivrer. Le classique des camps!', chips:['Équipes','Plein air','8 ans +']},
        challenge:{tag:'🏕️ Cercle de feu', name:'LE PLUS BEAU MOMENT', desc:'Chacun nomme son meilleur moment de la journée.', box:'On termine en chantant la chanson du camp tous ensemble.'}
      },
      en:{
        weather:{tag:'OUTDOOR', note:'☀️ Perfect for a big game', suggTitle:'★ Suggestions by age', sugg:[
          {cyc:'6-8',name:'Treasure race',desc:'Simple clues, teams of 4, course around camp.'},
          {cyc:'9-11',name:'Capture the flag',desc:'2-team classic. Strategy + running.'},
          {cyc:'12+',name:'Themed olympics',desc:'Varied events with a points system.'}]},
        game:{tag:'🏕️ For the field', name:'CAPTURE THE FLAG', desc:'Two teams, two flags to protect or capture. Team strategy, wild running, a jail to free. The camp classic!', chips:['Teams','Outdoors','Age 8+']},
        challenge:{tag:'🏕️ Campfire circle', name:'BEST MOMENT', desc:'Everyone names their best moment of the day.', box:'End by singing the camp song all together.'}
      }
    };
    function renderMenu(){
      const m = MENU[ZTS.getLang()];
      document.getElementById('menuJour').innerHTML = `
        <h2 class="zts-menu__title">${ZTS.t('hub.menu_title')}</h2>
        <div class="zts-menu__grid">
          <div class="zts-menu__card">
            <h3>${ZTS.t('hub.menu_weather')}</h3>
            <span class="zts-menu__tag">${m.weather.tag}</span>
            <div class="zts-menu__desc">${m.weather.note}</div>
            <div class="zts-menu__small">${m.weather.suggTitle}</div>
            <ul class="zts-menu__list">${m.weather.sugg.map(s=>`<li><span class="cyc">${s.cyc}</span>${s.name} — <span style="opacity:.8">${s.desc}</span></li>`).join('')}</ul>
          </div>
          <div class="zts-menu__card">
            <h3>${ZTS.t('hub.menu_game')}</h3>
            <span class="zts-menu__tag">${m.game.tag}</span>
            <div class="zts-menu__name">${m.game.name}</div>
            <div class="zts-menu__small">${ZTS.t('hub.menu_howplay')}</div>
            <div class="zts-menu__desc">${m.game.desc}</div>
            <div class="zts-menu__chips">${m.game.chips.map(c=>`<span>${c}</span>`).join('')}</div>
          </div>
          <div class="zts-menu__card">
            <h3>${ZTS.t('hub.menu_challenge')}</h3>
            <span class="zts-menu__tag">${m.challenge.tag}</span>
            <div class="zts-menu__name">${m.challenge.name}</div>
            <div class="zts-menu__desc">${m.challenge.desc}</div>
            <div class="zts-menu__small">${ZTS.t('hub.menu_todo')}</div>
            <div class="zts-menu__box">${m.challenge.box}</div>
          </div>
        </div>`;
    }

    function tagHtml(tag){
      if(!tag) return '';
      const key = tag==='ia'?'tag.ia':tag==='new'?'tag.new':'tag.pro';
      return `<span class="zts-tag zts-tag--${tag}">${ZTS.t(key)}</span>`;
    }
    function renderHub(){
      renderMenu();
      const L = ZTS.getLang();
      document.getElementById('gridActive').innerHTML = ACTIVE.map(a=>`
        <a class="zts-app-card" href="${a.url}" target="_blank" rel="noopener">
          ${tagHtml(a.tag)}
          <span class="zts-app-card__icon">${a.icon}</span>
          <span class="zts-app-card__name">${a[L].n}</span>
          <span class="zts-app-card__desc">${a[L].d}</span>
        </a>`).join('');
      document.getElementById('gridSoon').innerHTML = SOON.map(a=>`
        <div class="zts-app-card is-soon" aria-disabled="true">
          <span class="zts-tag zts-tag--soon">${ZTS.t('tag.soon')}</span>
          <span class="zts-app-card__icon">${a.icon}</span>
          <span class="zts-app-card__name">${a[L].n}</span>
          <span class="zts-app-card__desc">${a[L].d}</span>
        </div>`).join('');
      const hasSoon = SOON.length>0;
      document.getElementById('soonTitle').hidden = !hasSoon;
      document.getElementById('gridSoon').hidden = !hasSoon;
    }
    document.addEventListener('zts:ready', renderHub);
    document.addEventListener('zts:langchange', renderHub);
  </script>
</body>
</html>
